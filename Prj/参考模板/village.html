<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的学习村庄</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --sky: #78C8F0;
  --sky-dark: #4A9EC8;
  --grass: #5D9C3C;
  --grass-dark: #3E7228;
  --dirt: #9B7340;
  --cream: #FFF8EE;
  --cream-dark: #F5EDD8;
  --mc-dark: #1A1A1A;
  --mc-panel: rgba(16,16,16,0.88);
  --mc-panel-border: rgba(255,255,255,0.12);
  --gold: #FFD700;
  --gold-dark: #CC9900;
  --orange: #FF6B35;
  --orange-light: #FFE4D6;
  --blue: #4A90D9;
  --green: #5BAD6F;
  --green-dark: #3A7D4A;
  --purple: #9B59B6;
  --red: #E85D5D;
  --yellow: #FFD166;
  --font-pixel: 'Press Start 2P', monospace;
  --font-main: 'Nunito', sans-serif;
  --font-body: 'Nunito Sans', sans-serif;
  --radius: 6px;
  --radius-lg: 16px;
  --panel-shadow: 0 8px 32px rgba(0,0,0,0.45);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: var(--font-main);
  background: var(--sky);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
}

/* ─── CANVAS WORLD ─── */
#world-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

/* ─── HUD HEADER ─── */
.hud-top {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 100%);
  pointer-events: none;
}
.hud-top > * { pointer-events: auto; }

.village-title {
  font-family: var(--font-pixel);
  font-size: 11px;
  color: white;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
  letter-spacing: 0.05em;
}

.hud-stats {
  display: flex;
  align-items: center;
  gap: 12px;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.6);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 800;
  color: white;
  font-family: var(--font-main);
}
.stat-pill .stat-icon { font-size: 16px; }
.stat-pill .stat-val { color: var(--gold); }

.streak-pill {
  background: rgba(200,80,0,0.7);
  border-color: var(--orange);
}
.streak-pill .stat-val { color: #FFB366; }

/* ─── BUILDINGS ─── */
.buildings-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.building {
  position: absolute;
  cursor: pointer;
  pointer-events: auto;
  transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), filter 0.15s;
  transform-origin: bottom center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.building:hover { transform: scale(1.06) translateY(-6px); filter: brightness(1.15) drop-shadow(0 8px 0 rgba(0,0,0,0.3)); }
.building:active { transform: scale(0.97); }

.building-img {
  image-rendering: pixelated;
  display: block;
  position: relative;
}

.building-label {
  background: rgba(0,0,0,0.75);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 6px;
  padding: 4px 10px;
  font-family: var(--font-pixel);
  font-size: 7px;
  color: white;
  white-space: nowrap;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
}

.building-progress {
  position: absolute;
  bottom: -4px; left: 50%;
  transform: translateX(-50%);
  width: 64px; height: 8px;
  background: rgba(0,0,0,0.6);
  border: 2px solid rgba(255,255,255,0.25);
  border-radius: 2px;
  overflow: hidden;
}
.building-progress-fill {
  height: 100%;
  background: repeating-linear-gradient(90deg, var(--green) 0, var(--green) 10px, var(--green-dark) 10px, var(--green-dark) 13px);
  transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1);
}

/* Decoration badges (achievement unlocks) */
.deco {
  position: absolute;
  pointer-events: none;
  image-rendering: pixelated;
  opacity: 0;
  transition: opacity 0.3s;
}
.deco.visible { opacity: 1; }

/* ─── STEVE CHARACTER ─── */
.steve {
  position: fixed;
  bottom: 28%;
  z-index: 50;
  pointer-events: auto;
  cursor: pointer;
  image-rendering: pixelated;
  transition: transform 0.1s;
}
.steve:hover { filter: brightness(1.2); }

.speech-bubble {
  position: fixed;
  background: rgba(0,0,0,0.85);
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 700;
  color: white;
  max-width: 200px;
  text-align: center;
  pointer-events: none;
  z-index: 200;
  opacity: 0;
  transform: scale(0.8) translateY(10px);
  transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  line-height: 1.5;
}
.speech-bubble.show { opacity: 1; transform: scale(1) translateY(0); }
.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -10px; left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: rgba(255,255,255,0.3);
}

/* ─── ZONE PANEL ─── */
.zone-panel-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  backdrop-filter: blur(3px);
}
.zone-panel-overlay.open { opacity: 1; pointer-events: auto; }

.zone-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--mc-dark);
  border-top: 3px solid rgba(255,255,255,0.15);
  border-radius: 24px 24px 0 0;
  z-index: 400;
  padding: 0 0 40px;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.34,1.15,0.64,1);
  max-height: 75vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.zone-panel.open { transform: translateY(0); }

.zone-panel-handle {
  width: 40px; height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  margin: 12px auto 0;
  flex-shrink: 0;
}

.zone-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 12px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.zone-header-left { display: flex; align-items: center; gap: 12px; }

.zone-icon-wrap {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
}

.zone-title-block {}
.zone-name {
  font-family: var(--font-pixel);
  font-size: 9px;
  color: white;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
  margin-bottom: 4px;
}
.zone-meta {
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  font-family: var(--font-body);
}
.zone-meta span { color: var(--gold); font-weight: 700; }

.zone-close-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
}
.zone-close-btn:hover { background: rgba(255,255,255,0.18); }

.zone-panel-body {
  overflow-y: auto;
  padding: 16px 20px;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}
.zone-panel-body::-webkit-scrollbar { display: none; }

/* Course cards grid */
.course-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 12px;
}

.course-card {
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s, background 0.15s;
  position: relative;
}
.course-card:hover {
  transform: translateY(-3px);
  border-color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.1);
}
.course-card:active { transform: scale(0.97); }
.course-card.completed { border-color: rgba(91,173,111,0.5); }
.course-card.locked { opacity: 0.5; cursor: not-allowed; }

.course-thumb {
  height: 80px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  position: relative;
}

.course-stars {
  position: absolute;
  top: 6px; right: 6px;
  font-size: 11px;
  letter-spacing: -1px;
}

.lock-overlay {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.4);
  font-size: 24px;
}

.course-info {
  padding: 10px 10px 12px;
}
.course-title {
  font-size: 12px;
  font-weight: 800;
  color: white;
  line-height: 1.3;
  margin-bottom: 4px;
}
.course-lesson {
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  font-family: var(--font-body);
}
.course-duration {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-top: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  padding: 3px 7px;
  font-size: 10px;
  color: rgba(255,255,255,0.6);
  font-family: var(--font-body);
}

/* ─── DAILY MISSION BOARD ─── */
.mission-board {
  position: fixed;
  top: 70px; right: 16px;
  z-index: 100;
  background: rgba(10,10,10,0.82);
  border: 2px solid rgba(255,213,0,0.35);
  border-radius: 12px;
  padding: 10px 14px;
  min-width: 150px;
  backdrop-filter: blur(4px);
}
.mission-title {
  font-family: var(--font-pixel);
  font-size: 7px;
  color: var(--gold);
  margin-bottom: 8px;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
}
.mission-task {
  font-size: 11px;
  font-weight: 700;
  color: white;
  line-height: 1.5;
  margin-bottom: 6px;
}
.mission-reward {
  font-size: 12px;
  color: var(--gold);
  font-weight: 800;
}
.mission-done {
  font-size: 10px;
  color: var(--green);
  font-weight: 700;
  margin-top: 4px;
  display: none;
}

/* ─── ACHIEVEMENT TOAST ─── */
.achievement-toast {
  position: fixed;
  top: 80px; left: 50%;
  transform: translateX(-50%) translateY(-120px);
  z-index: 500;
  background: rgba(0,0,0,0.9);
  border: 3px solid var(--gold);
  border-radius: 16px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 280px;
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.achievement-toast.show { transform: translateX(-50%) translateY(0); }
.achievement-icon { font-size: 32px; flex-shrink: 0; }
.achievement-text {}
.achievement-title {
  font-family: var(--font-pixel);
  font-size: 8px;
  color: var(--gold);
  margin-bottom: 4px;
}
.achievement-desc { font-size: 12px; color: white; font-weight: 700; line-height: 1.4; }

/* ─── WELCOME SCREEN ─── */
.welcome-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
  transition: opacity 0.4s;
}
.welcome-overlay.hidden { opacity: 0; pointer-events: none; }

.welcome-card {
  background: var(--mc-dark);
  border: 3px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 32px 28px;
  text-align: center;
  max-width: 340px;
  width: 90%;
  animation: welcomePop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes welcomePop {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.welcome-title {
  font-family: var(--font-pixel);
  font-size: 12px;
  color: var(--gold);
  line-height: 1.7;
  margin-bottom: 12px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
}
.welcome-sub {
  font-size: 15px;
  color: rgba(255,255,255,0.75);
  margin-bottom: 24px;
  line-height: 1.6;
  font-family: var(--font-body);
}
.welcome-btn {
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 14px 32px;
  font-family: var(--font-pixel);
  font-size: 9px;
  cursor: pointer;
  box-shadow: 0 6px 0 rgba(150,40,0,0.6), 0 8px 20px rgba(255,107,53,0.4);
  transition: transform 0.1s, box-shadow 0.1s;
}
.welcome-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 rgba(150,40,0,0.6), 0 12px 24px rgba(255,107,53,0.5); }
.welcome-btn:active { transform: translateY(2px); box-shadow: 0 4px 0 rgba(150,40,0,0.6); }

/* ─── LOCKED HINT ─── */
.locked-hint {
  position: fixed;
  bottom: 120px; left: 50%;
  transform: translateX(-50%) scale(0.8);
  z-index: 500;
  background: rgba(20,20,20,0.95);
  border: 2px solid rgba(255,107,53,0.5);
  border-radius: 12px;
  padding: 12px 18px;
  text-align: center;
  opacity: 0;
  transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none;
  max-width: 260px;
}
.locked-hint.show { opacity: 1; transform: translateX(-50%) scale(1); }
.locked-hint p { font-size: 13px; color: white; font-weight: 700; line-height: 1.5; }
.locked-hint small { font-size: 11px; color: rgba(255,107,53,0.8); }

/* ─── PARTICLES ─── */
.particle {
  position: fixed;
  pointer-events: none;
  z-index: 450;
  animation: particleFly 1.5s ease-out forwards;
}
@keyframes particleFly {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
}
</style>
</head>
<body>

<!-- World Canvas (sky, clouds, ground) -->
<canvas id="world-canvas"></canvas>

<!-- Buildings Layer -->
<div class="buildings-layer" id="buildings-layer"></div>

<!-- HUD Top -->
<div class="hud-top">
  <div class="village-title">🏘️ 我的学习村庄</div>
  <div class="hud-stats">
    <div class="stat-pill streak-pill" id="streak-pill">
      <span class="stat-icon">🔥</span>
      <span class="stat-val" id="streak-val">0</span>
      <span style="font-size:11px;color:rgba(255,255,255,.6)">天</span>
    </div>
    <div class="stat-pill">
      <span class="stat-icon">⭐</span>
      <span class="stat-val" id="stars-val">0</span>
    </div>
  </div>
</div>

<!-- Daily Mission Board -->
<div class="mission-board">
  <div class="mission-title">📋 今日任务</div>
  <div class="mission-task" id="mission-task">完成一节英语课</div>
  <div class="mission-reward" id="mission-reward">奖励：⭐⭐</div>
  <div class="mission-done" id="mission-done">✓ 已完成！</div>
</div>

<!-- Steve Character -->
<div class="steve" id="steve" style="left:50%;transform:translateX(-50%)">
  <svg width="48" height="72" viewBox="0 0 16 24" xmlns="http://www.w3.org/2000/svg" style="image-rendering:pixelated;filter:drop-shadow(2px 2px 0 rgba(0,0,0,0.5))">
    <!-- Head -->
    <rect x="4" y="0" width="8" height="8" fill="#C68642"/>
    <rect x="5" y="2" width="2" height="2" fill="#5B3C1F"/>
    <rect x="9" y="2" width="2" height="2" fill="#5B3C1F"/>
    <rect x="6" y="5" width="4" height="1" fill="#5B3C1F"/>
    <rect x="4" y="0" width="8" height="1" fill="#A0522D"/>
    <!-- Hair -->
    <rect x="4" y="0" width="8" height="2" fill="#5B3C1F"/>
    <rect x="4" y="0" width="1" height="4" fill="#5B3C1F"/>
    <rect x="11" y="0" width="1" height="4" fill="#5B3C1F"/>
    <!-- Body -->
    <rect x="4" y="9" width="8" height="7" fill="#1E5FA5"/>
    <rect x="4" y="9" width="8" height="1" fill="#2775C8"/>
    <!-- Arms -->
    <rect x="1" y="9" width="3" height="7" fill="#C68642"/>
    <rect x="12" y="9" width="3" height="7" fill="#C68642"/>
    <!-- Legs -->
    <rect x="4" y="17" width="3" height="6" fill="#5C3D1E"/>
    <rect x="9" y="17" width="3" height="6" fill="#5C3D1E"/>
    <rect x="4" y="21" width="3" height="2" fill="#4A4A4A"/>
    <rect x="9" y="21" width="3" height="2" fill="#4A4A4A"/>
  </svg>
</div>

<!-- Speech Bubble -->
<div class="speech-bubble" id="speech-bubble"></div>

<!-- Zone Panel Overlay -->
<div class="zone-panel-overlay" id="panel-overlay" onclick="closePanel()"></div>

<!-- Zone Panel -->
<div class="zone-panel" id="zone-panel">
  <div class="zone-panel-handle"></div>
  <div class="zone-panel-header" id="zone-panel-header">
    <div class="zone-header-left">
      <div class="zone-icon-wrap" id="zone-icon-wrap"></div>
      <div class="zone-title-block">
        <div class="zone-name" id="zone-name"></div>
        <div class="zone-meta" id="zone-meta"></div>
      </div>
    </div>
    <button class="zone-close-btn" onclick="closePanel()">✕</button>
  </div>
  <div class="zone-panel-body">
    <div class="course-grid" id="course-grid"></div>
  </div>
</div>

<!-- Achievement Toast -->
<div class="achievement-toast" id="achievement-toast">
  <div class="achievement-icon" id="ach-icon">🏆</div>
  <div class="achievement-text">
    <div class="achievement-title">成就解锁！</div>
    <div class="achievement-desc" id="ach-desc"></div>
  </div>
</div>

<!-- Locked Hint -->
<div class="locked-hint" id="locked-hint">
  <p>🔒 区域未解锁</p>
  <small id="locked-hint-msg">先完成更多课程吧！</small>
</div>

<!-- Welcome Overlay -->
<div class="welcome-overlay" id="welcome-overlay">
  <div class="welcome-card">
    <div style="font-size:56px;margin-bottom:12px;">🏡</div>
    <div class="welcome-title">欢迎回到<br>你的村庄！</div>
    <div class="welcome-sub">村庄在等着你，<br>每完成一课，村庄就会成长！</div>
    <button class="welcome-btn" onclick="startGame()">出发探险！▶</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════
   DATA — Zone & Course Configuration
════════════════════════════════════════ */
const ZONES = {
  english: {
    name: '英语学校',

      { id:'english-04-numbers', title:'数字1-10', emoji:'🔢', lesson:'第4课', duration:'7分钟', completed:false, stars:0, locked:false },
      { id:'english-05-animals', title:'动物朋友', emoji:'🐾', lesson:'第5课', duration:'6分钟', completed:false, stars:0, locked:false },
      { id:'english-06-family', title:'我的家人', emoji:'👨‍👩‍👧', lesson:'第6课', duration:'5分钟', completed:false, stars:0, locked:false },

  },
  chinese: {
    name: '中文图书馆',

    color: '#FF8A65',
    colorDark: '#CC5A35',
    pos: { x: 0.58, y: 0.36 },
    size: { w: 130, h: 115 },
    unlockAt: 0,

function getDefaultState() {
  return {
    version: 1,
    lastVisit: '',
    totalStars: 0,
    streakDays: 0,
    zones: {
      english: { completed:[], stars:{}, totalCompleted:0 },
      chinese: { completed:[], stars:{}, totalCompleted:0 },
      math:    { completed:[], stars:{}, totalCompleted:0 },
      songs:   { completed:[], stars:{}, totalCompleted:0 },
      science: { completed:[], stars:{}, totalCompleted:0 }
    },
    decorations: { school_flag:false, library_bookshelf:false, village_lamp:false, bob_resident:false, secret_chest:false, rainbow:false },
    badges: [],
    dailyMission: { date:'', task:'', reward:2, completed:false },
    firstVisit: true
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem('village_state');
    const s = raw ? JSON.parse(raw) : getDefaultState();
    // Merge zone progress from ZONES config into state
    Object.entries(ZONES).forEach(([zone, cfg]) => {
      if (!s.zones[zone]) s.zones[zone] = { completed:[], stars:{}, totalCompleted:0 };
    });
    return s;
  } catch(e) { return getDefaultState(); }
}
function saveState(s) { localStorage.setItem('village_state', JSON.stringify(s)); }

/* ════════════════════════════════════════
   CANVAS — Pixel World Background
════════════════════════════════════════ */
function drawWorld() {
  const canvas = document.getElementById('world-canvas');
  const W = canvas.width = window.innerWidth;
  const H = canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');

  // Sky gradient (pixelated bands)
  const skyColors = ['#A0D8F8','#87CEEB','#78C8F0','#6BBDE8','#5FAEE0'];
  const bandH = Math.ceil(H * 0.65 / skyColors.length);
  skyColors.forEach((c,i) => {
    ctx.fillStyle = c;
    ctx.fillRect(0, i*bandH, W, bandH+1);
  });

  // Sun
  ctx.fillStyle = '#FFE066';
  for(let sy=60;sy<100;sy+=4) {
    for(let sx=W-120;sx<W-80;sx+=4) {
      ctx.fillRect(sx,sy,4,4);
    }
  }
  // Sun glow
  ctx.fillStyle = 'rgba(255,220,50,0.15)';
  ctx.beginPath();
  ctx.arc(W-100, 80, 60, 0, Math.PI*2);
  ctx.fill();

  // Clouds (pixel style)
  function drawCloud(x, y, scale=1) {
    const blocks = [
      [1,0,2,1],[0,1,4,1],[0,2,5,2],[0,3,4,1],
      [1,1,1,3],[3,0,2,2]
    ];
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    blocks.forEach(([bx,by,bw,bh]) => {
      ctx.fillRect(x+bx*10*scale, y+by*8*scale, bw*10*scale, bh*8*scale);
    });
  }
  drawCloud(60, 30, 1.2);
  drawCloud(W*0.35, 20, 1.0);
  drawCloud(W*0.6, 50, 0.9);
  drawCloud(W*0.85, 25, 1.1);

  // Ground — layered terrain
  const groundY = H * 0.68;

  // Grass top
  for(let x=0;x<W;x+=8) {
    const h = 8 + Math.sin(x*0.07)*4 + Math.random()*3;
    ctx.fillStyle = (Math.floor(x/8)%2===0) ? '#5D9C3C' : '#68B046';
    ctx.fillRect(x, groundY, 8, h);
  }

  // Dirt layers
  const dirtColors = ['#9B7340','#8B6530','#7A5420'];
  dirtColors.forEach((c,i) => {
    ctx.fillStyle = c;
    ctx.fillRect(0, groundY + 8 + i*12, W, 13);
  });

  // Stone base
  ctx.fillStyle = '#888888';
  ctx.fillRect(0, groundY+44, W, H);

  // Stone pattern
  ctx.fillStyle = '#777777';
  for(let x=0;x<W;x+=32) {
    for(let y=groundY+44;y<H;y+=16) {
      ctx.fillRect(x + (Math.floor(y/16)%2)*16, y, 15, 15);
    }
  }

  // Path (dirt road)
  const pathX = W*0.45;
  ctx.fillStyle = '#B8923F';
  for(let y=groundY;y<H;y+=8) {
    const jitter = Math.sin(y*0.2)*8;
    ctx.fillRect(pathX+jitter-24, y, 48, 9);
  }
  // Path dots
  ctx.fillStyle = '#C8A050';
  for(let y=groundY+4;y<H;y+=20) {
    ctx.fillRect(pathX-4, y, 8, 4);
  }

  // Flowers
  const flowerColors = ['#FF6B6B','#FFD166','#FF8BE8','#6BCFFF'];
  for(let i=0;i<25;i++) {
    const fx = Math.random()*W;
    const fy = groundY + 2 + Math.random()*6;
    ctx.fillStyle = '#5D9C3C';
    ctx.fillRect(fx, fy-6, 2, 6);
    ctx.fillStyle = flowerColors[Math.floor(Math.random()*flowerColors.length)];
    ctx.fillRect(fx-3, fy-8, 8, 6);
  }

  // Trees
  function drawTree(x, y) {
    // Trunk
    ctx.fillStyle = '#7A5220';
    ctx.fillRect(x-4, y-24, 8, 24);
    // Leaves (3 layers)
    [[0,-40,32,20],[−4,-52,40,16],[−2,-60,36,14]].forEach(([lx,ly,lw,lh]) => {
      ctx.fillStyle = (Math.random()>0.5)?'#2E8B22':'#3A9E2C';
      ctx.fillRect(x+lx, y+ly, lw, lh);
    });
  }
  drawTree(W*0.05, groundY+6);
  drawTree(W*0.12, groundY+4);
  drawTree(W*0.92, groundY+5);
  drawTree(W*0.97, groundY+7);
}

/* ════════════════════════════════════════
   BUILDINGS — Render Pixel Buildings
════════════════════════════════════════ */
function renderBuildings(state) {
  const layer = document.getElementById('buildings-layer');
  layer.innerHTML = '';
  const W = window.innerWidth;
  const H = window.innerHeight;
  const groundY = H * 0.68;

  Object.entries(ZONES).forEach(([zoneId, cfg]) => {
    const x = cfg.pos.x * W;
    const y = groundY - cfg.size.h * 0.5;
    const zState = state.zones[zoneId];
    const totalCount = cfg.courses.length;
    const completed = zState.totalCompleted;
    const pct = totalCount > 0 ? (completed/totalCount*100) : 0;
    const isUnlocked = isZoneUnlocked(zoneId, state);

    const el = document.createElement('div');
    el.className = 'building';
    el.id = `building-${zoneId}`;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = 'translateX(-50%)';
    el.dataset.zone = zoneId;

    const svgHtml = getBuildingSVG(zoneId, cfg, isUnlocked);

    el.innerHTML = `
      <div class="building-img" style="width:${cfg.size.w}px;height:${cfg.size.h}px;position:relative;">
        ${svgHtml}
        ${!isUnlocked ? `<div style="position:absolute;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;border-radius:4px;"><span style="font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))">🔒</span></div>` : ''}
        <div class="building-progress" style="position:absolute;bottom:4px;left:50%;transform:translateX(-50%);">
          <div class="building-progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
      <div class="building-label">${cfg.icon} ${cfg.name}</div>
    `;

    el.addEventListener('click', () => onBuildingClick(zoneId, isUnlocked));
    layer.appendChild(el);
  });
}

function isZoneUnlocked(zoneId, state) {
  const req = ZONES[zoneId].unlockAt;
  if (req === 0) return true;
  const total = Object.values(state.zones).reduce((a,z)=>a+z.totalCompleted,0);
  return total >= req;
}

    showLockedHint(zoneId);

  openPanel(zoneId);
  playClick();

function openPanel(zoneId) {
  const state = loadState();
  const cfg = ZONES[zoneId];
  const zState = state.zones[zoneId];

  document.getElementById('zone-icon-wrap').style.background = cfg.color + '33';
  document.getElementById('zone-icon-wrap').textContent = cfg.icon;
  document.getElementById('zone-name').textContent = cfg.name;

  const completed = zState.totalCompleted;
  const total = cfg.courses.length;
  document.getElementById('zone-meta').innerHTML =
    `已完成 <span>${completed}</span> / ${total} 课 · ${cfg.description}`;

  const grid = document.getElementById('course-grid');
  grid.innerHTML = '';

  cfg.courses.forEach((course, idx) => {
    const isDone = zState.completed.includes(course.id);
    const stars = zState.stars[course.id] || 0;
    const isLocked = idx > 0 && !zState.completed.includes(cfg.courses[idx-1].id);

    const card = document.createElement('div');
    card.className = `course-card${isDone?' completed':''}${isLocked?' locked':''}`;

    const thumbColors = ['#4A90D9','#FF6B35','#5BAD6F','#F48FB1','#9B59B6','#FFD166','#E85D5D','#3AA6A6'];
    const bg = thumbColors[idx % thumbColors.length];

    card.innerHTML = `
      <div class="course-thumb" style="background:${bg}20">
        <span style="font-size:36px">${course.emoji}</span>
        ${isDone && stars > 0 ? `<div class="course-stars">${'⭐'.repeat(stars)}</div>` : ''}
        ${isLocked ? '<div class="lock-overlay">🔒</div>' : ''}
        ${isDone ? '<div style="position:absolute;top:6px;left:6px;background:#5BAD6F;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;">✓</div>' : ''}
      </div>
      <div class="course-info">
        <div class="course-title">${course.title}</div>
        <div class="course-lesson">${course.lesson}</div>
        <div class="course-duration">⏱ ${course.duration}</div>
      </div>`;

    if (!isLocked) {
      card.addEventListener('click', () => openCourse(course, zoneId));
    }
    grid.appendChild(card);
  });

  document.getElementById('panel-overlay').classList.add('open');
  document.getElementById('zone-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel-overlay').classList.remove('open');
  document.getElementById('zone-panel').classList.remove('open');
}

function openCourse(course, zoneId) {
  // In production: window.open(`../courseware/${course.id}.html`, '_blank')
  // For demo: simulate completion
  if (!course.completed) {
    simulateCourseComplete(course.id, zoneId, 2);
  } else {
    showToast('已完成这节课！再去看看其他课程吧 🎉');
  }
}

/* ════════════════════════════════════════
   COURSE COMPLETION (called by courseware)
════════════════════════════════════════ */
function simulateCourseComplete(courseId, zoneId, stars) {
  const state = loadState();
  if (!state.zones[zoneId].completed.includes(courseId)) {
    state.zones[zoneId].completed.push(courseId);
    state.zones[zoneId].totalCompleted++;
    state.totalStars += stars;
  }
  state.zones[zoneId].stars[courseId] = stars;
  updateStreak(state);
  saveState(state);

  closePanel();
  setTimeout(() => {
    spawnParticles(window.innerWidth/2, window.innerHeight*0.5);
    updateHUD(state);
    renderBuildings(state);
    checkAndUnlockDecorations(state);
    steveSpeak(['太棒了！学完一课！', '好厉害！继续加油！', '你真棒！村庄在成长！'][Math.floor(Math.random()*3)]);
    checkDailyMission(state);
  }, 400);
}

/* ════════════════════════════════════════
   ACHIEVEMENTS
════════════════════════════════════════ */
function checkAndUnlockDecorations(state) {
  let newUnlock = null;
  DECORATION_RULES.forEach(rule => {
    if (!state.decorations[rule.id] && rule.condition(state)) {
      state.decorations[rule.id] = true;
      newUnlock = rule;
    }
  });
  if (newUnlock) {
    saveState(state);
    setTimeout(() => showAchievement(newUnlock), 1200);
  }
}

function showAchievement(rule) {
  const toast = document.getElementById('achievement-toast');
  document.getElementById('ach-icon').textContent = rule.icon;
  document.getElementById('ach-desc').textContent = rule.msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

/* ════════════════════════════════════════
   STEVE ANIMATION
════════════════════════════════════════ */
let steveX = 50; // percent
let steveDir = 1;
let steveFrame = 0;
let steveAnim;

function startSteve() {
  const steve = document.getElementById('steve');
  steveAnim = setInterval(() => {
    steveX += steveDir * 0.3;
    if (steveX > 70) steveDir = -1;
    if (steveX < 30) steveDir = 1;

    steve.style.left = steveX + '%';
    // Flip sprite
    steve.querySelector('svg').style.transform = steveDir > 0 ? '' : 'scaleX(-1)';
    // Bobbing walk
    steveFrame++;
    const bob = Math.sin(steveFrame * 0.2) * 3;
    steve.style.marginBottom = bob + 'px';
  }, 50);

  document.getElementById('steve').addEventListener('click', () => {
    const lines = [
      '今天想去哪里学习？🏫',
      '我们去图书馆吧！📚',
      '数学集市有好吃的！🍎',
      '加油，你可以的！💪',
      '我们一起学习吧！😊',
      '完成课程，村庄会变漂亮！🏘️'
    ];
    steveSpeak(lines[Math.floor(Math.random()*lines.length)]);
  });
}

function steveSpeak(text) {
  const steve = document.getElementById('steve');
  const rect = steve.getBoundingClientRect();
  const bubble = document.getElementById('speech-bubble');
  bubble.textContent = text;
  bubble.style.left = (rect.left + rect.width/2 - 100) + 'px';
  bubble.style.top = (rect.top - 80) + 'px';
  bubble.classList.add('show');

  // TTS
  if (window.speechSynthesis) {
    const utt = new SpeechSynthesisUtterance(text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9，。！？\s]/g,''));
    utt.lang = 'zh-CN';
    utt.rate = 0.9;
    window.speechSynthesis.speak(utt);
  }

  setTimeout(() => bubble.classList.remove('show'), 3000);
}

/* ════════════════════════════════════════
   DAILY MISSION
════════════════════════════════════════ */
const MISSIONS = [
  { task:'完成一节英语课', reward:2, zone:'english' },
  { task:'唱一首童谣', reward:1, zone:'songs' },
  { task:'做一道数学题', reward:2, zone:'math' },
  { task:'读一个中文故事', reward:2, zone:'chinese' },
  { task:'探索科学实验室', reward:3, zone:'science' },
  { task:'今天学两门课', reward:3, zone:null },
];

function initDailyMission(state) {
  const today = new Date().toISOString().split('T')[0];
  if (state.dailyMission.date !== today) {
    const m = MISSIONS[Math.floor(Math.random()*MISSIONS.length)];
    state.dailyMission = { date:today, task:m.task, reward:m.reward, completed:false };
    saveState(state);
  }
  document.getElementById('mission-task').textContent = state.dailyMission.task;
  document.getElementById('mission-reward').textContent = '奖励：' + '⭐'.repeat(state.dailyMission.reward);
  if (state.dailyMission.completed) {
    document.getElementById('mission-done').style.display = 'block';
  }
}

function checkDailyMission(state) {
  if (!state.dailyMission.completed) {
    // Simple heuristic: any completion counts
    state.dailyMission.completed = true;
    saveState(state);
    document.getElementById('mission-done').style.display = 'block';
    showToast('🎉 今日任务完成！');
  }
}

/* ════════════════════════════════════════
   STREAK
════════════════════════════════════════ */
function updateStreak(state) {
  const today = new Date().toISOString().split('T')[0];
  const last = state.lastVisit;
  if (!last) {
    state.streakDays = 1;
  } else {
    const diff = (new Date(today) - new Date(last)) / 86400000;
    if (diff === 1) state.streakDays++;
    else if (diff > 1) state.streakDays = 1;
  }
  state.lastVisit = today;
  return state;
}

/* ════════════════════════════════════════
   HUD UPDATE
════════════════════════════════════════ */
function updateHUD(state) {
  document.getElementById('stars-val').textContent = state.totalStars;
  document.getElementById('streak-val').textContent = state.streakDays;
}

/* ════════════════════════════════════════
   PARTICLES
════════════════════════════════════════ */
function spawnParticles(x, y) {
  const emojis = ['⭐','✨','🎉','💫','🌟','🎊'];
  for(let i=0;i<12;i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.fontSize = (14+Math.random()*18) + 'px';
    const angle = (Math.random()*360)*Math.PI/180;
    const dist = 80 + Math.random()*120;
    p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle)*dist - 80 + 'px');
    p.style.animationDuration = (1+Math.random()*0.8) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2000);
  }
}

/* ════════════════════════════════════════
   TOAST / LOCKED HINT
════════════════════════════════════════ */
function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:white;padding:10px 18px;border-radius:24px;font-size:14px;font-weight:700;z-index:600;white-space:nowrap;border:2px solid rgba(255,255,255,0.2);`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.style.opacity='0', 2200);
  setTimeout(() => t.remove(), 2700);
}

function showLockedHint(zoneId) {
  const req = ZONES[zoneId].unlockAt;
  const hint = document.getElementById('locked-hint');
  document.getElementById('locked-hint-msg').textContent = `完成 ${req} 节课后解锁`;
  hint.classList.add('show');
  setTimeout(() => hint.classList.remove('show'), 2500);
}

/* ════════════════════════════════════════
   SOUND (Web Audio API simple beep)
════════════════════════════════════════ */
let audioCtx;
function playClick() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = 880;
    osc.type = 'square';
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.12);
    osc.start(); osc.stop(audioCtx.currentTime+0.12);
  } catch(e){}
}

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */
function startGame() {
  document.getElementById('welcome-overlay').classList.add('hidden');
  setTimeout(() => {
    steveSpeak('今天想去哪里探险？😊');
  }, 600);

  const state = loadState();
  state.firstVisit = false;
  updateStreak(state);
  saveState(state);
}

function init() {
  drawWorld();
  const state = loadState();
  renderBuildings(state);
  updateHUD(state);
  initDailyMission(state);
  startSteve();

  if (!state.firstVisit) {
    document.getElementById('welcome-overlay').classList.add('hidden');
    updateStreak(state);
    saveState(state);
    checkAndUnlockDecorations(state);
  }

  // Check URL params for just-completed course
  const params = new URLSearchParams(location.search);
  const justCompleted = params.get('justCompleted');
  if (justCompleted) {
    history.replaceState({}, '', location.pathname);
    const zoneId = detectZone(justCompleted);
    if (zoneId) {
      const stars = parseInt(params.get('stars')||'1');
      setTimeout(() => simulateCourseComplete(justCompleted, zoneId, stars), 800);
    }
  }

  window.addEventListener('resize', () => {
    drawWorld();
    renderBuildings(loadState());
  });
}

function detectZone(filename) {
  if (!filename) return null;
  if (filename.startsWith('english-')) return 'english';
  if (filename.startsWith('chinese-') || filename.startsWith('poem-') || filename.startsWith('story-')) return 'chinese';
  if (filename.startsWith('math-')) return 'math';
  if (filename.startsWith('gears-') || filename.startsWith('science-')) return 'science';
  const songFiles = ['twinkle','old-macdonald','wheels','bingo','abc-song','head-shoulders','humpty'];
  if (songFiles.some(s => filename.startsWith(s))) return 'songs';
  return null;
}

// Expose for courseware use
window.reportCourseComplete = function(stars) {
  const filename = location.pathname.split('/').pop();
  const zoneId = detectZone(filename);
  if (!zoneId) return;
  const state = loadState();
  if (!state.zones[zoneId].completed.includes(filename)) {
    state.zones[zoneId].completed.push(filename);
    state.zones[zoneId].totalCompleted++;
    state.totalStars += stars||1;
  }
  state.zones[zoneId].stars[filename] = stars||1;
  saveState(state);
};

document.addEventListener('DOMContentLoaded', init);
</script>
