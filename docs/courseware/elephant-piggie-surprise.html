<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐘🐷 大象小猪 - 我要给朋友一个惊喜！</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
  background: linear-gradient(145deg,#FFF8E7 0%,#FFE8C8 100%);
  min-height: 100vh; display: flex; justify-content: center;
  align-items: center; padding: 20px;
}
.book {
  max-width: 800px; width: 100%;
  background: #FFFCF5;
  border-radius: 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15),0 0 0 4px #FFF,0 0 0 8px #FFB347;
  padding: 24px 20px;
}

.page-area { position: relative; min-height: 400px; }
.page { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.4s ease; }
.page.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Page title - gears style */
.page-title { font-size: 34px; color: #E8751A; text-align: center; margin: 6px 0 10px; }
.page-title-icon { font-size: 48px; text-align: center; }
.page-desc { color: #6B4F3A; font-size: 19px; text-align: center; }

/* Cover page */
.cover-page { text-align: center; padding: 30px 20px; }
.cover-big-icon { font-size: 120px; animation: float 2s ease-in-out infinite; margin-bottom: 16px; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.cover-page h2 { font-size: 28px; color: #E8751A; margin: 10px 0; }
.cover-page .page-desc { margin-top: 8px; }

/* Scene */
.scene {
  width: 100%; max-width: 350px; height: 200px; position: relative;
  background: #FFF8E7; border-radius: 20px; margin-bottom: 12px;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 20px; gap: 20px;
  box-shadow: inset 0 -5px 15px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.04);
}
.character { font-size: 80px; cursor: pointer; transition: transform 0.2s; user-select: none; }
.character:hover { transform: scale(1.1); }
@keyframes speakPulse { 0%,100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.1) translateY(-8px); } }
.character.speaking { animation: speakPulse 0.5s ease infinite; }
.character.left { transform-origin: bottom right; }
.character.right { transform-origin: bottom left; }

/* Dialog bubble */
.dialog-bubble {
  width: 100%; padding: 14px 20px; border-radius: 20px;
  font-size: 22px; line-height: 1.5; text-align: center;
  margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
  position: relative;
}
.bubble-gerald { background: #e8eaf6; color: #283593; border: 3px solid #7986cb; }
.bubble-piggie { background: #fce4ec; color: #880e4f; border: 3px solid #f48fb1; }
.dialog-bubble::before {
  content: ''; position: absolute; width: 20px; height: 20px;
  top: -10px; transform: rotate(45deg);
}
.bubble-gerald::before { left: 30px; background: #e8eaf6; border-top: 3px solid #7986cb; border-left: 3px solid #7986cb; }
.bubble-piggie::before { right: 30px; background: #fce4ec; border-top: 3px solid #f48fb1; border-right: 3px solid #f48fb1; }
.dialog-bubble:hover { transform: scale(1.02); }
.dialog-bubble .name { font-size: 13px; font-weight: bold; opacity: 0.7; }
.dialog-bubble .highlight { background: #ffeb3b; padding: 0 4px; }

/* Quiz area - gears style */
.quiz-area {
  background: #F3E5F5; border-radius: 20px; padding: 16px;
  text-align: center; margin: 8px 0; width: 100%;
}
.quiz-area h3 { font-size: 18px; color: #7B1FA2; margin-bottom: 12px; }
.quiz-options { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.quiz-opt {
  padding: 12px 22px; border-radius: 16px; border: 3px solid #ddd;
  background: white; font-size: 19px; cursor: pointer;
  transition: all 0.15s; font-family: inherit;
}
.quiz-opt:hover { border-color: #FFB347; background: #FFF8E7; transform: scale(1.08); }
.quiz-opt.correct { border-color: #4CAF50; background: #E8F5E9; }
.quiz-opt.wrong { border-color: #F44336; background: #FFEBEE; animation: shake 0.3s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* Navigation bar - gears style */
.nav-bar {
  display: flex; gap: 12px; justify-content: center;
  align-items: center; padding: 16px 10px 8px;
  flex-wrap: wrap;
}
.nav-btn {
  width: 50px; height: 50px; border-radius: 50%;
  background: #FFB347; border: none; font-size: 22px;
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; color: white; font-weight: bold;
  box-shadow: 0 4px 12px rgba(255,179,71,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
  font-family: inherit;
}
.nav-btn:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 6px 18px rgba(255,179,71,0.5); }
.nav-btn:active:not(:disabled) { transform: scale(0.95); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.read-btn {
  background: #6BCB77; border: none; border-radius: 30px;
  padding: 8px 18px; font-size: 16px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center;
  gap: 6px; color: white; font-family: inherit;
  box-shadow: 0 4px 12px rgba(107,203,119,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
}
.read-btn:hover { transform: scale(1.05); box-shadow: 0 6px 18px rgba(107,203,119,0.5); }
.read-btn:active { transform: scale(0.95); }

/* Page dots */
.page-dots { display: flex; gap: 6px; align-items: center; }
.dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: #E0D5C7; cursor: pointer;
  transition: all 0.2s;
}
.dot.active { background: #FFB347; transform: scale(1.3); }
.dot.done { background: #4CAF50; }

/* Page counter */
.page-counter { text-align: center; font-size: 14px; color: #6B4F3A; padding: 4px 0 0; }

/* Celebration / confetti */
.celebration {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 9999;
}
.confetti-piece {
  position: absolute; border-radius: 50%;
  animation: confetti-fall ease-out forwards;
}
@keyframes confetti-fall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(500px) rotate(720deg); }
}

/* Final page badge */
.final-badge { font-size: 42px; margin-top: 8px; }

@media (max-width: 500px) {
  .character { font-size: 60px; }
  .dialog-bubble { font-size: 18px; }
  .scene { height: 160px; }
  .page-title { font-size: 26px; }
  .cover-big-icon { font-size: 90px; }
  .nav-btn { width: 44px; height: 44px; font-size: 18px; }
  .read-btn { font-size: 14px; padding: 7px 14px; }
}
</style>
</head>
<body>
<div class="book">
  <div class="page-area" id="pageArea"></div>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="prevPage()">◀</button>
    <button class="read-btn" onclick="speakPage()">🔊 读给我听</button>
    <div class="page-dots" id="progress"></div>
    <button class="nav-btn" id="nextBtn" onclick="nextPage()">▶</button>
  </div>
  <div class="page-counter" id="pageCounter">第1页 / 共8页</div>
</div>

<script>
const pages = [
  {
    cover: true, icon: '🐘🐷', title: '我要给朋友一个惊喜！',
    subtitle: '小猪小象系列故事 · 关于友谊的故事！'
  },
  {
    scene: '🐘🐷',
    speaker: 'Gerald',
    pageTitle: '🐘 Gerald 想要',
    text: '<span class="name">🐘 Gerald:</span> I will surprise my <span class="highlight">friend</span>!',
    bubble: 'bubble-gerald',
    emoji: '😊',
    game: { question: 'Gerald 感觉怎么样？', correct: '😊 开心', options: ['😊 开心', '😢 难过', '😡 生气'] }
  },
  {
    scene: '🐷🐘',
    speaker: 'Piggie',
    pageTitle: '🐷 Piggie 也想要',
    text: '<span class="name">🐷 Piggie:</span> I will surprise my <span class="highlight">friend</span> too!',
    bubble: 'bubble-piggie',
    emoji: '😄',
    game: { question: 'Piggie 感觉怎么样？', correct: '😄 兴奋', options: ['😄 兴奋', '😴 累了', '😱 害怕'] }
  },
  {
    scene: '🐘',
    speaker: 'Gerald',
    pageTitle: '🐘 Gerald 的计划',
    text: '<span class="name">🐘 Gerald:</span> I will hide behind this <span class="highlight">bush</span>. Then... SURPRISE!',
    bubble: 'bubble-gerald',
    emoji: '🌿',
    game: { question: 'Gerald 躲在哪里？', correct: '🌿 灌木丛后面', options: ['🌿 灌木丛后面', '🏠 房子里面', '🌳 树上面'] }
  },
  {
    scene: '🐷',
    speaker: 'Piggie',
    pageTitle: '🐷 Piggie 的计划',
    text: '<span class="name">🐷 Piggie:</span> I will hide behind this <span class="highlight">tree</span>. Then... SURPRISE!',
    bubble: 'bubble-piggie',
    emoji: '🌳',
    game: { question: 'Piggie 躲在哪里？', correct: '🌳 大树后面', options: ['🌳 大树后面', '🚗 汽车里面', '📦 箱子里面'] }
  },
  {
    scene: '🐘❓🐷❓',
    speaker: 'Both',
    pageTitle: '🤔 都找不到对方',
    text: '<span class="name">🤔 Gerald & Piggie:</span> Where <span class="highlight">is</span> my friend? I <span class="highlight">cannot</span> find them!',
    bubble: 'bubble-gerald',
    emoji: '🤔',
    game: { question: '他们找到对方了吗？', correct: '❌ 还没有！', options: ['✅ 找到了！', '❌ 还没有！', '🤷 不知道'] }
  },
  {
    scene: '🐘👀🐷',
    speaker: 'Both',
    pageTitle: '😲 终于见面了！',
    text: '<span class="name">😲 Gerald & Piggie:</span> There you <span class="highlight">are</span>! You surprised <span class="highlight">me</span>!',
    bubble: 'bubble-piggie',
    emoji: '😲',
    game: { question: '他们惊喜吗？', correct: '✅ 是的！惊喜！', options: ['✅ 是的！惊喜！', '❌ 不是', '😐 也许吧'] }
  },
  {
    scene: '🐘🤝🐷',
    speaker: 'Both',
    pageTitle: '🥰 最好的朋友',
    text: '<span class="name">🥰 Gerald & Piggie:</span> Friends <span class="highlight">surprise</span> each other! What a good <span class="highlight">friend</span>!',
    bubble: 'bubble-gerald',
    emoji: '🥰',
    game: null,
    final: true
  }
];

let currentPage = 0;
let gameDone = new Array(pages.length).fill(false);

function renderPage(idx) {
  const area = document.getElementById('pageArea');
  const p = pages[idx];

  // Remove old pages
  area.innerHTML = '';

  const pageDiv = document.createElement('div');
  pageDiv.className = 'page active';
  pageDiv.id = 'page-' + idx;

  if (p.cover) {
    pageDiv.innerHTML = `
      <div class="cover-page">
        <div class="cover-big-icon">${p.icon}</div>
        <h2>${p.title}</h2>
        <p class="page-desc">${p.subtitle}</p>
        <p style="margin-top:20px;font-size:15px;color:#aaa">👆 点击 ▶ 开始阅读！</p>
      </div>
    `;
  } else {
    // Story page
    let contentHTML = '';

    // Page title
    if (p.pageTitle) {
      contentHTML += `<div class="page-title">${p.pageTitle}</div>`;
    }

    // Character scene
    if (p.scene) {
      const chars = Array.from(p.scene);
      const charHTML = chars.map(c => {
        const isElephant = c === '🐘';
        const isPig = c === '🐷';
        const cls = isElephant ? 'character left' : isPig ? 'character right' : 'character';
        return `<div class="${cls}" onclick="speakText('${isElephant ? 'Gerald' : isPig ? 'Piggie' : ''}')">${c}</div>`;
      }).join('');
      contentHTML += `<div class="scene">${charHTML}</div>`;
    }

    // Dialog bubble
    if (p.text) {
      const cleanText = p.text.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/'/g, "\\'");
      contentHTML += `<div class="dialog-bubble ${p.bubble}" onclick="speakText('${cleanText}')">${p.text}</div>`;
    }

    // Quiz or final area
    if (p.game && !gameDone[idx]) {
      contentHTML += `
        <div class="quiz-area">
          <h3>💭 ${p.game.question}</h3>
          <div class="quiz-options">
            ${p.game.options.map((opt, oi) => {
              const isCorrect = opt === p.game.correct;
              return `<div class="quiz-opt" onclick="checkEmotion(${idx}, ${isCorrect}, this)">${opt}</div>`;
            }).join('')}
          </div>
        </div>
      `;
    } else if (p.final) {
      contentHTML += `<div class="quiz-area" style="background:#E8F5E9;margin-top:12px">
        <h3>🎉 一个关于友谊的美妙故事！</h3>
        <div class="final-badge">⭐ ⭐ ⭐</div>
        <p style="margin-top:6px;color:#6B4F3A;font-size:16px">你真棒！读完了整本书！👏</p>
      </div>`;
    } else if (p.game && gameDone[idx]) {
      contentHTML += `<div class="quiz-area" style="background:#E8F5E9"><h3>✅ 回答正确！</h3><p style="color:#4CAF50;font-size:28px">★</p></div>`;
    }

    pageDiv.innerHTML = contentHTML;
  }

  area.appendChild(pageDiv);
  updateUI(idx);
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = false;
}

function checkEmotion(idx, isCorrect, el) {
  if (gameDone[idx]) return;
  if (isCorrect) {
    el.classList.add('correct');
    gameDone[idx] = true;
    launchConfetti();
    setTimeout(() => renderPage(idx), 800);
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 400);
  }
}

function launchConfetti() {
  const div = document.createElement('div');
  div.className = 'celebration';
  const colors = ['#FF6B6B','#FFB347','#4ECDC4','#FFE66D','#A78BFA','#FF9FF3'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;left:${Math.random()*100}%;top:15%;background:${colors[i%colors.length]};animation-duration:${1.5+Math.random()}s;animation-delay:${Math.random()*0.6}s;`;
    div.appendChild(c);
  }
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

function speakPage() {
  const p = pages[currentPage];
  if (p.cover) {
    speakText('I Will Surprise My Friend! An Elephant and Piggie story.');
  } else {
    speakText(p.text.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' '));
  }
}

function speakText(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

function nextPage() {
  const p = pages[currentPage];
  if (p.game && !gameDone[currentPage]) return;
  if (currentPage < pages.length - 1) { currentPage++; renderPage(currentPage); }
}

function prevPage() {
  if (currentPage > 0) { currentPage--; renderPage(currentPage); }
}

function updateUI(idx) {
  document.getElementById('pageCounter').textContent = `第${idx+1}页 / 共${pages.length}页`;
  const dots = document.getElementById('progress');
  dots.innerHTML = pages.map((_, i) =>
    `<div class="dot ${i === idx ? 'active' : ''} ${gameDone[i] ? 'done' : ''}" onclick="currentPage=${i};renderPage(${i})"></div>`
  ).join('');
}

renderPage(0);
</script>
</body>
</html>
