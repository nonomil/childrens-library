<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐘🐷 大象小猪 - 我要给朋友一个惊喜！</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;
  background: linear-gradient(145deg,#FFF8E7 0%,#FFE8C8 100%);
  min-height: 100vh; display: flex; justify-content: center;
  align-items: center; padding: 20px;
}
.book {
  max-width: 800px; width: 100%;
  background: #FFFCF5;
  border-radius: 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15),0 0 0 4px #FFF,0 0 0 8px #FFB347;
  padding: 24px 20px;
}

.page-area { position: relative; min-height: 420px; }
.page { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.4s ease; }
.page.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Page title */
.page-title { font-size: 34px; color: #E8751A; text-align: center; margin: 6px 0 10px; }
.page-title-icon { font-size: 48px; text-align: center; }
.page-desc { color: #6B4F3A; font-size: 19px; text-align: center; }

/* Cover page */
.cover-page { text-align: center; padding: 20px; }
.cover-characters { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin-bottom: 12px; }
.cover-characters svg { cursor: pointer; transition: transform 0.3s; }
.cover-characters svg:hover { transform: scale(1.08) translateY(-4px); }
.cover-page h2 { font-size: 28px; color: #E8751A; margin: 10px 0; }
.cover-page .page-desc { margin-top: 8px; }

/* Scene with SVG */
.scene {
  width: 100%; max-width: 380px; min-height: 200px; position: relative;
  background: #FFF8E7; border-radius: 20px; margin-bottom: 10px;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 12px 10px 8px; gap: 8px;
  box-shadow: inset 0 -5px 15px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.04);
}
.scene-character {
  cursor: pointer; transition: transform 0.2s; user-select: none;
}
.scene-character:hover { transform: scale(1.08); }
.scene-character svg { display: block; }
@keyframes bounceChar {
  0%,100% { transform: translateY(0); }
  30% { transform: translateY(-12px); }
  50% { transform: translateY(-5px); }
}
.scene-character.bouncing { animation: bounceChar 0.6s ease; }

/* Dialog bubble */
.dialog-bubble {
  width: 100%; padding: 14px 20px; border-radius: 20px;
  font-size: 22px; line-height: 1.5; text-align: center;
  margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
  position: relative;
}
.bubble-gerald { background: #e8eaf6; color: #283593; border: 3px solid #7986cb; }
.bubble-piggie { background: #fce4ec; color: #880e4f; border: 3px solid #f48fb1; }
.bubble-both { background: #fff3e0; color: #e65100; border: 3px solid #ffb74d; }
.dialog-bubble::before {
  content: ''; position: absolute; width: 20px; height: 20px;
  top: -10px; transform: rotate(45deg);
}
.bubble-gerald::before { left: 30px; background: #e8eaf6; border-top: 3px solid #7986cb; border-left: 3px solid #7986cb; }
.bubble-piggie::before { right: 30px; background: #fce4ec; border-top: 3px solid #f48fb1; border-right: 3px solid #f48fb1; }
.bubble-both::before { left: 50%; margin-left: -10px; background: #fff3e0; border-top: 3px solid #ffb74d; border-left: 3px solid #ffb74d; }
.dialog-bubble:hover { transform: scale(1.02); }
.dialog-bubble .name { font-size: 13px; font-weight: bold; opacity: 0.7; }
.dialog-bubble .highlight { background: #ffeb3b; padding: 0 4px; }

/* Speech bubble (fixed overlay) */
.speech-bubble {
  position: fixed;
  left: 50%;
  bottom: 120px;
  transform: translateX(-50%);
  border-radius: 24px;
  background: rgba(255,255,255,0.96);
  border: 3px solid #FFB347;
  padding: 16px 28px;
  max-width: 85%;
  font-size: 22px;
  line-height: 1.5;
  text-align: center;
  z-index: 10000;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  animation: speechIn 0.35s ease;
  font-family: inherit;
  color: #4A3728;
}
.speech-bubble::before {
  content: '🔊 ';
  font-size: 20px;
}
@keyframes speechIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes speechOut {
  from { opacity: 1; transform: translateX(-50%) translateY(0); }
  to { opacity: 0; transform: translateX(-50%) translateY(20px); }
}

/* Quiz area - gears style */
.quiz-area {
  background: #F3E5F5; border-radius: 20px; padding: 16px;
  text-align: center; margin: 8px 0; width: 100%;
  animation: quizIn 0.3s ease;
}
@keyframes quizIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.quiz-area h3 { font-size: 18px; color: #7B1FA2; margin-bottom: 12px; }
.quiz-options { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.quiz-opt {
  padding: 12px 22px; border-radius: 16px; border: 3px solid #ddd;
  background: white; font-size: 19px; cursor: pointer;
  transition: all 0.15s; font-family: inherit;
}
.quiz-opt:hover { border-color: #FFB347; background: #FFF8E7; transform: scale(1.08); }
.quiz-opt.correct { border-color: #4CAF50; background: #E8F5E9; animation: popCorrect 0.4s ease; }
@keyframes popCorrect { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
.quiz-opt.wrong { border-color: #F44336; background: #FFEBEE; animation: shake 0.3s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* Navigation bar - gears style */
.nav-bar {
  display: flex; gap: 12px; justify-content: center;
  align-items: center; padding: 16px 10px 8px;
  flex-wrap: wrap;
}
.nav-btn {
  width: 50px; height: 50px; border-radius: 50%;
  background: #FFB347; border: none; font-size: 22px;
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; color: white; font-weight: bold;
  box-shadow: 0 4px 12px rgba(255,179,71,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
  font-family: inherit;
}
.nav-btn:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 6px 18px rgba(255,179,71,0.5); }
.nav-btn:active:not(:disabled) { transform: scale(0.95); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.read-btn {
  background: #6BCB77; border: none; border-radius: 30px;
  padding: 8px 18px; font-size: 16px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center;
  gap: 6px; color: white; font-family: inherit;
  box-shadow: 0 4px 12px rgba(107,203,119,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
}
.read-btn:hover { transform: scale(1.05); box-shadow: 0 6px 18px rgba(107,203,119,0.5); }
.read-btn:active { transform: scale(0.95); }

/* Page dots */
.page-dots { display: flex; gap: 6px; align-items: center; }
.dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: #E0D5C7; cursor: pointer;
  transition: all 0.2s;
}
.dot.active { background: #FFB347; transform: scale(1.3); }
.dot.done { background: #4CAF50; }

/* Page counter */
.page-counter { text-align: center; font-size: 14px; color: #6B4F3A; padding: 4px 0 0; }

/* Celebration / confetti */
.celebration {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 9999;
}
.confetti-piece {
  position: absolute; border-radius: 50%;
  animation: confetti-fall ease-out forwards;
}
@keyframes confetti-fall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(500px) rotate(720deg); }
}

/* Final page badge */
.final-badge { font-size: 42px; margin-top: 8px; }

@media (max-width: 500px) {
  .dialog-bubble { font-size: 18px; }
  .scene { max-width: 100%; }
  .page-title { font-size: 26px; }
  .nav-btn { width: 44px; height: 44px; font-size: 18px; }
  .read-btn { font-size: 14px; padding: 7px 14px; }
  .speech-bubble { font-size: 18px; padding: 12px 20px; max-width: 90%; bottom: 100px; }
}
</style>
</head>

}

}

    <!-- question mark on box -->

let gameDone = new Array(pages.length).fill(false);

// ===== Speech Bubble =====

function showSpeechBubble(text) {
  const existing = document.querySelector('.speech-bubble');
  if (existing) {
    existing.style.animation = 'speechOut 0.25s ease forwards';
    setTimeout(() => existing.remove(), 300);
  }

  const bubble = document.createElement('div');
  bubble.className = 'speech-bubble';
  bubble.textContent = text;
  document.body.appendChild(bubble);

  // Auto-remove after duration proportional to text length
  const duration = Math.max(2500, text.length * 80 + 1500);
  setTimeout(() => {
    if (bubble.parentNode) {
      bubble.style.animation = 'speechOut 0.25s ease forwards';
      setTimeout(() => bubble.remove(), 300);
    }
  }, duration);
}

// ===== Text-to-Speech =====

let currentAudio = null;
function playAudio(src, showText) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (showText) showSpeechBubble(showText);
  try {
    const a = new Audio(src);
    a.play();
    currentAudio = a;
    a.onended = function() { currentAudio = null; };
  } catch(e) { console.log('Audio error:', e); }
}

function speakPage() {
  const p = pages[currentPage];
  const AUDIO_MAP = ['elephant-cover', 'elephant-page1', 'elephant-page2', 'elephant-page3', 'elephant-page4', 'elephant-page5', 'elephant-page6', 'elephant-page7'];
  const TEXTS = [
    'I Will Surprise My Friend! An Elephant and Piggie story.',
    'Gerald: I will surprise my friend!',
    'Piggie: I will surprise my friend too!',
    'Gerald: I will hide behind this bush. Then... SURPRISE!',
    'Piggie: I will hide behind this tree. Then... SURPRISE!',
    'Gerald & Piggie: Where is my friend? I cannot find them!',
    'Gerald & Piggie: There you are! You surprised me!',
    'Gerald & Piggie: Friends surprise each other! What a good friend!'
  ];
  const idx = currentPage;
  if (idx >= 0 && idx < AUDIO_MAP.length) {
    playAudio('audio/' + AUDIO_MAP[idx] + '.mp3', TEXTS[idx]);
  }
}

function speakText(text) {
  playAudio('', text);
}

// ===== Character Click Animation =====

let bounceTimer = null;
function bounceCharacter(el) {
  if (bounceTimer) clearTimeout(bounceTimer);
  el.classList.remove('bouncing');
  void el.offsetWidth;
  el.classList.add('bouncing');
  bounceTimer = setTimeout(() => el.classList.remove('bouncing'), 700);
  // Also say the character name
  const label = el.dataset.name || '';
  if (label) {
    speakText(label + ' says hello!');
  }
}

// ===== Rendering =====

function renderPage(idx) {
  const area = document.getElementById('pageArea');
  const p = pages[idx];

  area.innerHTML = '';

  const pageDiv = document.createElement('div');
  pageDiv.className = 'page active';
  pageDiv.id = 'page-' + idx;

  if (p.cover) {
    pageDiv.innerHTML = `
      <div class="cover-page">
        <div class="cover-characters">
          ${svgElephant('happy', 120)}
          ${svgSurpriseBox(80)}
          ${svgPig('happy', 110)}
        </div>
        <h2>${p.title}</h2>
        <p class="page-desc">${p.subtitle}</p>
        <p style="margin-top:20px;font-size:15px;color:#aaa">👆 点击 ▶ 开始阅读！</p>
      </div>
    `;
  } else {
    let contentHTML = '';

    // Page title
    if (p.pageTitle) {
      contentHTML += `<div class="page-title">${p.pageTitle}</div>`;
    }

    // Character scene with SVG
    if (p.chars && p.chars.length > 0) {
      let sceneHTML = '<div class="scene">';
      p.chars.forEach((ch, ci) => {
        const svgFn = ch.type === 'elephant' ? svgElephant : svgPig;
        const svgStr = svgFn(ch.emotion, 130);
        const name = ch.label || '';
        sceneHTML += `<div class="scene-character" data-name="${name}" data-idx="${ci}" onclick="bounceCharacter(this)">${svgStr}</div>`;
      });
      // Surprise box if needed
      if (p.showBox) {
        sceneHTML += `<div class="scene-character" onclick="bounceCharacter(this)">${svgSurpriseBox(90)}</div>`;
      }
      sceneHTML += '</div>';
      contentHTML += sceneHTML;
    }

    // Dialog bubble
    if (p.text) {
      contentHTML += `<div class="dialog-bubble ${p.bubble}" onclick="speakText('${p.text.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/'/g, "\\'")}')">${p.text}</div>`;
    }

    // Quiz or final area
    if (p.game && !gameDone[idx]) {
      contentHTML += `
        <div class="quiz-area">
          <h3>💭 ${p.game.question}</h3>
          <div class="quiz-options">
            ${p.game.options.map((opt, oi) => {
              const isCorrect = opt === p.game.correct;
              return `<div class="quiz-opt" onclick="checkAnswer(${idx}, ${isCorrect}, this)">${opt}</div>`;
            }).join('')}
          </div>
        </div>
      `;
    } else if (p.final) {
      contentHTML += `<div class="quiz-area" style="background:#E8F5E9;margin-top:12px">
        <h3>🎉 一个关于友谊的美妙故事！</h3>
        <div class="final-badge">⭐ ⭐ ⭐</div>
        <p style="margin-top:6px;color:#6B4F3A;font-size:16px">你真棒！读完了整本书！👏</p>
      </div>`;
    } else if (p.game && gameDone[idx]) {
      contentHTML += `<div class="quiz-area" style="background:#E8F5E9"><h3>✅ 回答正确！</h3><p style="color:#4CAF50;font-size:28px">★</p></div>`;
    }

    pageDiv.innerHTML = contentHTML;
  }

  area.appendChild(pageDiv);
  updateUI(idx);
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = false;
}

function checkAnswer(idx, isCorrect, el) {
  if (gameDone[idx]) return;
  if (isCorrect) {
    el.classList.add('correct');
    gameDone[idx] = true;
    launchConfetti();
    setTimeout(() => renderPage(idx), 900);
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 400);
  }
}

// ===== Confetti =====

function launchConfetti() {
  const div = document.createElement('div');
  div.className = 'celebration';
  const colors = ['#FF6B6B','#FFB347','#4ECDC4','#FFE66D','#A78BFA','#FF9FF3','#FF8A65','#81C784'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    const size = 6 + Math.random() * 12;
    const shapes = ['50%','0%','30%'];
    c.style.cssText = `width:${size}px;height:${size * (0.5 + Math.random())}px;left:${Math.random()*100}%;top:-5%;background:${colors[i%colors.length]};border-radius:${shapes[i%3]};animation-duration:${1.5+Math.random()}s;animation-delay:${Math.random()*0.8}s;`;
    div.appendChild(c);
  }
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3500);
}

// ===== Navigation =====

function nextPage() {
  const p = pages[currentPage];
  if (p.game && !gameDone[currentPage]) return;
  if (currentPage < pages.length - 1) { currentPage++; renderPage(currentPage); }
}

function prevPage() {
  if (currentPage > 0) { currentPage--; renderPage(currentPage); }
}

function updateUI(idx) {
  document.getElementById('pageCounter').textContent = `第${idx+1}页 / 共${pages.length}页`;
  const dots = document.getElementById('progress');
  dots.innerHTML = pages.map((_, i) =>
    `<div class="dot ${i === idx ? 'active' : ''} ${gameDone[i] ? 'done' : ''}" onclick="currentPage=${i};renderPage(${i})"></div>`
  ).join('');
}

// ===== Init =====
renderPage(0);
</script>
</body>
</html>
