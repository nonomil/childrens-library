<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐵 Five Little Monkeys Jumping on the Bed!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
    background: linear-gradient(145deg, #FFF8E7 0%, #FFE8C8 100%);
    min-height: 100vh; display: flex; justify-content: center;
    align-items: center; padding: 20px;
  }
  .book {
    max-width: 800px; width: 100%; background: #FFFCF5;
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 4px #FFF, 0 0 0 8px #FFB347;
    padding: 24px 20px;
  }
  .page-area { min-height: 400px; }
  .page {
    display: none; flex-direction: column; align-items: center;
    animation: fadeIn 0.4s ease;
  }
  .page.active { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .page-title {
    font-size: 34px; color: #E8751A; text-align: center; margin-bottom: 8px;
  }
  .page-title-icon { font-size: 48px; text-align: center; margin-bottom: 4px; }
  .page-desc {
    font-size: 19px; color: #6B4F3A; text-align: center; margin-bottom: 16px;
  }

  /* Float animation for cover icon */
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .float-icon { animation: float 2s ease-in-out infinite; display: inline-block; }

  /* Bed scene */
  .bed-scene {
    width: 100%; max-width: 400px; height: 220px;
    background: linear-gradient(180deg, #e8d5b7 0%, #d4a574 100%);
    border-radius: 20px; position: relative; margin-bottom: 16px;
    box-shadow: inset 0 -10px 20px rgba(0,0,0,0.1);
    cursor: pointer; overflow: hidden;
  }
  .bed-frame {
    position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
    background: #8B4513; border-radius: 0 0 20px 20px;
  }
  .pillow {
    position: absolute; left: 20px; bottom: 50px;
    width: 60px; height: 30px; background: #fff;
    border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .monkey {
    position: absolute; font-size: 40px; cursor: pointer;
    transition: all 0.3s ease; user-select: none;
    animation: bounce 1s ease-in-out infinite;
  }
  .monkey.jumping { animation: bigJump 0.6s ease-in-out; }
  .monkey.fallen {
    bottom: 10px !important; animation: none !important;
    opacity: 0.6; filter: grayscale(0.5);
    pointer-events: none;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes bigJump {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-60px) scale(1.2); }
    60% { transform: translateY(0) scale(0.9); }
    100% { transform: translateY(0) scale(1); }
  }

  .sentence {
    font-size: 22px; line-height: 1.6; text-align: center;
    padding: 14px 20px; background: #FFF8E7; border-radius: 16px;
    width: 100%; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .sentence .num { color: #E8751A; font-weight: bold; font-size: 28px; }
  .sentence .bump { color: #f5576c; font-weight: bold; }

  /* Quiz area - gears style */
  .game-area, .quiz-area {
    width: 100%; padding: 16px; background: #F3E5F5;
    border-radius: 20px; text-align: center; margin: 10px 0;
  }
  .game-area h3, .quiz-area h3 {
    font-size: 18px; color: #7B1FA2; margin-bottom: 12px;
  }
  .count-btns, .quiz-options {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
  }
  .count-btn, .quiz-opt {
    padding: 12px 22px; border-radius: 16px; border: 3px solid #ddd;
    background: white; font-size: 19px; font-weight: bold; cursor: pointer;
    transition: all 0.15s; font-family: inherit;
  }
  .count-btn:hover, .quiz-opt:hover {
    border-color: #FFB347; background: #FFF8E7; transform: scale(1.08);
  }
  .count-btn.correct, .quiz-opt.correct {
    border-color: #4CAF50; background: #E8F5E9;
  }
  .count-btn.wrong, .quiz-opt.wrong {
    border-color: #F44336; background: #FFEBEE; animation: shake 0.3s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* Navigation - gears style */
  .controls {
    display: flex; gap: 12px; justify-content: center; align-items: center;
    padding: 16px 0 0;
  }
  .nav-btn {
    width: 50px; height: 50px; border: none; border-radius: 50%;
    background: #FFB347; color: white; font-size: 20px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(255,179,71,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }
  .nav-btn:hover {
    transform: scale(1.1); box-shadow: 0 6px 18px rgba(255,179,71,0.5);
  }
  .nav-btn:active { transform: scale(0.95); }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .read-btn {
    border: none; border-radius: 30px; background: #6BCB77;
    color: white; font-size: 16px; font-weight: 600; padding: 10px 18px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 12px rgba(107,203,119,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .read-btn:hover {
    transform: scale(1.05); box-shadow: 0 6px 18px rgba(107,203,119,0.5);
  }
  .read-btn:active { transform: scale(0.95); }
  .page-counter {
    font-size: 14px; color: #999; text-align: center; margin-top: 8px;
  }
  .progress {
    display: flex; gap: 6px; justify-content: center; padding: 10px 0 0;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #E0D5C7; cursor: pointer; transition: all 0.2s;
  }
  .dot.active { background: #FFB347; transform: scale(1.3); }
  .dot.done { background: #4CAF50; }

  /* Confetti celebration */
  .celebration {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 9999;
  }
  .confetti { position: absolute; border-radius: 50%; animation: confetti-fall ease-out forwards; }
  @keyframes confetti-fall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(500px) rotate(720deg); }
  }

  .cover-page { text-align: center; padding: 30px 20px; }
  .cover-page .big-icon { font-size: 120px; margin-bottom: 20px; }
  .cover-page h2 { font-size: 32px; color: #E8751A; }
  .cover-page p { font-size: 18px; color: #6B4F3A; margin-top: 8px; }

  @media (max-width: 500px) {
    .sentence { font-size: 18px; }
    .monkey { font-size: 32px; }
    .bed-scene { height: 180px; }
    .page-title { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="book">
  <div class="page-area" id="pageArea"></div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" onclick="prevPage()">◀</button>
    <button class="read-btn" onclick="speakPage()">🔊 读给我听</button>
    <button class="nav-btn" id="nextBtn" onclick="nextPage()">▶</button>
  </div>
  <div class="page-counter" id="pageCounter">第1页 / 共8页</div>
  <div class="progress" id="progress"></div>
</div>

<script>
const pages = [
  {
    cover: true, icon: '🐵', title: 'Five Little Monkeys',
    subtitle: 'Jumping on the Bed! 🛏️ A counting rhyme!'
  },
  { count: 5, emoji: '🐵' },
  { count: 4, emoji: '🐵', fallen: 1 },
  { count: 3, emoji: '🐵', fallen: 2 },
  { count: 2, emoji: '🐵', fallen: 3 },
  { count: 1, emoji: '🐵', fallen: 4 },
  { count: 0, emoji: '😴', fallen: 5, done: true },
  { count: -1, final: true, emoji: '⭐', sentence: '🎉 No more monkeys jumping on the bed! ★★★' }
];

let currentPage = 0;
let gameDone = new Array(pages.length).fill(false);

function renderPage(idx) {
  const area = document.getElementById('pageArea');
  const p = pages[idx];

  if (p.cover) {
    area.innerHTML = `
      <div class="page active cover-page" id="page-${idx}">
        <div class="big-icon float-icon">${p.icon}</div>
        <div class="page-title">${p.title}</div>
        <div class="page-desc">${p.subtitle}</div>
        <p style="margin-top:16px;font-size:14px;color:#aaa">👆 点击 "▶" 开始阅读！</p>
      </div>
    `;
    updateUI(idx);
    document.getElementById('prevBtn').disabled = true;
    return;
  }

  if (p.final) {
    area.innerHTML = `
      <div class="page active" id="page-${idx}" style="padding:40px 20px;text-align:center">
        <div style="font-size:100px;margin-bottom:20px">${p.emoji}</div>
        <div class="page-title" style="margin-bottom:16px">故事结束啦！🎉</div>
        <div class="sentence" style="font-size:28px">${p.sentence}</div>
        <div style="margin-top:20px;font-size:48px">⭐ ⭐ ⭐</div>
        <div class="quiz-area" style="background:#E8F5E9">
          <h3 style="color:#4CAF50">📖 你读完了整个故事！</h3>
          <p style="margin-top:8px;color:#4CAF50;font-size:18px">数数小能手，真棒！🎉</p>
        </div>
      </div>
    `;
    updateUI(idx);
    document.getElementById('prevBtn').disabled = false;
    return;
  }

  const count = p.count;
  const fallen = p.fallen || 0;
  const isDone = gameDone[idx];

  // Generate monkey positions
  let monkeysHTML = '';
  const positions = [];
  for (let i = 0; i < count + fallen; i++) {
    const row = Math.floor(i / 4);
    const col = i % 4;
    const left = 40 + col * 90;
    const top = 65 + row * 55;
    const isFallen = i >= count;
    positions.push({ left, top, isFallen });
  }

  positions.forEach((pos, i) => {
    const isLast = i === count - 1 && count > 0;
    monkeysHTML += `<div class="monkey ${pos.isFallen ? 'fallen' : ''} ${isLast && !isDone && count > 0 ? 'jumping' : ''}" 
      style="left:${pos.left}px;top:${pos.isFallen ? 50 : pos.top}px" 
      onclick="${!pos.isFallen && count > 0 && !isDone ? 'jumpMonkey(this, ' + idx + ')' : ''}">🐵</div>`;
  });

  const storyText = count > 0
    ? `<span class="num">${count}</span> little monkey${count > 1 ? 's' : ''} jumping on the bed!<br>One fell off and <span class="bump">bumped</span> his head!`
    : `😴 No more monkeys jumping on the bed!<br>Mama said, "Time for bed!"`;

  let gameHTML = '';
  if (count > 0 && !isDone) {
    const answers = [count - 1, count, count + 1].filter(n => n >= 0 && n <= 5);
    const correct = count - 1;
    gameHTML = `
      <div class="quiz-area">
        <h3>🔢 还剩下几只猴子？</h3>
        <div class="quiz-options">
          ${answers.map(n => `<div class="quiz-opt" onclick="checkAnswer(${idx}, ${correct}, ${n}, this)">${n}</div>`).join('')}
        </div>
      </div>
    `;
  } else if (isDone && count > 0) {
    gameHTML = `<div class="quiz-area" style="background:#E8F5E9"><h3 style="color:#4CAF50">✅ 还剩 ${count - 1} 只猴子！</h3><p style="color:#4CAF50;font-size:24px">⭐</p></div>`;
  }

  area.innerHTML = `
    <div class="page active" id="page-${idx}">
      <div class="page-title">🐵 第 ${Math.min(count, 5)} 只猴子</div>
      <div class="bed-scene" id="bedScene">
        ${monkeysHTML}
        <div class="pillow"></div>
        <div class="bed-frame"></div>
      </div>
      <div class="sentence">${storyText}</div>
      ${gameHTML}
    </div>
  `;

  updateUI(idx);
  document.getElementById('prevBtn').disabled = idx === 0;
}

function jumpMonkey(el, idx) {
  if (gameDone[idx]) return;
  el.classList.remove('jumping');
  void el.offsetWidth;
  el.classList.add('jumping');
  setTimeout(() => {
    el.classList.remove('jumping');
    el.classList.add('fallen');
    el.style.top = '50px';
    // Check if all monkeys fallen
    const monkeys = document.querySelectorAll('.monkey:not(.fallen)');
    if (monkeys.length === 0) {
      gameDone[idx] = true;
      setTimeout(() => {
        launchConfetti();
        renderPage(idx);
      }, 600);
    }
  }, 600);
  speakText('Bump!');
}

function checkAnswer(idx, correct, chosen, el) {
  if (gameDone[idx]) return;
  if (chosen === correct) {
    el.classList.add('correct');
    gameDone[idx] = true;
    setTimeout(() => {
      launchConfetti();
      renderPage(idx);
    }, 600);
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 400);
  }
}

function speakPage() {
  const p = pages[currentPage];
  if (p.cover) {
    speakText('Five Little Monkeys Jumping on the Bed!');
  } else if (p.final) {
    speakText('No more monkeys jumping on the bed!');
  } else if (p.count > 0) {
    speakText(`${p.count} little monkey${p.count > 1 ? 's' : ''} jumping on the bed. One fell off and bumped his head!`);
  } else {
    speakText('No more monkeys jumping on the bed!');
  }
}

function speakText(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

function nextPage() {
  const p = pages[currentPage];
  if (p.count > 0 && !gameDone[currentPage] && !p.cover) return;
  if (currentPage < pages.length - 1) { currentPage++; renderPage(currentPage); }
}

function prevPage() {
  if (currentPage > 0) { currentPage--; renderPage(currentPage); }
}

function launchConfetti() {
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
  const colors = ['#FF6B6B','#FFB347','#4ECDC4','#FFE66D','#A78BFA','#FF9FF3'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.style.cssText = `position:absolute;width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;border-radius:50%;left:${Math.random()*100}%;top:15%;background:${colors[i%colors.length]};animation:confetti-fall ${1.5+Math.random()}s ease-out forwards;animation-delay:${Math.random()*0.6}s;`;
    div.appendChild(c);
  }
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

function updateUI(idx) {
  document.getElementById('pageCounter').textContent = `第${idx+1}页 / 共${pages.length}页`;
  const dots = document.getElementById('progress');
  dots.innerHTML = pages.map((_, i) =>
    `<div class="dot ${i === idx ? 'active' : ''} ${gameDone[i] ? 'done' : ''}" onclick="currentPage=${i};renderPage(${i})"></div>`
  ).join('');
}

renderPage(0);
</script>
</body>
</html>
