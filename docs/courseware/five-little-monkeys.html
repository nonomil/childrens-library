<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐵 Five Little Monkeys Jumping on the Bed!</title>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4/bundled/rough.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    background: linear-gradient(145deg, #FFF8E7 0%, #FFE8C8 100%);
    min-height: 100vh; display: flex; justify-content: center;
    align-items: center; padding: 20px;
  }
  .book {
    max-width: 800px; width: 100%; background: #FFFCF5;
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 4px #FFF, 0 0 0 8px #FFB347;
    padding: 24px 20px; position: relative;
  }
  .page-area { min-height: 420px; }
  .page {
    display: none; flex-direction: column; align-items: center;
    animation: fadeIn 0.4s ease;
  }
  .page.active { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .page-title {
    font-size: 34px; color: #E8751A; text-align: center; margin-bottom: 8px;
  }

  .bed-scene {
    width: 100%; max-width: 420px; height: 230px;
    border-radius: 20px; position: relative; margin-bottom: 12px;
    cursor: pointer; overflow: hidden; background: linear-gradient(180deg, #FFF8E1, #FFECB3);
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }
  .bed-scene svg { display: block; width: 100%; height: 100%; }

  .sentence {
    font-size: 22px; line-height: 1.6; text-align: center;
    padding: 14px 20px; background: #FFF8E7; border-radius: 16px;
    width: 100%; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .sentence .num { color: #E8751A; font-weight: bold; font-size: 28px; }
  .sentence .bump { color: #f5576c; font-weight: bold; }

  /* Speech Bubble */
  .speech-bubble {
    position: fixed; bottom: 120px; left: 50%;
    transform: translateX(-50%) scale(0.5);
    border-radius: 24px; background: rgba(255,255,255,0.96);
    border: 3px solid #FFB347; padding: 18px 28px;
    font-size: 22px; font-weight: 600; max-width: 82%;
    text-align: center; z-index: 10000; opacity: 0;
    pointer-events: none;
    box-shadow: 0 10px 40px rgba(255,179,71,0.35);
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    color: #5A3E2B; line-height: 1.5;
  }
  .speech-bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .speech-bubble::before { content: '🔊'; display: block; font-size: 26px; margin-bottom: 4px; }
  .speech-bubble::after {
    content: ''; position: absolute; bottom: -14px; left: 50%;
    transform: translateX(-50%);
    border: 10px solid transparent; border-top-color: #FFB347;
  }

  /* Quiz area */
  .quiz-area {
    width: 100%; padding: 16px 16px 12px; background: #F3E5F5;
    border-radius: 20px; text-align: center; margin: 10px 0;
  }
  .quiz-area h3 { font-size: 18px; color: #7B1FA2; margin-bottom: 12px; }
  .quiz-options { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .quiz-opt {
    padding: 14px 26px; border-radius: 18px; border: 3px solid #DDB8E8;
    background: white; font-size: 22px; font-weight: bold; cursor: pointer;
    transition: all 0.15s; font-family: inherit; color: #5A3E2B;
    min-width: 60px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .quiz-opt:hover {
    border-color: #FFB347; background: #FFF8E7; transform: scale(1.1);
    box-shadow: 0 6px 16px rgba(255,179,71,0.3);
  }
  .quiz-opt.correct {
    border-color: #4CAF50; background: #E8F5E9; transform: scale(1.12);
    box-shadow: 0 0 0 4px rgba(76,175,80,0.3);
    animation: correctPop 0.5s ease-out;
  }
  .quiz-opt.wrong {
    border-color: #F44336; background: #FFEBEE; animation: shake 0.4s;
  }
  @keyframes correctPop {
    0% { transform: scale(1); } 40% { transform: scale(1.25); }
    70% { transform: scale(0.95); } 100% { transform: scale(1.12); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-2deg); }
    40% { transform: translateX(8px) rotate(2deg); }
    60% { transform: translateX(-6px) rotate(-1deg); }
    80% { transform: translateX(6px) rotate(1deg); }
  }

  /* Progress dots */
  .progress {
    display: flex; gap: 8px; justify-content: center; padding: 12px 0 4px;
  }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #E0D5C7; cursor: pointer; transition: all 0.25s;
  }
  .dot:hover { transform: scale(1.3); }
  .dot.active { background: #FFB347; transform: scale(1.4); box-shadow: 0 0 0 3px rgba(255,179,71,0.3); }
  .dot.done { background: #4CAF50; }

  /* Navigation */
  .controls {
    display: flex; gap: 12px; justify-content: center; align-items: center;
    padding: 16px 0 0;
  }
  .nav-btn {
    width: 52px; height: 52px; border: none; border-radius: 50%;
    background: #FFB347; color: white; font-size: 22px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(255,179,71,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }
  .nav-btn:hover { transform: scale(1.12); box-shadow: 0 6px 20px rgba(255,179,71,0.5); }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
  .read-btn {
    border: none; border-radius: 30px; background: linear-gradient(135deg, #6BCB77, #4CAF50);
    color: white; font-size: 17px; font-weight: 600; padding: 12px 22px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 16px rgba(107,203,119,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .read-btn:hover { transform: scale(1.06); }
  .read-btn:active { transform: scale(0.95); }
  .page-counter {
    font-size: 14px; color: #999; text-align: center; margin-top: 8px;
  }

  /* Confetti */
  .celebration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
  @keyframes confetti-fall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(600px) rotate(1080deg); }
  }

  .cover-page { text-align: center; padding: 20px 20px 10px; }
  .cover-page h2 { font-size: 32px; color: #E8751A; margin-top: 8px; }
  .cover-page p { font-size: 18px; color: #6B4F3A; margin-top: 8px; }

  @media (max-width: 500px) {
    .sentence { font-size: 18px; }
    .bed-scene { height: 190px; }
    .page-title { font-size: 26px; }
    .speech-bubble { font-size: 18px; padding: 14px 20px; bottom: 100px; max-width: 90%; }
    .nav-btn { width: 44px; height: 44px; font-size: 18px; }
  }
</style>
</head>
<body>
<div class="book">
  <div class="page-area" id="pageArea"></div>
  <div class="controls">
    <button class="nav-btn" id="prevBtn" onclick="prevPage()">◀</button>
    <button class="read-btn" onclick="speakPage()">🔊 读给我听</button>
    <button class="nav-btn" id="nextBtn" onclick="nextPage()">▶</button>
  </div>
  <div class="page-counter" id="pageCounter">第1页 / 共8页</div>
  <div class="progress" id="progress"></div>
</div>

<script>
// ======== PAGE DATA ========
const pages = [
  { cover: true, title: 'Five Little Monkeys', subtitle: 'Jumping on the Bed! 🛏️ A counting rhyme!' },
  { count: 5 }, { count: 4, fallen: 1 }, { count: 3, fallen: 2 },
  { count: 2, fallen: 3 }, { count: 1, fallen: 4 },
  { count: 0, fallen: 5, done: true },
  { count: -1, final: true, sentence: '🎉 No more monkeys jumping on the bed! ★★★' }
];

let currentPage = 0;
let gameDone = new Array(pages.length).fill(false);
let monkeyStates = []; // track individual monkey states per page

// ======== SPEECH BUBBLE ========
function showSpeechBubble(text) {
  const existing = document.querySelector('.speech-bubble');
  if (existing) existing.remove();
  const bubble = document.createElement('div');
  bubble.className = 'speech-bubble';
  bubble.textContent = text;
  document.body.appendChild(bubble);
  void bubble.offsetWidth;
  bubble.classList.add('show');
  setTimeout(() => {
    bubble.classList.remove('show');
    setTimeout(() => bubble.remove(), 400);
  }, 2800);
}

// ======== ROUGH.JS DRAWING ========
function drawScene(parentEl, monkeyCount, fallenCount, pageIdx, isCover) {
  // Clear
  parentEl.innerHTML = '';
  
  // Create SVG
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 420 200');
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', '100%');
  parentEl.appendChild(svg);
  
  const rc = rough.svg(svg);
  const W = 420, H = 200;

  // --- Background ---
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('x', '0'); bg.setAttribute('y', '0');
  bg.setAttribute('width', '420'); bg.setAttribute('height', '200');
  bg.setAttribute('fill', '#FFF8E1');
  bg.setAttribute('rx', '20');
  svg.appendChild(bg);

  // --- Floor ---
  svg.appendChild(rc.rectangle(0, 140, 420, 60, {
    fill: '#D4A574', roughness: 1.8, stroke: '#B8956A', strokeWidth: 2
  }));

  // --- Bed frame (headboard) ---
  svg.appendChild(rc.rectangle(8, 18, 404, 20, {
    fill: '#6B3A2A', roughness: 2.0, stroke: '#4A2518', strokeWidth: 1.5
  }));
  // Headboard round tops
  svg.appendChild(rc.ellipse(12, 14, 12, 12, { fill: '#8B4513', roughness: 1.5 }));
  svg.appendChild(rc.ellipse(408, 14, 12, 12, { fill: '#8B4513', roughness: 1.5 }));

  // --- Side rails ---
  svg.appendChild(rc.rectangle(8, 36, 404, 6, {
    fill: '#8B4513', roughness: 1.5, stroke: '#6B3A2A', strokeWidth: 1
  }));

  // --- Mattress ---
  svg.appendChild(rc.rectangle(15, 44, 390, 96, {
    fill: '#FFF8EE', roughness: 1.2, stroke: '#E8D5B7', strokeWidth: 1.5
  }));

  // --- Pillow ---
  svg.appendChild(rc.ellipse(48, 63, 60, 32, {
    fill: 'white', roughness: 1.5, stroke: '#E0D5C7', strokeWidth: 1
  }));
  // Pillow line
  svg.appendChild(rc.line(48, 52, 48, 74, { roughness: 0.8, stroke: '#E0D5C7', strokeWidth: 1 }));

  // --- Blanket wrinkle ---
  svg.appendChild(rc.path('M90,50 Q180,90 390,52', {
    roughness: 2.5, stroke: '#FFB347', strokeWidth: 2, fill: 'none'
  }));

  // --- Bottom frame ---
  svg.appendChild(rc.rectangle(0, 140, 420, 34, {
    fill: '#8B4513', roughness: 2.0, stroke: '#6B3A2A', strokeWidth: 1.5
  }));
  // Wood grain lines
  svg.appendChild(rc.line(20, 148, 80, 148, { roughness: 1.5, stroke: '#7A3E1A', strokeWidth: 1 }));
  svg.appendChild(rc.line(130, 153, 210, 153, { roughness: 1.5, stroke: '#7A3E1A', strokeWidth: 1 }));
  svg.appendChild(rc.line(250, 146, 340, 146, { roughness: 1.5, stroke: '#7A3E1A', strokeWidth: 1 }));

  // --- Bed legs ---
  svg.appendChild(rc.rectangle(8, 170, 14, 18, { fill: '#6B3A2A', roughness: 2.0 }));
  svg.appendChild(rc.rectangle(398, 170, 14, 18, { fill: '#6B3A2A', roughness: 2.0 }));

  // --- Draw Monkeys ---
  const positions = [];
  const total = monkeyCount + fallenCount;
  if (isCover) {
    // Spread them out nicely on cover
    const coverPos = [
      {x: 60, y: 100}, {x: 135, y: 90}, {x: 210, y: 83},
      {x: 285, y: 92}, {x: 355, y: 102}
    ];
    coverPos.forEach((p, i) => positions.push({ left: p.x, top: p.y, isFallen: false, idx: i }));
  } else {
    for (let i = 0; i < total; i++) {
      const row = Math.floor(i / 4);
      const col = i % 4;
      positions.push({
        left: 42 + col * 88,
        top: 68 + row * 50,
        isFallen: i >= monkeyCount,
        idx: i
      });
    }
  }

  const monkeyIds = [];
  positions.forEach((pos) => {
    const isFallen = pos.isFallen;
    const x = pos.left, y = pos.top;
    const bodyColor = '#8B5E3C';
    const faceColor = '#D4A574';
    const darkColor = '#6B3A2A';
    const roughness = 2.2;
    const monoRough = 1.8;
    const fillRough = 1.5;

    // Create group for this monkey
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const mid = 'm' + pos.idx + '-' + pageIdx;
    g.setAttribute('id', 'monkey-' + mid);
    
    const isClickable = !isFallen && monkeyCount > 0 && !gameDone[pageIdx] && !isCover;
    if (isClickable) {
      g.setAttribute('style', 'cursor:pointer');
      g.setAttribute('onclick', "jumpMonkey('" + mid + "')");
    }

    // Tail
    g.appendChild(rc.path('M' + (x+6) + ',' + (y+12) + ' Q' + (x+20) + ',' + (y-2) + ' ' + (x+14) + ',' + (y-10), {
      roughness: 2.5, stroke: bodyColor, strokeWidth: 2.5, fill: 'none'
    }));

    // Left arm
    g.appendChild(rc.ellipse(x-10, y+2, 14, 6, {
      fill: bodyColor, roughness: monoRough, stroke: darkColor, strokeWidth: 0.8
    }));
    // Right arm
    g.appendChild(rc.ellipse(x+10, y+2, 14, 6, {
      fill: bodyColor, roughness: monoRough, stroke: darkColor, strokeWidth: 0.8
    }));
    // Left leg
    g.appendChild(rc.ellipse(x-5, y+16, 8, 10, {
      fill: bodyColor, roughness: monoRough, stroke: darkColor, strokeWidth: 0.8
    }));
    // Right leg
    g.appendChild(rc.ellipse(x+5, y+16, 8, 10, {
      fill: bodyColor, roughness: monoRough, stroke: darkColor, strokeWidth: 0.8
    }));

    // Body
    g.appendChild(rc.ellipse(x, y+6, 18, 22, {
      fill: bodyColor, roughness: fillRough, stroke: darkColor, strokeWidth: 1
    }));

    // Ears
    g.appendChild(rc.circle(x-9, y-7, 9, { fill: bodyColor, roughness: monoRough, stroke: darkColor, strokeWidth: 0.8 }));
    g.appendChild(rc.circle(x+9, y-7, 9, { fill: bodyColor, roughness: monoRough, stroke: darkColor, strokeWidth: 0.8 }));
    g.appendChild(rc.circle(x-9, y-7, 6, { fill: faceColor, roughness: monoRough }));
    g.appendChild(rc.circle(x+9, y-7, 6, { fill: faceColor, roughness: monoRough }));

    // Head
    g.appendChild(rc.circle(x, y-4, 22, {
      fill: bodyColor, roughness: fillRough, stroke: darkColor, strokeWidth: 1
    }));

    // Face
    g.appendChild(rc.ellipse(x, y-2, 15, 13, {
      fill: faceColor, roughness: fillRough, stroke: darkColor, strokeWidth: 0.5
    }));

    // Eyes
    if (isFallen || pageIdx === 6) {
      // Closed (sleeping) eyes
      g.appendChild(rc.line(x-4, y-4, x-1, y-4, { roughness: 0.5, stroke: darkColor, strokeWidth: 1.8 }));
      g.appendChild(rc.line(x+1, y-4, x+4, y-4, { roughness: 0.5, stroke: darkColor, strokeWidth: 1.8 }));
    } else {
      // Open eyes
      g.appendChild(rc.circle(x-2.5, y-4, 3, { fill: 'white', roughness: 0.3 }));
      g.appendChild(rc.circle(x+2.5, y-4, 3, { fill: 'white', roughness: 0.3 }));
      g.appendChild(rc.circle(x-2.5, y-4, 1.5, { fill: darkColor, roughness: 0.3 }));
      g.appendChild(rc.circle(x+2.5, y-4, 1.5, { fill: darkColor, roughness: 0.3 }));
    }

    // Mouth
    if (isFallen) {
      // Sad mouth
      svg.appendChild(rc.path('M' + (x-2) + ',' + (y+2) + ' Q' + x + ',' + (y) + ' ' + (x+2) + ',' + (y+2), {
        roughness: 0.8, stroke: darkColor, strokeWidth: 1.2, fill: 'none'
      }));
      // Sleep Z
      g.appendChild(rc.line(x+6, y-8, x+12, y-14, { roughness: 1.5, stroke: '#999', strokeWidth: 1.2 }));
      g.appendChild(rc.line(x+12, y-14, x+10, y-18, { roughness: 1.5, stroke: '#aaa', strokeWidth: 0.8 }));
    } else {
      // Smile
      g.appendChild(rc.path('M' + (x-2) + ',' + (y+1) + ' Q' + x + ',' + (y+3) + ' ' + (x+2) + ',' + (y+1), {
        roughness: 0.5, stroke: darkColor, strokeWidth: 1.2, fill: 'none'
      }));
    }

    // Nose
    g.appendChild(rc.circle(x, y-1, 2, { fill: darkColor, roughness: 0.3 }));

    // Cheek blush
    g.appendChild(rc.ellipse(x-5, y+1, 4, 2.5, { fill: '#FFB5B5', roughness: 2.0, stroke: 'none', opacity: 0.5 }));
    g.appendChild(rc.ellipse(x+5, y+1, 4, 2.5, { fill: '#FFB5B5', roughness: 2.0, stroke: 'none', opacity: 0.5 }));

    svg.appendChild(g);
    monkeyIds.push(mid);
  });
  
  return monkeyIds;
}

// ======== RENDER PAGE ========
function renderPage(idx) {
  const area = document.getElementById('pageArea');
  const p = pages[idx];

  if (p.cover) {
    area.innerHTML = `
      <div class="page active cover-page">
        <h2>🐵 ${p.title}</h2>
        <p>${p.subtitle}</p>
        <div class="bed-scene" id="coverScene"></div>
      </div>
    `;
    setTimeout(() => {
      const scene = document.getElementById('coverScene');
      if (scene) drawScene(scene, 5, 0, idx, true);
    }, 50);
    updateUI(idx);
    document.getElementById('prevBtn').disabled = true;
    return;
  }

  if (p.final) {
    area.innerHTML = `
      <div class="page active" style="padding:40px 20px;text-align:center">
        <div style="font-size:100px;margin-bottom:20px">😴</div>
        <div class="page-title">故事结束啦！🎉</div>
        <div class="sentence" style="font-size:28px">${p.sentence}</div>
        <div style="margin-top:20px;font-size:48px">⭐ ⭐ ⭐</div>
        <div class="quiz-area" style="background:#E8F5E9">
          <h3 style="color:#4CAF50">📖 你读完了整个故事！</h3>
          <p style="margin-top:8px;color:#4CAF50;font-size:18px">数数小能手，真棒！🎉</p>
        </div>
      </div>
    `;
    updateUI(idx);
    document.getElementById('prevBtn').disabled = false;
    return;
  }

  const count = p.count;
  const fallen = p.fallen || 0;
  const isDone = gameDone[idx];
  const storyText = count > 0
    ? `<span class="num">${count}</span> little monkey${count > 1 ? 's' : ''} jumping on the bed!<br>One fell off and <span class="bump">bumped</span> his head!`
    : `😴 No more monkeys jumping on the bed!<br>Mama said, "Time for bed!"`;

  let gameHTML = '';
  if (count > 0 && !isDone) {
    const answers = [count - 1, count, count + 1].filter(n => n >= 0 && n <= 5);
    // Shuffle
    for (let i = answers.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [answers[i], answers[j]] = [answers[j], answers[i]];
    }
    const correct = count - 1;
    gameHTML = `
      <div class="quiz-area">
        <h3>🔢 还剩下几只猴子？</h3>
        <div class="quiz-options">
          ${answers.map(n => `<div class="quiz-opt" onclick="checkAnswer(${idx}, ${correct}, ${n}, this)">${n}</div>`).join('')}
        </div>
      </div>
    `;
  } else if (isDone && count > 0) {
    gameHTML = `<div class="quiz-area" style="background:#E8F5E9"><h3 style="color:#4CAF50">✅ 还剩 ${count-1} 只猴子！</h3><p style="color:#4CAF50;font-size:24px">⭐</p></div>`;
  }

  area.innerHTML = `
    <div class="page active">
      <div class="page-title">🐵 第 ${count > 0 ? Math.min(count,5) : '0'} 只猴子</div>
      <div class="bed-scene" id="bedScene-${idx}"></div>
      <div class="sentence">${storyText}</div>
      ${gameHTML}
    </div>
  `;

  // Draw rough scene after DOM update
  setTimeout(() => {
    const scene = document.getElementById('bedScene-' + idx);
    if (scene) {
      const ids = drawScene(scene, count, fallen, idx, false);
      monkeyStates[idx] = ids;
    }
  }, 50);

  updateUI(idx);
  document.getElementById('prevBtn').disabled = idx === 0;
}

// ======== JUMP MONKEY ========
function jumpMonkey(id) {
  // Find the monkey group and add jump animation
  const el = document.getElementById('monkey-' + id);
  if (!el) return;
  
  // Add visual jump via transform animation
  el.style.transition = 'transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
  el.style.transform = 'translateY(-25px) scale(1.15) rotate(-5deg)';
  
  speakText('Bump! 💫');
  showSpeechBubble('Bump! 💫');
  
  setTimeout(() => {
    el.style.transform = 'translateY(0) scale(1) rotate(0deg)';
    el.querySelectorAll('*').forEach(node => {
      try { node.setAttribute('fill', '#999'); } catch(e) {}
    });
  }, 600);

  // Check if all monkeys have fallen
  setTimeout(() => {
    const current = pages[currentPage];
    if (!current || current.cover || current.final) return;
    
    // Count remaining non-fallen monkeys
    const monkeys = document.querySelectorAll('[id^="monkey-m"][id$="-' + currentPage + '"]');
    let clickableLeft = 0;
    monkeys.forEach(m => {
      if (m.getAttribute('style') && !m.getAttribute('style').includes('fill')) {
        // Still clickable
        clickableLeft++;
      }
    });
    
    // Actually simpler: check total un-fallen
    const allMonkeys = document.querySelectorAll('[onclick*="jumpMonkey"]');
    // Mark THIS monkey as done
    if (el) el.removeAttribute('onclick');
    
    const remaining = document.querySelectorAll('[onclick*="jumpMonkey"]').length;
    if (remaining === 0 && current.count > 0) {
      gameDone[currentPage] = true;
      setTimeout(() => {
        launchConfetti();
        renderPage(currentPage);
      }, 700);
    }
  }, 100);
}

// ======== CHECK ANSWER ========
function checkAnswer(idx, correct, chosen, el) {
  if (gameDone[idx]) return;
  if (chosen === correct) {
    el.classList.add('correct');
    gameDone[idx] = true;
    launchConfetti();
    setTimeout(() => renderPage(idx), 800);
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 500);
  }
}

// ======== SPEECH ========
function speakPage() {
  const p = pages[currentPage];
  let text = '';
  if (p.cover) text = 'Five Little Monkeys Jumping on the Bed!';
  else if (p.final) text = 'No more monkeys jumping on the bed!';
  else if (p.count > 0) text = p.count + ' little monkey' + (p.count > 1 ? 's' : '') + ' jumping on the bed. One fell off and bumped his head!';
  else text = 'No more monkeys jumping on the bed!';
  showSpeechBubble(text);
  speakText(text);
}

function speakText(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g, ''));
  u.lang = 'en-US'; u.rate = 0.7; u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

// ======== NAVIGATION ========
function nextPage() {
  const p = pages[currentPage];
  if (p.count > 0 && !gameDone[currentPage] && !p.cover) return;
  if (currentPage < pages.length - 1) { currentPage++; renderPage(currentPage); }
}
function prevPage() {
  if (currentPage > 0) { currentPage--; renderPage(currentPage); }
}

// ======== CONFETTI ========
function launchConfetti() {
  const div = document.createElement('div');
  div.className = 'celebration';
  const colors = ['#FF6B6B','#FFB347','#4ECDC4','#FFE66D','#A78BFA','#FF9FF3','#FF8A65','#81C784'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    const size = 6 + Math.random() * 10;
    const isStar = Math.random() > 0.7;
    c.style.cssText = `position:absolute;width:${size}px;height:${isStar ? size : size*0.6}px;border-radius:${isStar ? '50%' : '3px'};left:${Math.random()*100}%;top:-5%;background:${colors[i%colors.length]};animation:confetti-fall ${1.5+Math.random()}s ease-out forwards;animation-delay:${Math.random()*0.8}s;${isStar ? 'clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);' : ''}`;
    div.appendChild(c);
  }
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

// ======== UI UPDATE ========
function updateUI(idx) {
  document.getElementById('pageCounter').textContent = '第' + (idx+1) + '页 / 共' + pages.length + '页';
  const dots = document.getElementById('progress');
  dots.innerHTML = pages.map((_, i) =>
    '<div class="dot ' + (i === idx ? 'active' : '') + ' ' + (gameDone[i] ? 'done' : '') + '" onclick="currentPage=' + i + ';renderPage(' + i + ')"></div>'
  ).join('');
}

// ======== BOOTSTRAP ========
renderPage(0);
</script>
</body>
