<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍎 I Am an Apple - Science Reader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    min-height: 100vh; display: flex; justify-content: center;
    align-items: center; padding: 20px;
  }
  .book {
    max-width: 800px; width: 100%; background: #fff;
    border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #43a047 0%, #ffeb3b 100%);
    color: #333; padding: 20px 30px; text-align: center;
  }
  .header h1 { font-size: 24px; }
  .header .sub { font-size: 13px; opacity: 0.8; }
  .page-area { padding: 20px 30px 10px; min-height: 380px; }
  .page { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.4s ease; }
  .page.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .illustration {
    width: 200px; height: 180px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 90px; margin-bottom: 14px; position: relative;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  .i-am-text {
    font-size: 26px; line-height: 1.6; text-align: center;
    padding: 14px 20px; background: #fff8e1; border-radius: 16px;
    width: 100%; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .i-am-text .highlight { color: #e65100; font-weight: bold; }
  .i-am-text .word { background: #c8e6c9; padding: 2px 8px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
  .i-am-text .word:hover { background: #a5d6a7; }

  .game-area {
    width: 100%; padding: 12px 16px; background: #e8f5e9;
    border-radius: 16px; text-align: center; margin-top: 8px;
  }
  .game-area h3 { font-size: 14px; color: #2e7d32; margin-bottom: 8px; }
  .quiz-btn {
    padding: 10px 20px; border-radius: 14px; border: 3px solid #ddd;
    background: white; font-size: 18px; cursor: pointer;
    margin: 4px; transition: all 0.15s;
  }
  .quiz-btn:hover { border-color: #43a047; background: #e8f5e9; transform: scale(1.05); }
  .quiz-btn.correct { border-color: #4caf50; background: #e8f5e9; }
  .quiz-btn.wrong { border-color: #f44336; background: #ffebee; animation: shake 0.3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .lifecycle {
    display: flex; align-items: center; gap: 5px; justify-content: center;
    flex-wrap: wrap; margin: 8px 0;
  }
  .lifecycle-item {
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; background: #f0f8ff; border: 3px solid #ddd;
    transition: all 0.3s; cursor: pointer;
  }
  .lifecycle-item:hover { border-color: #43a047; transform: scale(1.1); }
  .lifecycle-item.active { border-color: #43a047; background: #e8f5e9; }
  .lifecycle-arrow { font-size: 20px; color: #999; }

  .controls {
    display: flex; gap: 12px; justify-content: center; align-items: center; padding: 0 30px 15px;
  }
  .btn {
    padding: 12px 28px; border: none; border-radius: 30px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  .btn:active { transform: scale(0.95); }
  .btn-primary { background: #43a047; color: white; }
  .btn-sound { background: #ff9800; color: white; width: 50px; height: 50px; border-radius: 50%; font-size: 22px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .btn-prev, .btn-next { background: #eee; color: #333; }
  .btn-prev:disabled, .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
  .page-counter { font-size: 14px; color: #999; text-align: center; }
  .progress { display: flex; gap: 6px; justify-content: center; padding: 0 30px 18px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #ddd; cursor: pointer; transition: all 0.2s; }
  .dot.active { background: #43a047; transform: scale(1.3); }
  .dot.done { background: #4caf50; }

  .celebration {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
  }
  .confetti { position: absolute; width: 10px; height: 10px; border-radius: 50%; animation: confettiFall 2s ease-out forwards; }
  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(500px) rotate(720deg); }
  }
  .cover-page { text-align: center; padding: 30px 20px; }
  .cover-page .big-icon { font-size: 120px; margin-bottom: 20px; }
  .cover-page h2 { font-size: 32px; color: #333; }
  .cover-page p { font-size: 18px; color: #999; margin-top: 8px; }

  @media (max-width: 500px) {
    .illustration { width: 150px; height: 140px; font-size: 60px; }
    .i-am-text { font-size: 20px; }
    .lifecycle-item { width: 50px; height: 50px; font-size: 24px; }
  }
</style>
</head>
<body>
<div class="book">
  <div class="header">
    <h1>🍎 I Am an Apple</h1>
    <div class="sub">Hello, Science Reader! · Life Cycle of an Apple</div>
  </div>

  <div class="page-area" id="pageArea"></div>

  <div class="controls">
    <button class="btn btn-prev" id="prevBtn" onclick="prevPage()">⬅</button>
    <button class="btn btn-sound" onclick="speakPage()">🔊</button>
    <button class="btn btn-primary" id="nextBtn" onclick="nextPage()">Next ➡</button>
  </div>
  <div class="page-counter" id="pageCounter">1 / 9</div>
  <div class="progress" id="progress"></div>
</div>

<script>
const pages = [
  {
    cover: true, icon: '🍎', title: 'I Am an Apple',
    subtitle: 'Learn about apples and how they grow! 🌱'
  },
  {
    emoji: '🍎', bg: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
    text: 'I am an <span class="highlight">apple</span>. I am a <span class="word" onclick="speakText(\'fruit\')">🍎 fruit</span>!',
    fact: 'Apples grow on trees. There are thousands of kinds!',
    game: { question: 'Where do apples grow?', correct: '🌳 On trees', options: ['🌳 On trees', '🌱 Underground', '🌊 In water'] }
  },
  {
    emoji: '🌱', bg: 'linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%)',
    text: 'I start as a tiny <span class="highlight">seed</span>. I am planted in the <span class="word" onclick="speakText(\'soil\')">🌍 soil</span>.',
    fact: 'A seed needs sun, water, and soil to grow!',
    game: { question: 'What does a seed need?', correct: '☀️ Sun, 💧 Water, 🌍 Soil', options: ['☀️ Sun, 💧 Water, 🌍 Soil', '🍪 Cookies, 🥛 Milk', '📚 Books, ✏️ Pencil'] }
  },
  {
    emoji: '🌿', bg: 'linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%)',
    text: 'I grow into a small <span class="highlight">sprout</span>. Look at my little <span class="word" onclick="speakText(\'leaves\')">🍃 leaves</span>!',
    fact: 'The sprout reaches up toward the sun!',
    game: { question: 'What does the sprout reach for?', correct: '☀️ The sun', options: ['☀️ The sun', '🌙 The moon', '⭐ The stars'] }
  },
  {
    emoji: '🌳', bg: 'linear-gradient(135deg, #a5d6a7 0%, #66bb6a 100%)',
    text: 'I become a big <span class="highlight">apple tree</span>. I have beautiful <span class="word" onclick="speakText(\'blossoms\')">🌸 blossoms</span>!',
    fact: 'Bees help the blossoms turn into apples!',
    game: { question: 'Who helps blossoms become apples?', correct: '🐝 Bees', options: ['🐝 Bees', '🐦 Birds', '🐛 Worms'] }
  },
  {
    emoji: '🍎', bg: 'linear-gradient(135deg, #ffcdd2 0%, #ef9a9a 100%)',
    text: 'Now I am a <span class="highlight">ripe red apple</span>! Ready to be <span class="word" onclick="speakText(\'picked\')">🤲 picked</span>!',
    fact: 'Some apples are red, green, or yellow!',
    game: { question: 'What colors can apples be?', correct: '🔴 Red, 🟢 Green, 🟡 Yellow', options: ['🔴 Red, 🟢 Green, 🟡 Yellow', '🔵 Blue, 🟣 Purple', '⚫ Black, ⚪ White'] }
  },
  {
    emoji: '🥧', bg: 'linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%)',
    text: 'People use me to make <span class="highlight">apple pie</span>, <span class="word" onclick="speakText(\'juice\')">🧃 juice</span>, and more!',
    fact: 'Apple pie is a favorite dessert!',
    game: { question: 'What can you make with apples?', correct: '🥧 Apple pie', options: ['🥧 Apple pie', '🍕 Pizza', '🍝 Pasta'] }
  },
  {
    emoji: '🌱', bg: 'linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%)',
    text: 'Inside me there are <span class="highlight">seeds</span>. Plant them and I can <span class="word" onclick="speakText(\'grow\')">🌱 grow again</span>!',
    fact: 'The apple life cycle goes round and round!',
    game: { question: 'What is inside an apple?', correct: '🌱 Seeds', options: ['🌱 Seeds', '🍬 Candy', '🧸 Toys'] }
  },
  {
    emoji: '🍎', bg: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
    text: 'Now you know all about <span class="highlight">apples</span>! I am an apple, a <span class="word" onclick="speakText(\'delicious\')">😋 delicious</span> fruit!',
    fact: '',
    game: null,
    final: true
  }
];

let currentPage = 0;
let gameDone = new Array(pages.length).fill(false);

function renderPage(idx) {
  const area = document.getElementById('pageArea');
  const p = pages[idx];

  if (p.cover) {
    area.innerHTML = `
      <div class="page active cover-page">
        <div class="big-icon">${p.icon}</div>
        <h2>${p.title}</h2>
        <p>${p.subtitle}</p>
        <p style="margin-top:16px;font-size:14px;color:#aaa">👆 Click "Next" to start learning!</p>
      </div>
    `;
    updateUI(idx);
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('prevBtn').style.opacity = '0.4';
    return;
  }

  const isDone = !p.game || gameDone[idx];

  // Lifecycle timeline
  let lifecycleHTML = '';
  if (!p.final) {
    const stages = ['🌱','🌿','🌳','🌸','🍎'];
    const stageLabels = ['Seed', 'Sprout', 'Tree', 'Blossom', 'Apple'];
    lifecycleHTML = `
      <div class="lifecycle">
        ${stages.map((s, i) => `
          <div class="lifecycle-item" onclick="speakText('${stageLabels[i]}')">${s}</div>
          ${i < stages.length - 1 ? '<span class="lifecycle-arrow">→</span>' : ''}
        `).join('')}
      </div>
    `;
  }

  let gameHTML = '';
  if (p.game && !gameDone[idx]) {
    gameHTML = `
      <div class="game-area">
        <h3>🤔 ${p.game.question}</h3>
        ${p.game.options.map(opt => {
          const isCorrect = opt === p.game.correct;
          return `<button class="quiz-btn" onclick="checkAnswer(${idx}, ${isCorrect}, this)">${opt}</button>`;
        }).join('')}
      </div>
    `;
  } else if (p.final) {
    gameHTML = `
      <div class="game-area" style="background:#e8f5e9">
        <h3>🎉 You are an apple expert!</h3>
        <div class="lifecycle" style="margin-top:8px">
          <div class="lifecycle-item active">🌱</div><span class="lifecycle-arrow">→</span>
          <div class="lifecycle-item active">🌿</div><span class="lifecycle-arrow">→</span>
          <div class="lifecycle-item active">🌳</div><span class="lifecycle-arrow">→</span>
          <div class="lifecycle-item active">🌸</div><span class="lifecycle-arrow">→</span>
          <div class="lifecycle-item active">🍎</div>
        </div>
        <p style="color:#2e7d32;font-size:28px;margin-top:8px">⭐ ⭐ ⭐</p>
      </div>
    `;
  } else if (isDone && p.game) {
    gameHTML = `<div class="game-area" style="background:#e8f5e9"><h3>✅ Right!</h3><p style="color:#4caf50;font-size:24px">★</p></div>`;
  }

  area.innerHTML = `
    <div class="page active">
      <div class="illustration" style="background:${p.bg || '#f0f8ff'}">${p.emoji}</div>
      <div class="i-am-text">${p.text}</div>
      ${p.fact ? `<div style="font-size:14px;color:#999;text-align:center;margin-bottom:4px">💡 ${p.fact}</div>` : ''}
      ${lifecycleHTML}
      ${gameHTML}
    </div>
  `;
  updateUI(idx);
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('prevBtn').style.opacity = idx === 0 ? '0.4' : '1';
}

function checkAnswer(idx, isCorrect, el) {
  if (gameDone[idx]) return;
  if (isCorrect) {
    el.classList.add('correct');
    gameDone[idx] = true;
    setTimeout(() => {
      celebrate();
      renderPage(idx);
    }, 600);
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 400);
  }
}

function speakPage() {
  const p = pages[currentPage];
  if (p.cover) {
    speakText('I am an Apple! Learn about apples and how they grow!');
  } else {
    const txt = p.text.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');
    speakText(txt + '. ' + p.fact);
  }
}

function speakText(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.75; u.pitch = 1.1;
  window.speechSynthesis.speak(u);
}

function nextPage() {
  const p = pages[currentPage];
  if (p.game && !gameDone[currentPage]) return;
  if (currentPage < pages.length - 1) { currentPage++; renderPage(currentPage); }
}

function prevPage() {
  if (currentPage > 0) { currentPage--; renderPage(currentPage); }
}

function celebrate() {
  const div = document.createElement('div');
  div.className = 'celebration';
  const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#43a047'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.top = '20%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.6 + 's';
    div.appendChild(c);
  }
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 2500);
}

function updateUI(idx) {
  document.getElementById('pageCounter').textContent = `Page ${idx+1} / ${pages.length}`;
  const dots = document.getElementById('progress');
  dots.innerHTML = pages.map((_, i) =>
    `<div class="dot ${i === idx ? 'active' : ''} ${gameDone[i] ? 'done' : ''}" onclick="currentPage=${i};renderPage(${i})"></div>`
  ).join('');
}

renderPage(0);
</script>
</body>
</html>
