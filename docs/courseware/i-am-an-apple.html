<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍎 I Am an Apple - 苹果的一生</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
    background: linear-gradient(145deg,#FFF8E7 0%,#FFE8C8 100%);
    min-height: 100vh; display: flex; justify-content: center;
    align-items: center; padding: 20px;
  }
  .book {
    max-width: 800px; width: 100%;
    background: #FFFCF5;
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15),0 0 0 4px #FFF,0 0 0 8px #FFB347;
    padding: 24px 20px;
    position: relative;
  }
  .page-area { min-height: 380px; }
  .page { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.4s ease; }
  .page.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin-cw { to { transform: rotate(360deg); } }
  @keyframes spin-ccw { to { transform: rotate(-360deg); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes confetti-fall { 0% { opacity: 1; transform: translateY(0) rotate(0deg); } 100% { opacity: 0; transform: translateY(500px) rotate(720deg); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .page-title {
    font-size: 34px;
    color: #E8751A;
    text-align: center;
    margin-bottom: 8px;
  }
  .page-title-icon {
    font-size: 48px;
    text-align: center;
    margin-bottom: 6px;
  }
  .page-desc {
    font-size: 19px;
    color: #6B4F3A;
    text-align: center;
    margin-bottom: 10px;
  }

  .illustration {
    width: 200px; height: 180px; border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 90px; margin-bottom: 14px; position: relative;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  .i-am-text {
    font-size: 26px; line-height: 1.6; text-align: center;
    padding: 14px 20px; background: #FFF8E7; border-radius: 20px;
    width: 100%; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .i-am-text .highlight { color: #E8751A; font-weight: bold; }
  .i-am-text .word {
    background: #C8E6C9; padding: 2px 8px; border-radius: 8px;
    cursor: pointer; transition: background 0.2s;
  }
  .i-am-text .word:hover { background: #A5D6A7; }

  .lifecycle {
    display: flex; align-items: center; gap: 5px; justify-content: center;
    flex-wrap: wrap; margin: 8px 0;
  }
  .lifecycle-item {
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; background: #FFF8E7; border: 3px solid #E0D5C7;
    transition: all 0.3s; cursor: pointer;
  }
  .lifecycle-item:hover { border-color: #FFB347; transform: scale(1.1); }
  .lifecycle-item.active { border-color: #FFB347; background: #FFF0D0; }
  .lifecycle-arrow { font-size: 20px; color: #999; }

  .quiz-area {
    background: #F3E5F5; border-radius: 20px; padding: 16px;
    text-align: center; margin: 10px 0; width: 100%;
  }
  .quiz-area h3 { font-size: 18px; color: #7B1FA2; margin-bottom: 12px; }
  .quiz-options { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .quiz-opt {
    padding: 12px 22px; border-radius: 16px; border: 3px solid #ddd;
    background: white; font-size: 19px; cursor: pointer;
    transition: all 0.15s; font-family: inherit;
  }
  .quiz-opt:hover { border-color: #FFB347; background: #FFF8E7; transform: scale(1.08); }
  .quiz-opt.correct { border-color: #4CAF50; background: #E8F5E9; }
  .quiz-opt.wrong { border-color: #F44336; background: #FFEBEE; animation: shake 0.3s; }

  .fact-area {
    font-size: 15px; color: #6B4F3A; text-align: center;
    margin-bottom: 6px; background: #FFF8E7; padding: 8px 14px;
    border-radius: 14px; width: 100%;
  }

  /* Cover page */
  .cover-page { text-align: center; padding: 20px; }
  .cover-icon {
    font-size: 120px; margin-bottom: 16px;
    animation: float 2.5s ease-in-out infinite;
    display: inline-block;
  }
  .cover-page .page-title { margin-top: 8px; }
  .cover-hint {
    font-size: 15px; color: #bbb; margin-top: 14px;
  }

  /* Nav bar */
  .nav-bar {
    display: flex; gap: 10px; justify-content: center;
    align-items: center; padding: 12px 0 4px;
    position: sticky; bottom: 0;
  }
  .nav-btn {
    width: 50px; height: 50px; border-radius: 50%;
    background: #FFB347; color: white; border: none;
    font-size: 22px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(255,179,71,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .nav-btn:hover { transform: scale(1.1); box-shadow: 0 6px 18px rgba(255,179,71,0.5); }
  .nav-btn:active { transform: scale(0.95); }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  .read-btn {
    background: #6BCB77; color: white; border: none;
    border-radius: 30px; padding: 8px 18px; font-size: 16px;
    cursor: pointer; font-weight: 600;
    box-shadow: 0 4px 12px rgba(107,203,119,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }
  .read-btn:hover { transform: scale(1.05); box-shadow: 0 6px 18px rgba(107,203,119,0.5); }
  .read-btn:active { transform: scale(0.95); }

  .page-dots {
    display: flex; gap: 6px; align-items: center;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #E0D5C7; cursor: pointer;
    transition: all 0.2s;
  }
  .dot.active { background: #FFB347; transform: scale(1.3); }
  .dot.done { background: #4CAF50; }

  .page-counter {
    font-size: 13px; color: #999; text-align: center;
    padding: 2px 0 8px;
  }

  .final-area {
    background: #F3E5F5; border-radius: 20px; padding: 16px;
    text-align: center; margin: 10px 0; width: 100%;
  }
  .final-area h3 { font-size: 18px; color: #7B1FA2; margin-bottom: 8px; }

  @media (max-width: 500px) {
    body { padding: 10px; }
    .book { padding: 16px 12px; border-radius: 28px; }
    .illustration { width: 150px; height: 140px; font-size: 60px; }
    .i-am-text { font-size: 20px; }
    .lifecycle-item { width: 50px; height: 50px; font-size: 24px; }
    .page-title { font-size: 26px; }
    .page-title-icon { font-size: 36px; }
    .page-desc { font-size: 16px; }
    .nav-btn { width: 44px; height: 44px; font-size: 18px; }
    .read-btn { font-size: 14px; padding: 6px 14px; }
    .cover-icon { font-size: 90px; }
  }
</style>
</head>
<body>
<div class="book">
  <div class="page-area" id="pageArea"></div>
  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="prevPage()">◀</button>
    <button class="read-btn" onclick="speakPage()">🔊 读给我听</button>
    <div class="page-dots" id="progress"></div>
    <button class="nav-btn" id="nextBtn" onclick="nextPage()">▶</button>
  </div>
  <div class="page-counter" id="pageCounter">第1页 / 共9页</div>
</div>

<script>
const pages = [
  {
    cover: true, icon: '🍎', title: 'I Am an Apple',
    subtitle: 'Learn about apples and how they grow! 🌱'
  },
  {
    emoji: '🍎', bg: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
    text: 'I am an <span class="highlight">apple</span>. I am a <span class="word" onclick="speakText(\'fruit\')">🍎 fruit</span>!',
    fact: 'Apples grow on trees. There are thousands of kinds!',
    game: { question: 'Where do apples grow?', correct: '🌳 On trees', options: ['🌳 On trees', '🌱 Underground', '🌊 In water'] }
  },
  {
    emoji: '🌱', bg: 'linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%)',
    text: 'I start as a tiny <span class="highlight">seed</span>. I am planted in the <span class="word" onclick="speakText(\'soil\')">🌍 soil</span>.',
    fact: 'A seed needs sun, water, and soil to grow!',
    game: { question: 'What does a seed need?', correct: '☀️ Sun, 💧 Water, 🌍 Soil', options: ['☀️ Sun, 💧 Water, 🌍 Soil', '🍪 Cookies, 🥛 Milk', '📚 Books, ✏️ Pencil'] }
  },
  {
    emoji: '🌿', bg: 'linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%)',
    text: 'I grow into a small <span class="highlight">sprout</span>. Look at my little <span class="word" onclick="speakText(\'leaves\')">🍃 leaves</span>!',
    fact: 'The sprout reaches up toward the sun!',
    game: { question: 'What does the sprout reach for?', correct: '☀️ The sun', options: ['☀️ The sun', '🌙 The moon', '⭐ The stars'] }
  },
  {
    emoji: '🌳', bg: 'linear-gradient(135deg, #a5d6a7 0%, #66bb6a 100%)',
    text: 'I become a big <span class="highlight">apple tree</span>. I have beautiful <span class="word" onclick="speakText(\'blossoms\')">🌸 blossoms</span>!',
    fact: 'Bees help the blossoms turn into apples!',
    game: { question: 'Who helps blossoms become apples?', correct: '🐝 Bees', options: ['🐝 Bees', '🐦 Birds', '🐛 Worms'] }
  },
  {
    emoji: '🍎', bg: 'linear-gradient(135deg, #ffcdd2 0%, #ef9a9a 100%)',
    text: 'Now I am a <span class="highlight">ripe red apple</span>! Ready to be <span class="word" onclick="speakText(\'picked\')">🤲 picked</span>!',
    fact: 'Some apples are red, green, or yellow!',
    game: { question: 'What colors can apples be?', correct: '🔴 Red, 🟢 Green, 🟡 Yellow', options: ['🔴 Red, 🟢 Green, 🟡 Yellow', '🔵 Blue, 🟣 Purple', '⚫ Black, ⚪ White'] }
  },
  {
    emoji: '🥧', bg: 'linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%)',
    text: 'People use me to make <span class="highlight">apple pie</span>, <span class="word" onclick="speakText(\'juice\')">🧃 juice</span>, and more!',
    fact: 'Apple pie is a favorite dessert!',
    game: { question: 'What can you make with apples?', correct: '🥧 Apple pie', options: ['🥧 Apple pie', '🍕 Pizza', '🍝 Pasta'] }
  },
  {
    emoji: '🌱', bg: 'linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%)',
    text: 'Inside me there are <span class="highlight">seeds</span>. Plant them and I can <span class="word" onclick="speakText(\'grow\')">🌱 grow again</span>!',
    fact: 'The apple life cycle goes round and round!',
    game: { question: 'What is inside an apple?', correct: '🌱 Seeds', options: ['🌱 Seeds', '🍬 Candy', '🧸 Toys'] }
  },
  {
    emoji: '🍎', bg: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
    text: 'Now you know all about <span class="highlight">apples</span>! I am an apple, a <span class="word" onclick="speakText(\'delicious\')">😋 delicious</span> fruit!',
    fact: '',
    game: null,
    final: true
  }
];

const totalPages = pages.length;
let currentPage = 0;
let gameDone = new Array(totalPages).fill(false);

const pageTitles = [
  '',
  '我是苹果!',
  '一颗种子',
  '小嫩芽',
  '苹果树',
  '成熟啦',
  '苹果美食',
  '新的开始',
  '苹果专家'
];

function renderPage(idx) {
  const area = document.getElementById('pageArea');
  const p = pages[idx];

  if (p.cover) {
    area.innerHTML = `
      <div class="page active cover-page" id="page-${idx}">
        <div class="cover-icon">${p.icon}</div>
        <div class="page-title">${p.title}</div>
        <div class="page-desc">${p.subtitle}</div>
        <div class="cover-hint">👆 点击 "▶" 开始学习！</div>
      </div>
    `;
    updateNav(idx);
    document.getElementById('prevBtn').disabled = true;
    return;
  }

  const isDone = !p.game || gameDone[idx];

  // Lifecycle timeline
  let lifecycleHTML = '';
  if (!p.final) {
    const stages = ['🌱','🌿','🌳','🌸','🍎'];
    const stageLabels = ['Seed', 'Sprout', 'Tree', 'Blossom', 'Apple'];
    lifecycleHTML = `
      <div class="lifecycle">
        ${stages.map((s, i) => `
          <div class="lifecycle-item" onclick="speakText('${stageLabels[i]}')">${s}</div>
          ${i < stages.length - 1 ? '<span class="lifecycle-arrow">→</span>' : ''}
        `).join('')}
      </div>
    `;
  }

  // Quiz / game area
  let gameHTML = '';
  if (p.game && !gameDone[idx]) {
    gameHTML = `
      <div class="quiz-area">
        <h3>🤔 ${p.game.question}</h3>
        <div class="quiz-options">
          ${p.game.options.map(opt => {
            const isCorrect = opt === p.game.correct;
            return `<button class="quiz-opt" onclick="checkAnswer(${idx}, ${isCorrect}, this)">${opt}</button>`;
          }).join('')}
        </div>
      </div>
    `;
  } else if (p.final) {
    gameHTML = `
      <div class="final-area">
        <h3>🎉 你真是苹果小专家！</h3>
        <div class="lifecycle" style="margin-top:8px">
          <div class="lifecycle-item active">🌱</div><span class="lifecycle-arrow">→</span>
          <div class="lifecycle-item active">🌿</div><span class="lifecycle-arrow">→</span>
          <div class="lifecycle-item active">🌳</div><span class="lifecycle-arrow">→</span>
          <div class="lifecycle-item active">🌸</div><span class="lifecycle-arrow">→</span>
          <div class="lifecycle-item active">🍎</div>
        </div>
        <p style="color:#7B1FA2;font-size:28px;margin-top:8px">⭐ ⭐ ⭐</p>
      </div>
    `;
  } else if (isDone && p.game) {
    gameHTML = `<div class="quiz-area"><h3>✅ 答对了！</h3><p style="color:#4CAF50;font-size:24px">★</p></div>`;
  }

  area.innerHTML = `
    <div class="page active" id="page-${idx}">
      <div class="page-title-icon">${p.emoji}</div>
      <div class="page-title">${pageTitles[idx]}</div>
      <div class="illustration" style="background:${p.bg || '#FFF8E7'}">${p.emoji}</div>
      <div class="i-am-text">${p.text}</div>
      ${p.fact ? `<div class="fact-area">💡 ${p.fact}</div>` : ''}
      ${lifecycleHTML}
      ${gameHTML}
    </div>
  `;
  updateNav(idx);
  document.getElementById('prevBtn').disabled = idx === 0;
}

function checkAnswer(idx, isCorrect, el) {
  if (gameDone[idx]) return;
  if (isCorrect) {
    el.classList.add('correct');
    gameDone[idx] = true;
    setTimeout(() => {
      launchConfetti();
      renderPage(idx);
    }, 600);
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 400);
  }
}

function speakPage() {
  const p = pages[currentPage];
  if (p.cover) {
    speakText('I am an Apple! Learn about apples and how they grow!');
  } else {
    const txt = p.text.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');
    speakText(txt + '. ' + p.fact);
  }
}

function speakText(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.75; u.pitch = 1.1;
  window.speechSynthesis.speak(u);
}

function nextPage() {
  const p = pages[currentPage];
  if (p.game && !gameDone[currentPage]) return;
  if (currentPage < totalPages - 1) { currentPage++; renderPage(currentPage); }
}

function prevPage() {
  if (currentPage > 0) { currentPage--; renderPage(currentPage); }
}

function launchConfetti() {
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
  const colors = ['#FF6B6B','#FFB347','#4ECDC4','#FFE66D','#A78BFA','#FF9FF3'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.style.cssText = `position:absolute;width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;border-radius:50%;left:${Math.random()*100}%;top:15%;background:${colors[i%colors.length]};animation:confetti-fall ${1.5+Math.random()}s ease-out forwards;animation-delay:${Math.random()*0.6}s;`;
    div.appendChild(c);
  }
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

function updateNav(idx) {
  document.getElementById('pageCounter').textContent = `第${idx+1}页 / 共${totalPages}页`;
  const dots = document.getElementById('progress');
  dots.innerHTML = pages.map((_, i) =>
    `<div class="dot ${i === idx ? 'active' : ''} ${gameDone[i] ? 'done' : ''}" onclick="currentPage=${i};renderPage(${i})"></div>`
  ).join('');
}

renderPage(0);
</script>
</body>
</html>
