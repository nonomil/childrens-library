<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🕷️ Itsy Bitsy Spider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
body {
  font-family:'Fredoka One','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(145deg,#E8F4FD 0%,#B3E5FC 100%);
  min-height:100vh; display:flex; justify-content:center; align-items:center; padding:12px;
}
.book {
  width:100%; max-width:840px; min-height:92vh;
  background:#FFFCF5; border-radius:40px;
  box-shadow:0 20px 60px rgba(0,0,0,0.15),0 0 0 4px #FFF,0 0 0 8px #42A5F5;
  padding:24px 20px; position:relative;
  font-family:'Fredoka One','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
.page-area { min-height:420px; }
.page { display:none; flex-direction:column; align-items:center; animation:fadeIn .4s ease; width:100%; }
.page.active { display:flex; }
@keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes noteFloat { 0%{opacity:0;transform:translateY(20px) scale(0.5)} 30%{opacity:1;transform:translateY(-10px) scale(1.2)} 100%{opacity:0;transform:translateY(-60px) scale(0.8)} }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
@keyframes popIn { 0%{opacity:0;transform:scale(0.3)} 100%{opacity:1;transform:scale(1)} }
@keyframes confetti-fall { 0%{opacity:1;transform:translateY(0)rotate(0deg)} 100%{opacity:0;transform:translateY(500px)rotate(720deg)} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes climbUp { 0%{transform:translateY(40px)} 100%{transform:translateY(0)} }
@keyframes fallDown { 0%{transform:translateY(0)} 100%{transform:translateY(80px)} }
@keyframes rainDrop { 0%{opacity:0;transform:translateY(-20px)} 100%{opacity:1;transform:translateY(100px)} }
@keyframes sunGlow { 0%,100%{opacity:0.6} 50%{opacity:1} }
@keyframes spiderWalk { 0%{transform:translateX(-10px)} 50%{transform:translateX(10px)} 100%{transform:translateX(-10px)} }

.page-title { font-size:30px; color:#1565C0; text-align:center; margin-bottom:8px; font-weight:bold; }
.page-desc { font-size:18px; color:#6B4F3A; text-align:center; line-height:1.5; margin-bottom:10px; }
.scene-wrap { width:100%; max-width:460px; height:auto; margin:0 auto 10px; border-radius:20px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.08); }
.scene-wrap svg { display:block; width:100%; height:auto; }
.lyrics { font-size:26px; color:#1565C0; text-align:center; padding:12px 16px; background:#E3F2FD; border-radius:16px; width:100%; margin-bottom:8px; line-height:1.5; font-weight:bold; }
.lyrics .hl { color:#F44336; cursor:pointer; transition:all .2s; display:inline-block; }
.lyrics .hl:active { transform:scale(1.2); }
.lyrics .hl::after { content:'🔊'; font-size:14px; opacity:0.5; margin-left:4px; }
.word-game { width:100%; padding:14px; background:#E3F2FD; border-radius:18px; text-align:center; margin:6px 0; border:2px solid #BBDEFB; }
.word-game h3 { font-size:16px; color:#1565C0; margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:6px; }
.word-slots { display:flex; gap:6px; justify-content:center; margin-bottom:8px; }
.word-slot { width:48px; height:48px; border-bottom:4px solid #42A5F5; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:bold; color:#1565C0; border-radius:8px 8px 0 0; background:rgba(227,242,253,0.5); transition:all .2s; }
.word-slot.filled { border-bottom-color:#4CAF50; background:rgba(232,245,233,0.5); animation:popIn .2s ease; }
.word-slot.drag-over { border-bottom-color:#66BB6A; border-bottom-width:6px; background:rgba(102,187,106,0.15); transform:scale(1.05); }
.letter-tiles { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.letter-tile { width:48px; height:48px; border-radius:12px; border:3px solid #E0D5C7; background:white; font-size:24px; font-weight:bold; cursor:grab; display:flex; align-items:center; justify-content:center; transition:all .15s; user-select:none; touch-action:none; }
.letter-tile:hover { border-color:#42A5F5; background:#E3F2FD; }
.letter-tile:active { cursor:grabbing; }
.letter-tile.correct { border-color:#4CAF50; background:#E8F5E9; animation:popIn .3s ease; }
.letter-tile.wrong { border-color:#F44336; background:#FFEBEE; animation:shake .3s; }
.letter-tile.used { opacity:0.35; pointer-events:none; }
.letter-tile.dragging { opacity:0.5; }

/* Controls */
.controls { display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:8px; position:sticky; bottom:0; background:#FFFCF5; padding:8px 0; z-index:100; }
.nav-btn { background:#42A5F5; border:none; color:#FFF; font-size:28px; width:60px; height:60px; border-radius:50%; cursor:pointer; box-shadow:0 4px 12px rgba(66,165,245,0.4); transition:all .15s; display:flex; align-items:center; justify-content:center; flex-shrink:0; touch-action:manipulation; }
.nav-btn:hover { transform:scale(1.1); background:#1E88E5; }
.nav-btn:disabled { opacity:0.3; cursor:default; transform:none; }
.nav-btn.small { width:48px; height:48px; font-size:22px; }
.read-btn { background:#6BCB77; border:none; color:#FFF; font-size:16px; padding:10px 18px; border-radius:30px; cursor:pointer; box-shadow:0 4px 12px rgba(107,203,119,0.4); font-family:inherit; font-weight:bold; display:flex; align-items:center; gap:5px; transition:all .15s; touch-action:manipulation; }
.read-btn:hover { transform:scale(1.06); }
.read-btn.pink { background:#FF8A80; }
.page-dots { display:flex; gap:6px; justify-content:center; margin-top:6px; }
.page-dots .dot { width:10px; height:10px; border-radius:50%; background:#E0D5C7; cursor:pointer; transition:all .2s; }
.page-dots .dot.active { background:#42A5F5; transform:scale(1.3); }
.page-dots .dot.done { background:#4CAF50; }
.page-counter { font-size:13px; color:#999; text-align:center; margin-top:6px; }

/* Speech bubble */
.speech-bubble { position:fixed; bottom:120px; left:50%; transform:translateX(-50%) scale(0.5); border-radius:20px; background:rgba(255,255,255,0.96); border:3px solid #42A5F5; padding:14px 22px; font-size:20px; font-weight:600; max-width:80%; text-align:center; z-index:10000; opacity:0; pointer-events:none; box-shadow:0 8px 30px rgba(66,165,245,0.3); transition:opacity .35s,transform .35s cubic-bezier(0.34,1.56,0.64,1); color:#5A3E2B; line-height:1.5; }
.speech-bubble.show { opacity:1; transform:translateX(-50%) scale(1); }
.speech-bubble::before { content:'🔊'; display:block; font-size:22px; margin-bottom:4px; }

/* Celebration */
.celebration { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; }
.cover-page { text-align:center; padding:20px 10px; }
.big-start-btn { width:120px; height:120px; border-radius:50%; background:linear-gradient(145deg,#42A5F5,#1E88E5); border:6px solid #FFF; color:#FFF; font-size:32px; cursor:pointer; box-shadow:0 8px 30px rgba(66,165,245,0.5); transition:all .15s; margin:10px auto; display:flex; align-items:center; justify-content:center; animation:bounce 2s ease-in-out infinite; }
.big-start-btn:active { transform:scale(0.95); }

/* Final page */
.final-grid { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
.final-item { width:80px; text-align:center; padding:8px; border-radius:16px; background:#E3F2FD; border:2px solid #BBDEFB; }
.final-item .label { font-size:14px; color:#1565C0; font-weight:bold; margin-top:4px; }
.home-link { color:#42A5F5; text-decoration:none; font-size:18px; font-weight:bold; margin-top:10px; display:inline-block; }
.home-link:hover { text-decoration:underline; }
.cover-svg { width:100%; max-width:400px; margin:0 auto; }

@media (max-width:500px) {
  .book { padding:16px 12px; }
  .page-title { font-size:24px; }
  .lyrics { font-size:20px; padding:10px 12px; }
  .letter-tile { width:40px; height:40px; font-size:20px; }
  .word-slot { width:40px; height:40px; font-size:22px; }
  .nav-btn { width:50px; height:50px; font-size:24px; }
  .nav-btn.small { width:40px; height:40px; font-size:18px; }
  .read-btn { font-size:14px; padding:8px 14px; }
  .big-start-btn { width:90px; height:90px; font-size:26px; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div class="book">
  <div class="page-area" id="pageArea"></div>
  <div class="controls" id="controlsBar">
    <button class="nav-btn" id="prevBtn" onclick="prevPage()" disabled>◀</button>
    <button class="nav-btn small" onclick="playSong();showMusicNotes()" style="animation:float 2s ease-in-out infinite">🎵</button>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
      <button class="read-btn" onclick="speakPage()">🔊 读</button>
      <button class="read-btn pink" onclick="playSong();showMusicNotes()">🎵 唱</button>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="nextPage()">▶</button>
  </div>
  <div class="page-dots" id="progressDots"></div>
  <div class="page-counter" id="pageCounter">第1页 / 共7页</div>
</div>
<div class="speech-bubble" id="speechBubble"></div>

<script>
// ====== PAGE DATA ======
const pages = [
  { cover:true, title:'🕷️ Itsy Bitsy Spider', subtitle:'☀️ 一首关于小蜘蛛的英语儿歌！' },
  { sentence:'The itsy bitsy spider went up the <span class="hl" data-word="water spout">water spout</span>!', game:'spider', svg:'up' },
  { sentence:'Down came the <span class="hl" data-word="rain">rain</span> and washed the spider <span class="hl" data-word="out">out</span>!', game:'rain', svg:'rain' },
  { sentence:'Out came the <span class="hl" data-word="sun">sun</span> and dried up all the rain!', game:'sun', svg:'sun' },
  { sentence:'And the itsy bitsy spider went up the spout <span class="hl" data-word="again">again</span>!', game:'again', svg:'up-again' },
  { final:true, title:'🎉 Itsy Bitsy Star！' }
];

let currentPage = 0;
let gameDone = new Array(pages.length).fill(false);
let buildingWord = [];
let dragData = null;

// ====== WEB AUDIO API ======
const NOTE = {
  C4:261.63, D4:293.66, E4:329.63, F4:349.23,
  G4:392.00, A4:440.00, B4:493.88, C5:523.25
};
function playMelody(notes) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let t = ctx.currentTime;
  notes.forEach(function(n) {
    const [freq, dur] = n;
    if(freq > 0) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'triangle';
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.start(t); osc.stop(t + dur);
      t += dur + 0.05;
    }
  });
}
// Itsy Bitsy Spider melody (simplified)
const SPIDER_TUNE = [
  [NOTE.E4,0.3],[NOTE.E4,0.3],[NOTE.G4,0.4],[NOTE.G4,0.4],
  [NOTE.F4,0.3],[NOTE.E4,0.3],[NOTE.D4,0.6],
  [NOTE.E4,0.3],[NOTE.G4,0.4],[NOTE.C5,0.5],[NOTE.A4,0.4],
  [NOTE.G4,0.8]
];
// ===== PLAY FULL SONG MP3 =====
var songAudio = null;
function playSong() {
  if(songAudio) { songAudio.pause(); songAudio.currentTime = 0; }
  songAudio = new Audio('audio/itsybitsy.mp3');
  songAudio.volume = 0.8;
  songAudio.play().catch(function(){});
}
function showMusicNotes() {
  const scene=document.querySelector('.scene-wrap'); if(!scene) return;
  const notes=['♪','♫','♩','♬'];
  for(let i=0;i<8;i++){const n=document.createElement('div');n.textContent=notes[i%notes.length];n.style.cssText='position:absolute;font-size:'+(14+Math.random()*18)+'px;color:#42A5F5;opacity:0;pointer-events:none;z-index:10;left:'+(Math.random()*80+10)+'%;top:'+(Math.random()*50+10)+'%;animation:noteFloat '+(1+Math.random())+'s ease-out forwards;animation-delay:'+(i*0.15)+'s;';scene.appendChild(n);setTimeout(function(e){e.remove()},3000,n);}
}

function speakText(text) {
  if('speechSynthesis' in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,''));u.lang='en-US';u.rate=0.75;u.pitch=1.0;window.speechSynthesis.speak(u);}
}

function showBubble(text) {
  const b=document.getElementById('speechBubble');b.textContent=text;b.classList.add('show');
  clearTimeout(b._t);b._t=setTimeout(()=>{b.classList.remove('show')},3000);
}

// ====== SVG SCENES ======
function svgWaterSpout(spiderY, hasRain, hasSun, extraClass) {
  let rainDrops = '';
  let sunElem = '';
  let puddle = '';
  let clouds = '';

  if (hasRain) {
    rainDrops = `
      <line x1="100" y1="30" x2="100" y2="70" stroke="#42A5F5" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
        <animate attributeName="y1" values="30;110" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="70;150" dur="0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="150" y1="20" x2="150" y2="50" stroke="#42A5F5" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
        <animate attributeName="y1" values="20;100" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="50;130" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="230" y1="35" x2="230" y2="65" stroke="#42A5F5" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
        <animate attributeName="y1" values="35;120" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="65;150" dur="0.7s" repeatCount="indefinite"/>
      </line>
      <line x1="290" y1="15" x2="290" y2="45" stroke="#42A5F5" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
        <animate attributeName="y1" values="15;105" dur="1.0s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="45;135" dur="1.0s" repeatCount="indefinite"/>
      </line>
      <line x1="340" y1="25" x2="340" y2="60" stroke="#42A5F5" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
        <animate attributeName="y1" values="25;115" dur="0.85s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="60;150" dur="0.85s" repeatCount="indefinite"/>
      </line>
      <line x1="380" y1="40" x2="380" y2="70" stroke="#42A5F5" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
        <animate attributeName="y1" values="40;120" dur="0.75s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="70;150" dur="0.75s" repeatCount="indefinite"/>
      </line>
      <!-- Cloud -->
      <ellipse cx="280" cy="25" rx="80" ry="20" fill="#90CAF9" opacity="0.5"/>
      <ellipse cx="260" cy="20" rx="50" ry="15" fill="#90CAF9" opacity="0.4"/>
    `;
    puddle = `
      <ellipse cx="220" cy="148" rx="70" ry="8" fill="#BBDEFB" opacity="0.4"/>
      <ellipse cx="220" cy="148" rx="50" ry="5" fill="#90CAF9" opacity="0.3"/>
    `;
  }

  if (hasSun) {
    sunElem = `
      <g transform="translate(370,40)">
        <circle cx="0" cy="0" r="28" fill="#FFD54F">
          <animate attributeName="r" values="28;32;28" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="22" fill="#FFEB3B"/>
        <!-- Rays -->
        <line x1="0" y1="-30" x2="0" y2="-38" stroke="#FFD54F" stroke-width="3" stroke-linecap="round">
          <animate attributeName="y1" values="-30;-35;-30" dur="1.5s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="30" x2="0" y2="38" stroke="#FFD54F" stroke-width="3" stroke-linecap="round">
          <animate attributeName="y1" values="30;35;30" dur="1.5s" repeatCount="indefinite"/>
        </line>
        <line x1="-30" y1="0" x2="-38" y2="0" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/>
        <line x1="30" y1="0" x2="38" y2="0" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/>
        <line x1="-22" y1="-22" x2="-28" y2="-28" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/>
        <line x1="22" y1="-22" x2="28" y2="-28" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/>
        <line x1="-22" y1="22" x2="-28" y2="28" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/>
        <line x1="22" y1="22" x2="28" y2="28" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/>
      </g>
    `;
  }

  // Spider SVG
  const spiderSize = hasRain ? '0.7' : '0.9';
  const spiderTransform = hasRain
    ? `transform="translate(190,${spiderY}) scale(${spiderSize})"`
    : `transform="translate(195,${spiderY}) scale(${spiderSize})"`;

  const spiderBody = `
    <g ${spiderTransform}>
      <!-- Legs -->
      <path d="M-8,0 Q-20,-12 -22,-8" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <path d="M-8,2 Q-22,-6 -25,0" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <path d="M-8,4 Q-22,4 -24,10" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <path d="M-6,6 Q-18,12 -20,18" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,0 Q20,-12 22,-8" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,2 Q22,-6 25,0" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,4 Q22,4 24,10" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <path d="M6,6 Q18,12 20,18" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <!-- Body -->
      <circle cx="0" cy="2" r="10" fill="#9C27B0"/>
      <circle cx="0" cy="-6" r="7" fill="#AB47BC"/>
      <!-- Eyes -->
      <circle cx="-3" cy="-8" r="2.5" fill="white"/>
      <circle cx="3" cy="-8" r="2.5" fill="white"/>
      <circle cx="-3" cy="-8" r="1.2" fill="#333"/>
      <circle cx="3" cy="-8" r="1.2" fill="#333"/>
      <!-- Smile -->
      <path d="M-3,-4 Q0,-2 3,-4" fill="none" stroke="#7B1FA2" stroke-width="0.8" stroke-linecap="round"/>
    </g>
  `;

  // Water spout
  const spout = `
    <!-- Downspout pipe -->
    <rect x="200" y="60" width="14" height="95" rx="4" fill="#78909C"/>
    <rect x="200" y="60" width="14" height="8" rx="2" fill="#546E7A"/>
    <!-- Spout top (horizontal) -->
    <rect x="190" y="55" width="34" height="10" rx="4" fill="#90A4AE"/>
    <rect x="190" y="55" width="34" height="4" rx="2" fill="#78909C"/>
    <!-- Spout opening circle -->
    <ellipse cx="207" cy="58" rx="18" ry="6" fill="none" stroke="#78909C" stroke-width="3"/>
    <!-- House wall -->
    <rect x="214" y="60" width="50" height="95" rx="2" fill="#EF9A9A"/>
    <rect x="214" y="60" width="50" height="6" rx="2" fill="#E57373"/>
    <!-- Window -->
    <rect x="224" y="80" width="30" height="30" rx="3" fill="#FFF9C4" stroke="#BCAAA4" stroke-width="2"/>
    <line x1="239" y1="80" x2="239" y2="110" stroke="#BCAAA4" stroke-width="1.5"/>
    <line x1="224" y1="95" x2="254" y2="95" stroke="#BCAAA4" stroke-width="1.5"/>
  `;

  const skyColor = hasRain ? '#B0BEC5' : (hasSun ? '#87CEEB' : '#87CEEB');
  const groundColor = hasRain ? '#8BC34A' : '#7CB342';
  const groundTop = hasRain ? '#689F38' : '#558B2F';

  return `<svg viewBox="0 0 440 200">
    <!-- Sky -->
    <rect width="440" height="130" fill="${skyColor}"/>
    <!-- Ground -->
    <rect x="0" y="130" width="440" height="70" fill="${groundColor}"/>
    <rect x="0" y="130" width="440" height="8" fill="${groundTop}"/>
    ${clouds}
    ${sunElem}
    ${rainDrops}
    ${puddle}
    ${spout}
    ${spiderBody}
  </svg>`;
}

function svgCoverScene() {
  return `<svg viewBox="0 0 440 240">
    <!-- Sky -->
    <rect width="440" height="160" fill="#87CEEB"/>
    <!-- Sun -->
    <circle cx="380" cy="40" r="30" fill="#FFD54F"/>
    <circle cx="380" cy="40" r="24" fill="#FFEB3B"/>
    <!-- Cloud -->
    <ellipse cx="100" cy="35" rx="45" ry="18" fill="white" opacity="0.7"/>
    <ellipse cx="130" cy="30" rx="35" ry="14" fill="white" opacity="0.6"/>
    <!-- Ground -->
    <rect x="0" y="160" width="440" height="80" fill="#7CB342"/>
    <rect x="0" y="160" width="440" height="8" fill="#558B2F"/>
    <!-- Water spout -->
    <rect x="195" y="55" width="16" height="110" rx="4" fill="#78909C"/>

function getSVG(idx) {
  if(idx===0) return svgCoverScene();
  const p=pages[idx];
  if(p.final) return svgFinalScene();
  const s=p.svg||'up';
  if(s==='up') return svgUpScene();
  if(s==='rain') return svgRainScene();
  if(s==='sun') return svgSunScene();
  if(s==='up-again') return svgUpAgainScene();
  return svgUpScene();
}

// ====== GAME LOGIC ======
function startWordGame(idx,word) {
  if(gameDone[idx]) return '<div class="word-game" style="background:#E8F5E9"><h3>✅ 完成！</h3></div>';
  const letters=[...word].sort(()=>Math.random()-0.5);
  buildingWord=[];
  gameDone[idx]=false;
  return `<div class="word-game">
    <h3>⚙️ 拼单词: <strong>"${word}"</strong> 🔊</h3>
    <div class="word-slots" id="ws-${idx}" ondragover="onDragOver(event,${idx})" ondrop="onDrop(event,${idx})" ondragleave="onDragLeave(event,${idx})">
      ${word.split('').map((_,i)=>'<div class="word-slot" id="slot-'+idx+'-'+i+'"></div>').join('')}
    </div>
    <div class="letter-tiles">
      ${letters.map(l=>'<div class="letter-tile" draggable="true" ondragstart="onDragStart(event,'+idx+',\\''+l+'\\')" ondragend="onDragEnd(event)" onclick="pickLetter('+idx+',\\''+l+'\\',this)">'+l+'</div>').join('')}
    </div>
  </div>`;
}

function pickLetter(idx,letter,el) {
  if(gameDone[idx]||el.classList.contains('used')) return;
  const p=pages[idx]; const word=p.game; const slot=buildingWord.length;
  if(slot>=word.length) return;
  const slots=document.querySelectorAll('#ws-'+idx+' .word-slot');
  if(letter===word[slot]){
    buildingWord.push(letter); slots[slot].textContent=letter; slots[slot].classList.add('filled');
    el.classList.add('correct','used');
    if(buildingWord.length===word.length){gameDone[idx]=true;setTimeout(()=>{showBubble('Great! 🎉');launchConfetti();renderPage(idx);},500);}
  } else { el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),400); }
}

function onDragStart(e,idx,letter){dragData={idx,letter,el:e.target};e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function onDragEnd(e){e.target.classList.remove('dragging');document.querySelectorAll('.word-slot.drag-over').forEach(s=>s.classList.remove('drag-over'));}
function onDragOver(e,idx){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('#ws-'+idx+' .word-slot:not(.filled)').forEach(s=>s.classList.add('drag-over'));}
function onDragLeave(e,idx){document.querySelectorAll('#ws-'+idx+' .word-slot').forEach(s=>s.classList.remove('drag-over'));}
function onDrop(e,idx){
  e.preventDefault();document.querySelectorAll('#ws-'+idx+' .word-slot').forEach(s=>s.classList.remove('drag-over'));
  if(!dragData||dragData.idx!==idx||gameDone[idx]) return;
  pickLetter(idx,dragData.letter,dragData.el);dragData=null;
}

// ====== RENDER ======
function renderPage(idx) {
  const area=document.getElementById('pageArea');
  const p=pages[idx];

  if(p.cover){
    area.innerHTML=`<div class="page active cover-page">
      <div class="cover-svg">${getSVG(0)}</div>
      <div class="page-title">${p.title}</div>
      <div class="page-desc">${p.subtitle}</div>
      <div style="display:flex;gap:16px;justify-content:center;align-items:center;margin-top:4px">
        <button class="big-start-btn" onclick="playSong();showMusicNotes()" style="width:90px;height:90px;font-size:28px;animation:float 2s ease-in-out infinite">🎵</button>
        <button class="big-start-btn" onclick="nextPage()">▶</button>
      </div>
    </div>`;
    updateUI(idx); return;
  }

  if(p.final){
    area.innerHTML=`<div class="page active">
      <div class="page-title">${p.title}</div>
      <div class="scene-wrap" style="position:relative">${getSVG(idx)}</div>
      <div class="final-grid">
        <div class="final-item"><div style="font-size:36px">🕷️</div><div class="label">Spider</div></div>
        <div class="final-item"><div style="font-size:36px">☀️</div><div class="label">Sun</div></div>
        <div class="final-item"><div style="font-size:36px">🌧️</div><div class="label">Rain</div></div>
        <div class="final-item"><div style="font-size:36px">💧</div><div class="label">Water</div></div>
      </div>
      <div style="font-size:24px;margin:10px 0">🎉 ⭐ ⭐ ⭐ 🎉</div>
      <a class="home-link" href="https://nonomil.github.io/childrens-library/courseware/">🏠 回课件列表</a>
    </div>`;
    launchConfetti(); updateUI(idx); return;
  }

  let gameHTML='';
  if(p.game){
    gameHTML=startWordGame(idx,p.game);
    buildingWord=[];
  }

  area.innerHTML=`<div class="page active">
    <div class="scene-wrap" style="position:relative">${getSVG(idx)}</div>
    <div class="lyrics">${p.sentence}</div>
    ${gameHTML}
  </div>`;

  // Make clickable words speak
  area.querySelectorAll('.hl[data-word]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      speakText(this.getAttribute('data-word'));
      showBubble('🔊 '+this.getAttribute('data-word'));
    });
  });

  updateUI(idx);
}

function updateUI(idx) {
  const dots=document.getElementById('progressDots');
  dots.innerHTML=pages.map((_,i)=>'<div class="dot '+(i===idx?'active':'')+(gameDone[i]?' done':'')+'" onclick="goToPage('+i+')"></div>').join('');
  document.getElementById('prevBtn').disabled=idx===0;
  document.getElementById('nextBtn').disabled=idx===pages.length-1;
  document.getElementById('pageCounter').textContent='第'+(idx+1)+'页 / 共'+pages.length+'页';
  document.getElementById('nextBtn').style.display=idx===pages.length-1?'none':'';
  currentPage=idx;
}

function prevPage(){if(currentPage>0)goToPage(currentPage-1);}
function nextPage(){if(currentPage<pages.length-1)goToPage(currentPage+1);}
function goToPage(idx){renderPage(idx);}

function speakPage() {
  const p=pages[currentPage];
  if(p.cover) { showBubble('🕷️ Itsy Bitsy Spider!'); speakText('Itsy Bitsy Spider'); return; }
  if(p.final) { showBubble('You did it! Itsy Bitsy Star! 🌟'); speakText('You did it! Itsy Bitsy Star!'); return; }
  const txt=p.sentence.replace(/<[^>]+>/g,'');
  showBubble('🔊 '+txt);
  speakText(txt);
}

// ====== CONFETTI ======
function launchConfetti() {
  const d=document.createElement('div');d.className='celebration';
  const colors=['#9C27B0','#42A5F5','#4CAF50','#FFD54F','#FF7043','#AB47BC'];
  for(let i=0;i<40;i++){const c=document.createElement('div');c.style.cssText='position:absolute;width:'+(6+Math.random()*8)+'px;height:'+(6+Math.random()*8)+'px;border-radius:50%;left:'+(Math.random()*100)+'%;top:10%;background:'+colors[i%colors.length]+';animation:confetti-fall '+(1.5+Math.random())+'s ease-out forwards;animation-delay:'+(Math.random()*0.5)+'s;';d.appendChild(c);}
  document.body.appendChild(d);setTimeout(()=>d.remove(),3000);
}

// ====== KEYBOARD ======
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') prevPage();
  if(e.key==='ArrowRight') nextPage();
});

// ====== INIT ======
renderPage(0);
</script>
