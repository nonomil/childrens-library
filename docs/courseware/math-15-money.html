<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>数学课 15 · 认识钱币</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#e3f2fd;display:flex;align-items:center;justify-content:center;min-height:100dvh}
.book{flex-shrink:0;position:relative;width:100%;max-width:960px;height:100dvh;max-height:90vh;overflow:hidden;background:linear-gradient(160deg,#42A5F5 0%,#1E88E5 40%,#1565C0 100%);border-radius:0}
@media(min-width:460px){.book{border-radius:28px;box-shadow:0 12px 50px rgba(0,0,0,.28);height:94dvh;margin:3dvh auto}}
@media(min-width:768px) and (orientation:landscape){.book{max-width:960px!important;width:100%!important}}
.top-bar{position:absolute;top:0;left:0;right:0;z-index:25;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;pointer-events:none}
.top-bar a{pointer-events:auto;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:30px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;color:#fff;cursor:pointer}
.slides{position:relative;width:100%;height:calc(100% - 60px);overflow:hidden}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:50px 14px 12px;opacity:0;visibility:hidden;overflow-y:auto;gap:6px}
.slide.active{opacity:1;visibility:visible;position:relative;z-index:2}
.page-title{font-size:26px;font-weight:900;color:#fff;text-align:center}
.card{background:rgba(255,255,255,.92);border-radius:16px;padding:10px 12px;width:100%;max-width:380px}
.card p{font-size:13px;color:#333;line-height:1.6}
.quiz-opt{background:#fff;border:2px solid #90CAF9;border-radius:12px;padding:8px 14px;cursor:pointer;font-size:14px;color:#1565C0;width:100%;max-width:360px;text-align:center;touch-action:manipulation;transition:all .15s}
.quiz-opt.correct{border-color:#4CAF50;background:#E8F5E9;color:#2E7D32}
.quiz-opt.wrong{border-color:#F44336;background:#FFEBEE;color:#C62828}
.feedback{font-size:13px;border-radius:8px;display:none;text-align:center;padding:4px}
.feedback.show{display:block}
.feedback.good{background:#E8F5E9;color:#2E7D32}
.feedback.bad{background:#FFEBEE;color:#C62828}
.controls{position:absolute;bottom:6px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;z-index:20}
.nav-btn{background:rgba(255,255,255,.25);border-radius:50%;width:42px;height:42px;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav-btn:disabled{opacity:.25;cursor:default}
.dots{display:flex;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;border:none;transition:all .2s}
.dot.active{background:#fff;transform:scale(1.3)}
.goal-card{background:rgba(255,255,255,.95);border-radius:18px;padding:12px 16px;width:100%;max-width:360px}
.goal-card h3{font-size:14px;color:#1565C0;margin-bottom:4px}
.goal-card li{font-size:13px;color:#333;padding:2px 0;list-style:none}
.goal-card li::before{content:'✅ '}
@keyframes confetti-fall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

  /* ── speak button ── */
  .speak-btn {
    background: rgba(255,255,255,.2); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.15); border-radius: 50%;
    width: 40px; height: 40px; color: #fff; font-size: 20px;
    cursor: pointer; display: inline-flex; align-items: center;
    justify-content: center; transition: all .2s;
    touch-action: manipulation; user-select: none;
    line-height: 1;
  }
  .speak-btn:hover { background: rgba(255,255,255,.35); }
  .speak-btn:active { transform: scale(.88); }
  .speak-btn.speaking { background: rgba(255,255,255,.4); animation: speakPulse 1s ease-in-out infinite; }
  @keyframes speakPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,.5); transform: scale(1); } 50% { box-shadow: 0 0 0 10px rgba(255,255,255,0); transform: scale(1.08); } }

</style>
</head>
<body>
<div class="book">
<div class="top-bar"><a href="../">🏠</a><button class="speak-btn" id="speakBtn" title="朗读本页" style="background:none;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0;width:auto;height:auto;color:inherit">🔊</button><a href="../math-16-clock.html">▶</a></div>
<div class="slides" id="slides"></div>
<div class="controls">
<button class="nav-btn" id="prevBtn" onclick="go(-1)">◀</button>
<div class="dots" id="dots"></div>
<button class="nav-btn" id="nextBtn" onclick="go(1)">▶</button>
</div>
</div>
<div id="confetti" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999"></div>
<script>
const pages=[{
cover:true,icon:'💰',title:'认识钱币',subtitle:'数学课 第15课',goals:['认识人民币：元、角、分','会看钱币面值','会简单计算钱数','学会合理花钱']
},{
title:'🪙 认识钱币',text:'中国的钱叫人民币。<br>单位：元(¥)、角(角)、分(分)<br><br>常见纸币：100元、50元、20元、10元、5元、1元<br>常见硬币：1元、5角、1角<br><br>1元 = 10角<br>1角 = 10分',
svg:'<svg viewBox="0 0 280 80" style="width:90%;max-width:280px"><rect x="10" y="10" width="60" height="30" rx="4" fill="#4CAF50"/><text x="40" y="30" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1元</text><rect x="80" y="10" width="60" height="30" rx="4" fill="#FF9800"/><text x="110" y="30" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">5角</text><rect x="150" y="10" width="60" height="30" rx="4" fill="#9E9E9E"/><text x="180" y="30" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1角</text><text x="40" y="65" font-size="13" fill="#FFD54F" text-anchor="middle">1元=10角</text><text x="140" y="65" font-size="13" fill="#FFD54F" text-anchor="middle">1角=10分</text></svg>'
},{
title:'🛒 买东西',text:'Steve去商店买东西：<br><br>🍎 苹果 3元<br>🍦 冰淇淋 5元<br>🚌 公交车 2元<br>📚 故事书 8元<br><br>买一个苹果和一个冰淇淋一共多少钱？<br>3+5=8元！<br><br>付10元买冰淇淋，找零多少？<br>10-5=5元！',
svg:'<svg viewBox="0 0 260 60" style="width:90%;max-width:260px"><text x="10" y="20" font-size="13" fill="#fff">🍎3元+🍦5元=8元</text><text x="10" y="45" font-size="13" fill="#FFD54F">💰10元-🍦5元=找零5元</text></svg>'
},{
title:'❌ 常见误解',items:[
{title:'元角混淆',w:'1元=1角？',r:'不对！1元=10角！'},
{title:'面值大小',w:'5角比1元大？',r:'5角=0.5元，比1元小！'},
{title:'计算错误',w:'10元买3元的东西，找7元',r:'10-3=7，没错！但如果是10元买3元+5元，找2元'}
]
},{
title:'✏️ 选一选',interactive:true,type:'quiz',q:'一个书包35元，付50元，找零多少？',options:['15元','10元','25元'],correct:0
},{
title:'✏️ 再选一选',interactive:true,type:'quiz2',q:'5元+3元+2元=？',options:['8元','10元','11元'],correct:1
},{
title:'🎉 太棒了！',final:true,msg:'你完成了认识钱币！🏅<br>获得「理财小达人」徽章！<br><br>记住：1元=10角，<br>买东西要学会算钱哦！'
}];
let cur=0,quizA={};
function render(n){
  const el=document.getElementById('slides');
  const p=pages[n];
  if(!p)return;
  let h='';
  if(p.cover){
    h=`<div class="slide active"><div style="font-size:64px;margin:4px">${p.icon}</div><div class="page-title">${p.title}</div>`;
    if(p.subtitle)h+=`<p class="page-sub" style="font-size:13px;color:rgba(255,255,255,.7)">${p.subtitle}</p>`;
    if(p.goals){
      h+=`<div class="goal-card"><h3>📋 学习目标</h3><ul>`;
      p.goals.forEach(g=>h+=`<li>${g}</li>`);
      h+=`</ul></div></div>`;
    }
  }else if(p.final){
    h=`<div class="slide active" style="justify-content:center;text-align:center;gap:12px"><div style="font-size:72px">🎉</div><h2 style="font-size:24px;color:#fff">${p.title}</h2><p style="font-size:14px;color:rgba(255,255,255,.9);line-height:1.7">${p.msg}</p></div>`;
    setTimeout(doConfetti,300);
  }else if(p.interactive){
    h=`<div class="slide active" style="gap:8px"><h3 style="font-size:18px;color:#fff">${p.title}</h3>`;
    h+=`<div class="card"><p style="font-size:14px;font-weight:600;color:#1565C0;margin-bottom:6px">${p.q}</p>`;
    p.options.forEach((o,i)=>{h+=`<div class="quiz-opt" onclick="clickQuiz(${n},${i})" data-idx="${i}">${String.fromCharCode(65+i)}. ${o}</div>`;});
    h+=`<div class="feedback" id="fb${n}"></div></div></div>`;
  }else{
    h=`<div class="slide active" style="gap:6px"><h3 style="font-size:18px;color:#fff">${p.title}</h3>`;
    if(p.svg)h+=p.svg;
    if(p.text)h+=`<div class="card"><p>${p.text}</p></div>`;
    if(p.items){p.items.forEach(it=>{h+=`<div class="card" style="border-left:3px solid #42A5F5"><h4 style="font-size:13px;color:#1565C0">${it.title}</h4><p><span style="color:#F44336">❌</span> ${it.w}</p><p><span style="color:#4CAF50">✅</span> ${it.r}</p></div>`;});}
    h+=`</div>`;
  }
  el.innerHTML=h;
  document.getElementById('prevBtn').disabled=n===0;
  document.getElementById('nextBtn').disabled=n===pages.length-1;
  updateDots(n);
  gsap.fromTo('.slide.active>*',{opacity:0,y:15},{opacity:1,y:0,duration:.3,stagger:.05,ease:'power2.out'});
}
function clickQuiz(n,i){
  const p=pages[n];if(quizA[n])return;quizA[n]=true;
  document.querySelectorAll('.quiz-opt').forEach((el,j)=>{el.className='quiz-opt'+(j===p.correct?' correct':j===i?' wrong':'');});
  const fb=document.getElementById('fb'+n);
  if(fb){fb.className='feedback show '+(i===p.correct?' good':' bad');fb.textContent=i===p.correct?'✅ 正确！':'❌ 再想想';}
}
function go(d){cur=Math.max(0,Math.min(pages.length-1,cur+d));render(cur);}
function updateDots(n){const el=document.getElementById('dots');el.innerHTML='';for(let i=0;i<pages.length;i++){const d=document.createElement('button');d.className='dot'+(i===n?' active':'');d.onclick=()=>{cur=i;render(cur);};el.appendChild(d);}}
function doConfetti(){const el=document.getElementById('confetti');const c=['#FF6B6B','#FFB347','#4ECDC4','#A78BFA','#FFD93D','#FF9FF3'];for(let i=0;i<50;i++){const p=document.createElement('div');p.style.cssText='position:absolute;left:'+(Math.random()*100)+'%;top:-10px;width:'+(5+Math.random()*8)+'px;height:'+(5+Math.random()*8)+'px;background:'+c[Math.floor(Math.random()*6)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation:confetti-fall '+(2+Math.random()*2)+'s ease-in '+(Math.random()*2)+'s forwards;';el.appendChild(p);setTimeout(()=>p.remove(),4500);}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
render(0);
</script>


<script>
/* ── Speech Synthesis ── */
(function() {
  var isSpeaking = false;
  var speakBtn = document.getElementById('speakBtn');
  if (!speakBtn) return;

  function getPageText() {
    var active = document.querySelector('.slide.active, .page.active, [class*="active"]');
    if (!active) return '';
    return active.textContent.replace(/\s+/g, ' ').trim();
  }

  function speakText(text) {
    if (!text || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.85; u.pitch = 1.1; u.volume = 1;
    u.onstart = function() { isSpeaking = true; speakBtn.classList.add('speaking'); speakBtn.textContent = '⏹'; };
    u.onend = function() { isSpeaking = false; speakBtn.classList.remove('speaking'); speakBtn.textContent = '🔊'; };
    u.onerror = function() { isSpeaking = false; speakBtn.classList.remove('speaking'); speakBtn.textContent = '🔊'; };
    window.speechSynthesis.speak(u);
  }

  function stopSpeaking() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    isSpeaking = false; speakBtn.classList.remove('speaking'); speakBtn.textContent = '🔊';
  }

  speakBtn.addEventListener('click', function() {
    if (isSpeaking) { stopSpeaking(); return; }
    speakText(getPageText());
  });
})();
</script>


<script>
(function(){
  var sx = 0, sy = 0, swiping = false;
  document.addEventListener('touchstart', function(e) {
    var t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; swiping = true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e) {
    if (!swiping) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiping = false;
      // Find and click the appropriate nav button
      if (dx < 0) {
        // Swipe left → next
        var n = document.querySelector('[onclick*="next"], [onclick*="Next"], .nav-btn:last-of-type:not([disabled]), a[href*="next"], [class*="next"], #nextBtn');
        if (n) n.click();
        else { var a = document.querySelector('a[href]:not([href*="#"])'); if (a && !a.href.includes("#")) a.click(); }
      } else {
        // Swipe right → prev
        var p = document.querySelector('[onclick*="prev"], [onclick*="Prev"], .nav-btn:first-of-type:not([disabled]), [class*="prev"], #prevBtn');
        if (p) p.click();
      }
    }
  }, {passive:true});
  document.addEventListener('touchend', function() { swiping = false; }, {passive:true});
})();
</script>

<!-- ═══ Speak Page - MP3优先, TTS后备 ═══ -->
<script>
(function(){
  var btn = document.getElementById('speakBtn') || document.querySelector('.speak-btn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'speakBtn'; btn.className = 'speak-btn'; btn.title = '朗读本页';
    btn.textContent = '🔊';
    btn.style.cssText = 'position:fixed;bottom:90px;right:16px;z-index:9999;width:48px;height:48px;border-radius:50%;border:2px solid #42A5F5;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(66,165,245,.3);display:flex;align-items:center;justify-content:center';
    document.body.appendChild(btn);
  }
  var sp = false, audioEl = null;
  var courseName = (window.COURSE_NAME || (window.location.pathname.match(/\/(\w[\w-]*)\.html/) || [,''])[1] || '');
  var lang = (document.documentElement.lang || 'en-US').indexOf('zh')>=0?'zh-CN':'en-US';

  function getPageIdx(){
    var a=document.querySelector('.page.active,.slide.active');
    return a?Array.prototype.indexOf.call(a.parentNode.children,a):-1;
  }

  function speakPage(){
    if(sp){stopPage();return;}
    var idx=getPageIdx(); if(idx<0) return;
    var mp3='audio/'+courseName+'/page-'+(idx+1)+'.mp3';
    if(audioEl){audioEl.pause();audioEl=null;}
    audioEl=new Audio(mp3);
    audioEl.onerror=function(){
      var flat=new Audio('audio/'+courseName+'.mp3');
      flat.onerror=function(){speakTTS();};
      flat.oncanplaythrough=function(){
        if(audioEl)audioEl.pause(); audioEl=flat;
        audioEl.play().catch(function(){speakTTS();});
        btn.textContent='⏹';btn.classList.add('speaking');
      };
      flat.load();
    };
    audioEl.oncanplaythrough=function(){
      audioEl.play(); btn.textContent='⏹';btn.classList.add('speaking');
      sp=true; audioEl.onended=function(){stopPage();};
    };
    audioEl.load();
  }

  function speakTTS(){
    if(!window.speechSynthesis)return;
    var a=document.querySelector('.page.active,.slide.active');
    if(!a)return;
    var t=(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim();
    if(!t||t.length<2)return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang=lang;u.rate=0.85;
    u.onstart=function(){sp=true;btn.classList.add('speaking');btn.textContent='⏹';};
    u.onend=u.onerror=function(){stopPage();};
    window.speechSynthesis.speak(u);
  }

  function stopPage(){
    if(audioEl){audioEl.pause();audioEl=null;}
    if(window.speechSynthesis)window.speechSynthesis.cancel();
    sp=false;btn.classList.remove('speaking');btn.textContent='🔊';
  }

  btn.addEventListener('click',function(e){e.stopPropagation();speakPage();});
  if(btn.textContent.trim()===''||btn.textContent.trim()==='▶')btn.textContent='🔊';
})();
</script>
</body>
</html>
