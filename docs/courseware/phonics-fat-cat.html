<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱 Fat Cat on a Mat - Phonics Reader</title>
<style>
/* === Gears Style Template === */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
  background: linear-gradient(145deg,#FFF8E7 0%,#FFE8C8 100%);
  min-height: 100vh; display: flex; justify-content: center;
  align-items: center; padding: 20px;
}
.book {
  max-width: 800px; width: 100%;
  background: #FFFCF5;
  border-radius: 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15),0 0 0 4px #FFF,0 0 0 8px #FFB347;
  padding: 24px 20px;
  position: relative;
}

/* === Animations === */
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin-cw { to { transform: rotate(360deg); } }
@keyframes spin-ccw { to { transform: rotate(-360deg); } }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes confetti-fall { 0% { opacity: 1; transform: translateY(0) rotate(0deg); } 100% { opacity: 0; transform: translateY(500px) rotate(720deg); } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }

/* === Pages === */
.page-area { min-height: 360px; }
.page {
  display: none; flex-direction: column; align-items: center;
  animation: fadeIn 0.4s ease; width: 100%;
}
.page.active { display: flex; }

/* Cover Page */
.cover-page { text-align: center; padding: 20px 10px; }
.cover-page .big-icon {
  font-size: 120px; margin-bottom: 20px;
  animation: float 3s ease-in-out infinite;
}
.cover-page .page-title {
  font-size: 36px; color: #E8751A; margin-bottom: 10px;
}
.cover-page .page-desc {
  color: #6B4F3A; font-size: 19px; margin-bottom: 16px;
}
.cover-hint {
  margin-top: 16px; font-size: 14px; color: #bbb;
}

/* Page Title Structure */
.page-title {
  font-size: 34px;
  color: #E8751A;
  text-align: center;
  margin-bottom: 6px;
  font-weight: bold;
}
.page-title-icon {
  font-size: 48px;
  margin-bottom: 4px;
}
.page-desc {
  color: #6B4F3A;
  font-size: 19px;
  text-align: center;
  margin-bottom: 12px;
  line-height: 1.5;
}

/* Illustration */
.illustration {
  width: 200px; height: 180px; border-radius: 20px;
  background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 90px; margin-bottom: 14px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* Sentence */
.sentence {
  font-size: 26px; line-height: 1.6; text-align: center;
  padding: 14px 20px; background: #FFFCF5; border-radius: 16px;
  width: 100%; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  border: 2px solid #FFE8C8;
}
.sentence .ph-word {
  color: #E8751A; font-weight: bold; cursor: pointer;
  border-bottom: 3px solid #FFB347; transition: background 0.15s;
}
.sentence .ph-word:hover { background: #FFF8E7; border-radius: 4px; }

/* Phonics Word Family Bar */
.phonics-bar {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  margin-bottom: 10px;
}
.sound-tag {
  background: #FFB347; color: white; padding: 6px 18px;
  border-radius: 20px; font-size: 16px; font-weight: bold;
  cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 8px rgba(255,179,71,0.3);
  user-select: none;
}
.sound-tag:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 12px rgba(255,179,71,0.5);
}

/* Game Area */
.game-area {
  width: 100%; margin-top: 6px; padding: 16px;
  background: #FFF8E7; border-radius: 20px; text-align: center;
  border: 2px solid #FFE8C8;
}
.game-area h3 { font-size: 16px; color: #E8751A; margin-bottom: 10px; }
.letter-tiles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.letter-tile {
  width: 52px; height: 52px; border-radius: 12px; border: 3px solid #E0D5C7;
  background: white; font-size: 28px; font-weight: bold; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; user-select: none;
}
.letter-tile:hover { border-color: #FFB347; background: #FFF8E7; transform: scale(1.1); }
.letter-tile.correct {
  border-color: #4CAF50; background: #E8F5E9;
  animation: popIn 0.3s ease;
}
.letter-tile.wrong { border-color: #F44336; background: #FFEBEE; animation: shake 0.3s; }
.letter-tile.used { opacity: 0.35; pointer-events: none; }
.word-build {
  display: flex; gap: 4px; justify-content: center; margin-bottom: 10px;
  min-height: 48px;
}
.word-slot {
  width: 48px; height: 48px; border-bottom: 4px solid #FFB347;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: bold; color: #E8751A;
  transition: all 0.2s;
}
.word-slot.filled { border-bottom-color: #4CAF50; animation: popIn 0.2s ease; }

/* Star */
.star { color: #FFB347; font-size: 24px; }

/* === Navigation Bar === */
.nav-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 16px; padding: 4px 0; gap: 6px;
}
.nav-btn {
  width: 50px; height: 50px; border-radius: 50%;
  background: #FFB347; color: white; border: none;
  font-size: 22px; cursor: pointer;
  box-shadow: 0 4px 12px rgba(255,179,71,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.nav-btn:hover:not(:disabled) {
  transform: scale(1.1);
  box-shadow: 0 6px 16px rgba(255,179,71,0.5);
}
.nav-btn:active:not(:disabled) { transform: scale(0.95); }
.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
.nav-btn-prev { /* keeps default styles */ }
.nav-btn-next { /* keeps default styles */ }

.read-btn {
  background: #6BCB77; color: white; border: none;
  border-radius: 30px; padding: 8px 18px;
  font-size: 16px; font-weight: 600; cursor: pointer;
  box-shadow: 0 4px 12px rgba(107,203,119,0.4);
  font-family: inherit;
  transition: transform 0.15s, box-shadow 0.15s;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
.read-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 16px rgba(107,203,119,0.5);
}
.read-btn:active { transform: scale(0.95); }

/* Progress Dots */
.page-dots {
  display: flex; gap: 6px; justify-content: center; align-items: center;
  flex: 1;
}
.dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: #E0D5C7; cursor: pointer; transition: all 0.2s;
}
.dot:hover { background: #FFB347; }
.dot.active { background: #FFB347; transform: scale(1.3); }
.dot.done { background: #4CAF50; }

/* Page Counter */
.page-counter {
  font-size: 14px; color: #6B4F3A; text-align: center;
  margin-top: 6px; font-weight: 500;
}

/* === Celebration / Confetti === */
.celebration {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 9999;
}

/* Back Link */
.back-link {
  display: inline-block; margin-top: 8px; padding: 8px 20px;
  background: #FFF8E7; border-radius: 10px; color: #6B4F3A;
  text-decoration: none; font-size: 13px;
  transition: background 0.2s;
}
.back-link:hover { background: #FFE8C8; }

/* === Responsive === */
@media (max-width: 500px) {
  .illustration { width: 140px; height: 130px; font-size: 60px; }
  .sentence { font-size: 20px; }
  .page-title { font-size: 26px; }
  .page-title-icon { font-size: 38px; }
  .page-desc { font-size: 16px; }
  .letter-tile { width: 44px; height: 44px; font-size: 22px; }
  .word-slot { width: 40px; height: 40px; font-size: 22px; }
  .nav-btn { width: 42px; height: 42px; font-size: 18px; }
  .read-btn { padding: 6px 14px; font-size: 13px; }
  .book { padding: 16px 12px; }
  .cover-page .big-icon { font-size: 80px; }
  .cover-page .page-title { font-size: 26px; }
}
</style>
</head>
<body>

<div class="book">
  <div class="page-area" id="pageArea"></div>

  <!-- Navigation Bar (Gears Style) -->
  <div class="nav-bar">
    <button class="nav-btn nav-btn-prev" id="prevBtn" onclick="prevPage()" disabled aria-label="上一页">◀</button>
    <button class="read-btn" id="speakBtn" onclick="speakPage()">🔊 读给我听</button>
    <div class="page-dots" id="progressDots"></div>
    <button class="nav-btn nav-btn-next" id="nextBtn" onclick="nextPage()" aria-label="下一页">▶</button>
  </div>
  <div class="page-counter" id="pageCounter">第1页 / 共9页</div>
</div>

<script>
// === COVER + 8 STORY PAGES ===
const pages = [
  // Page 0: Cover
  {
    cover: true,
    icon: '🐱',
    title: 'Fat Cat on a Mat',
    subtitle: 'A phonics story about a cat, a rat, and a hat!',
    sentence: ''
  },
  // Page 1
  {
    emoji: '🐱', sentence: 'A <span class="ph-word">fat</span> cat sat on a <span class="ph-word">mat</span>.',
    game: { word: 'fat', letters: ['f', 'a', 't', 'c', 'r', 'h'] },
    pageTitle: 'Fat Cat',
    pageIcon: '🐱'
  },
  // Page 2
  {
    emoji: '🐭', sentence: 'A <span class="ph-word">rat</span> ran to the <span class="ph-word">cat</span>.',
    game: { word: 'rat', letters: ['r', 'a', 't', 'm', 's', 'p'] },
    pageTitle: 'Rat and Cat',
    pageIcon: '🐭'
  },
  // Page 3
  {
    emoji: '🎩', sentence: '"<span class="ph-word">Hat</span> on the <span class="ph-word">mat</span>!" said the cat.',
    game: { word: 'hat', letters: ['h', 'a', 't', 'b', 'f', 'm'] },
    pageTitle: 'Hat on the Mat',
    pageIcon: '🎩'
  },
  // Page 4
  {
    emoji: '🦇', sentence: 'A <span class="ph-word">bat</span> flew to the <span class="ph-word">mat</span>.',
    game: { word: 'bat', letters: ['b', 'a', 't', 'r', 'l', 'p'] },
    pageTitle: 'Bat and Mat',
    pageIcon: '🦇'
  },
  // Page 5
  {
    emoji: '🧢', sentence: '"<span class="ph-word">Pat</span> the <span class="ph-word">cat</span>!" said the rat.',
    game: { word: 'pat', letters: ['p', 'a', 't', 'd', 'c', 'b'] },
    pageTitle: 'Pat the Cat',
    pageIcon: '🧢'
  },
  // Page 6
  {
    emoji: '😺', sentence: 'The cat had a <span class="ph-word">nap</span> on the <span class="ph-word">mat</span>.',
    game: { word: 'nap', letters: ['n', 'a', 'p', 't', 'c', 'f'] },
    pageTitle: 'Nap Time',
    pageIcon: '😺'
  },
  // Page 7
  {
    emoji: '🐱', sentence: 'The <span class="ph-word">cat</span> was <span class="ph-word">fat</span> and <span class="ph-word">happy</span>!',
    game: { word: 'cat', letters: ['c', 'a', 't', 'f', 'n', 'p'] },
    pageTitle: 'Happy Cat',
    pageIcon: '🐱'
  },
  // Page 8: Completion
  {
    emoji: '⭐', sentence: '🎉 You read the whole story! Great <span class="ph-word">reading</span>!',
    game: null,
    pageTitle: 'Great Reading!',
    pageIcon: '⭐'
  }
];

let currentPage = 0;
let gameDone = new Array(pages.length).fill(false);
let buildingWord = [];
let currentTarget = [];

// ===== Gears-Style launchConfetti =====
function launchConfetti() {
  const div = document.createElement('div');
  div.className = 'celebration';
  const colors = ['#FF6B6B','#FFB347','#4ECDC4','#FFE66D','#A78BFA','#FF9FF3'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.style.cssText = `position:absolute;width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;border-radius:50%;left:${Math.random()*100}%;top:15%;background:${colors[i%colors.length]};animation:confetti-fall ${1.5+Math.random()}s ease-out forwards;animation-delay:${Math.random()*0.6}s;`;
    div.appendChild(c);
  }
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

// ===== Render Page =====
function renderPage(idx) {
  const area = document.getElementById('pageArea');
  const p = pages[idx];

  if (p.cover) {
    area.innerHTML = `
      <div class="page active cover-page" id="page-${idx}">
        <div class="big-icon">${p.icon}</div>
        <div class="page-title">${p.title}</div>
        <div class="page-desc">${p.subtitle}</div>
        <div class="cover-hint">👆 点击 "▶" 开始阅读！</div>
      </div>
    `;
    updateUI(idx);
    return;
  }

  // Game rendering
  const isDone = !p.game || gameDone[idx];
  let gameHTML = '';
  if (p.game && !gameDone[idx]) {
    const shuffled = [...p.game.letters].sort(() => Math.random() - 0.5);
    currentTarget = p.game.word.split('');
    buildingWord = [];
    gameHTML = `
      <div class="game-area" id="game-${idx}">
        <h3>🔤 拼单词: <strong>"${p.game.word}"</strong></h3>
        <div class="word-build" id="wordBuild-${idx}">
          ${p.game.word.split('').map(() => '<div class="word-slot" id="slot-${idx}-"></div>').join('')}
        </div>
        <div class="letter-tiles" id="tiles-${idx}">
          ${shuffled.map((l, i) => `<div class="letter-tile" data-letter="${l}" onclick="pickLetter(${idx}, '${l}', this)">${l}</div>`).join('')}
        </div>
      </div>
    `;
    gameDone[idx] = false;
  } else if (isDone && p.game) {
    gameHTML = `<div class="game-area" style="background:#E8F5E9"><h3>✅ 拼词完成！</h3><p style="color:#4CAF50;font-size:30px">⭐ ⭐ ⭐</p></div>`;
  } else {
    gameHTML = `<div class="game-area" style="background:#FFF8E7"><h3>🎉 ${p.emoji} 太棒了！★★★</h3></div>`;
  }

  // Phonics word family bar (always show the 4 families)
  const phonicsBar = `
    <div class="phonics-bar">
      <span class="sound-tag" onclick="speakText('at')">🔊 at</span>
      <span class="sound-tag" onclick="speakText('an')">🔊 an</span>
      <span class="sound-tag" onclick="speakText('ap')">🔊 ap</span>
      <span class="sound-tag" onclick="speakText('ad')">🔊 ad</span>
    </div>
  `;

  area.innerHTML = `
    <div class="page active" id="page-${idx}">
      <div class="page-title-icon">${p.pageIcon || p.emoji}</div>
      <div class="page-title">${p.pageTitle || ''}</div>
      <div class="page-desc">${p.sentence.replace(/<[^>]+>/g, '')}</div>
      ${phonicsBar}
      <div class="illustration">${p.emoji}</div>
      <div class="sentence">${p.sentence}</div>
      ${gameHTML}
    </div>
  `;

  updateUI(idx);
}

// ===== Pick Letter (Word Building Game) =====
function pickLetter(idx, letter, el) {
  if (gameDone[idx]) return;
  if (el.classList.contains('used')) return;

  const target = pages[idx].game.word;
  const slotIdx = buildingWord.length;
  if (slotIdx >= target.length) return;

  const slots = document.querySelectorAll(`#wordBuild-${idx} .word-slot`);
  if (letter === target[slotIdx]) {
    // Correct!
    buildingWord.push(letter);
    slots[slotIdx].textContent = letter;
    slots[slotIdx].classList.add('filled');
    el.classList.add('correct');
    el.classList.add('used');

    // Check if word completed
    if (buildingWord.length === target.length) {
      gameDone[idx] = true;
      setTimeout(() => {
        launchConfetti();
        renderPage(idx);
      }, 600);
    }
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 400);
  }
}

// ===== Text-to-Speech =====
function speakText(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.7; u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

function speakPage() {
  const p = pages[currentPage];
  let txt = '';
  if (p.cover) {
    txt = p.title + '. ' + p.subtitle;
  } else {
    txt = p.sentence.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');
  }
  speakText(txt);
}

// ===== Navigation =====
function nextPage() {
  const p = pages[currentPage];
  if (p.game && !gameDone[currentPage]) return;
  if (currentPage < pages.length - 1) {
    currentPage++;
    renderPage(currentPage);
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    renderPage(currentPage);
  }
}

function goToPage(idx) {
  currentPage = idx;
  renderPage(idx);
}

// ===== Update UI =====
function updateUI(idx) {
  // Page counter: 第X页 / 共Y页
  document.getElementById('pageCounter').textContent = `第${idx+1}页 / 共${pages.length}页`;

  // Progress dots
  const dotsContainer = document.getElementById('progressDots');
  dotsContainer.innerHTML = pages.map((_, i) =>
    `<div class="dot ${i === idx ? 'active' : ''} ${gameDone[i] && !pages[i].cover ? 'done' : ''}" onclick="goToPage(${i})"></div>`
  ).join('');

  // Prev/Next buttons
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === pages.length - 1;
}

// ===== Bootstrap =====
renderPage(0);
</script>
</body>
</html>
