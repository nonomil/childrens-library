<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sight Word Tales - Can We Get a Pet?</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
  background: linear-gradient(145deg,#FFF8E7 0%,#FFE8C8 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.book {
  max-width: 800px;
  width: 100%;
  background: #FFFCF5;
  border-radius: 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15),0 0 0 4px #FFF,0 0 0 8px #FFB347;
  padding: 24px 20px;
}
.page-area { min-height: 380px; }
.page {
  display: none; flex-direction: column; align-items: center;
}
.page.active { display: flex; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.page.active { animation: fadeIn 0.4s ease; }

/* Cover page */
.cover-page .cover-emoji {
  font-size: 120px;
  animation: float 3s ease-in-out infinite;
  margin: 10px 0 20px;
  display: block;
  text-align: center;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}
.cover-page .cover-tagline {
  font-size: 18px;
  color: #BF6F00;
  text-align: center;
  margin-bottom: 15px;
}
.cover-page .word-pills {
  margin-top: 10px;
  display: flex; gap: 12px; justify-content: center;
  margin-bottom: 15px;
}
.cover-page .word-pill {
  background: #FFB347;
  color: white;
  padding: 6px 22px;
  border-radius: 30px;
  font-size: 20px;
  font-weight: bold;
}

/* Page title */
.page-title {
  color: #E8751A;
  font-size: 34px;
  text-align: center;
  margin-bottom: 15px;
  font-weight: bold;
}

.illustration {
  width: 180px; height: 180px; border-radius: 20px;
  background: linear-gradient(135deg, #FFE8C8 0%, #FFD4A8 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 80px; margin-bottom: 20px;
}
.sentence {
  font-size: 28px; line-height: 1.6; text-align: center;
  padding: 15px 20px; background: #FFF8E7; border-radius: 16px;
  width: 100%; margin-bottom: 15px;
  border: 2px solid #FFE0B2;
}
.sentence .highlight { color: #E8751A; font-weight: bold; }

/* Quiz / Game area */
.game-area {
  width: 100%; margin-top: 10px; padding: 18px;
  background: #F3E5F5; border-radius: 16px; text-align: center;
}
.game-area h3 { font-size: 16px; color: #7B1FA2; margin-bottom: 10px; }
.word-choices { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.word-choice {
  padding: 10px 24px; border-radius: 16px; border: 2px solid #ddd;
  background: white; font-size: 22px; font-weight: bold; cursor: pointer;
  transition: all 0.15s;
}
.word-choice:hover { border-color: #FFB347; background: #FFF8E7; }
.word-choice.correct {
  border-color: #4caf50; background: #e8f5e9;
  animation: bounce 0.4s ease;
}
.word-choice.wrong {
  border-color: #f44336; background: #ffebee; animation: shake 0.3s;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
@keyframes bounce {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* Nav controls */
.controls {
  display: flex; gap: 10px; justify-content: center; align-items: center;
  margin-top: 18px; flex-wrap: wrap;
}
.btn {
  border: none; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  font-family: inherit;
}
.btn:hover { transform: scale(1.08); box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
.btn:active { transform: scale(0.92); }
.btn-nav {
  width: 50px; height: 50px; border-radius: 50%;
  background: #FFB347; color: white;
  font-size: 24px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(255,179,71,0.3);
}
.btn-nav:disabled {
  opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none;
}
.btn-read {
  background: #6BCB77; color: white;
  padding: 10px 22px; border-radius: 30px;
  font-size: 16px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  box-shadow: 0 3px 10px rgba(107,203,119,0.3);
}

/* Progress dots */
.progress {
  display: flex; gap: 8px; justify-content: center; align-items: center;
}
.dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: #ddd; cursor: pointer; transition: all 0.2s;
}
.dot.active { background: #FFB347; transform: scale(1.4); }
.dot.done { background: #6BCB77; }

/* Page counter */
.page-counter {
  font-size: 14px; color: #BF6F00; text-align: center; margin-top: 12px;
  font-weight: 600;
}

/* Confetti celebration */
.celebration {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 999;
}
.confetti-piece {
  position: absolute;
  animation: confettiFall var(--fall-duration, 2.5s) ease-out forwards;
  animation-delay: var(--delay, 0s);
}
@keyframes confettiFall {
  0% {
    opacity: 1;
    transform: translateY(0) rotate(0deg) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(550px) rotate(720deg) scale(0.3);
  }
}

/* Completed game style */
.game-done {
  background: #e8f5e9 !important;
}
.game-done h3 { color: #2e7d32 !important; }
</style>
</head>
<body>

<div class="book">
  <div class="page-area" id="pageArea"></div>
  <div class="controls">
    <button class="btn btn-nav" id="prevBtn" onclick="prevPage()">◀</button>
    <button class="btn btn-read" onclick="speakPage()">🔊读给我听</button>
    <div class="progress" id="progress"></div>
    <button class="btn btn-nav" id="nextBtn" onclick="nextPage()">▶</button>
  </div>
  <div class="page-counter" id="pageCounter">第1页 / 共8页</div>
</div>

<script>
const pages = [
  {
    id: 'page-0',
    title: '📖 Can We Get a Pet?',
    emoji: '🏠',
    sentence: '"<span class="highlight">Can we</span> get a pet?"',
    game: { word: 'we', options: ['we', 'he', 'she', 'me'] },
    cover: true
  },
  {
    id: 'page-1',
    title: '🐶 A Dog',
    emoji: '🐶',
    sentence: '"<span class="highlight">Can we</span> get a dog?" said the kids.',
    game: { word: 'can', options: ['can', 'cat', 'and', 'man'] }
  },
  {
    id: 'page-2',
    title: '🐱 A Cat',
    emoji: '🐱',
    sentence: '"<span class="highlight">Can we</span> get a cat?" said the kids.',
    game: { word: 'we', options: ['we', 'me', 'he', 'see'] }
  },
  {
    id: 'page-3',
    title: '🐰 A Bunny',
    emoji: '🐰',
    sentence: '"<span class="highlight">Can we</span> get a bunny?" said the kids.',
    game: { word: 'can', options: ['can', 'car', 'cap', 'cup'] }
  },
  {
    id: 'page-4',
    title: '🐹 A Hamster',
    emoji: '🐹',
    sentence: '"<span class="highlight">Can we</span> get a hamster?" said the kids.',
    game: { word: 'we', options: ['we', 'be', 'me', 'he'] }
  },
  {
    id: 'page-5',
    title: '🐟 A Fish',
    emoji: '🐟',
    sentence: '"<span class="highlight">Can we</span> get a fish?" said the kids.',
    game: { word: 'can', options: ['can', 'cake', 'came', 'cane'] }
  },
  {
    id: 'page-6',
    title: '🐢 A Turtle',
    emoji: '🐢',
    sentence: '"<span class="highlight">Can we</span> get a turtle?" said the kids.',
    game: { word: 'we', options: ['we', 'she', 'he', 'it'] }
  },
  {
    id: 'page-7',
    title: '🎉 Happy Ending',
    emoji: '😊',
    sentence: '"Yes! <span class="highlight">We can</span> get a pet!" said Mom and Dad.',
    game: null
  }
];

let currentPage = 0;
let gameDone = new Array(pages.length).fill(false);

function renderPage(idx) {
  const area = document.getElementById('pageArea');
  const p = pages[idx];

  let extraClasses = p.cover ? 'cover-page' : '';
  let content = '';

  if (p.cover) {
    // Cover page layout
    content = `
      <div class="page active ${extraClasses}" id="${p.id}">
        <div class="page-title">${p.title}</div>
        <div class="cover-emoji">${p.emoji}</div>
        <div class="cover-tagline">Sight Word Tales · Book 1</div>
        <div class="word-pills">
          <span class="word-pill">can</span>
          <span class="word-pill">we</span>
        </div>
        <div class="sentence">${p.sentence}</div>
        ${p.game ? renderGame(idx, p.game) : ''}
      </div>
    `;
  } else {
    // Story page layout
    let gameHtml = '';
    if (p.game) {
      gameHtml = renderGame(idx, p.game);
    } else {
      gameHtml = '<div class="game-area game-done"><h3>🎉 Story Complete!</h3><p style="color:#2e7d32;font-size:40px;margin-top:8px">★ ★ ★</p><p style="color:#555;font-size:16px">You read the whole story!</p></div>';
    }
    content = `
      <div class="page active ${extraClasses}" id="${p.id}">
        <div class="page-title">${p.title}</div>
        <div class="illustration">${p.emoji}</div>
        <div class="sentence">${p.sentence}</div>
        ${gameHtml}
      </div>
    `;
  }

  area.innerHTML = content;
  updateUI(idx);
  document.getElementById('prevBtn').disabled = idx === 0;
}

function renderGame(idx, game) {
  if (gameDone[idx]) {
    return `<div class="game-area game-done"><h3>✅ Great job!</h3><p style="color:#2e7d32;font-size:30px;margin-top:4px">★</p></div>`;
  }
  return `
    <div class="game-area" id="game-${idx}">
      <h3>🔍 Find the word: "<strong>${game.word}</strong>"</h3>
      <div class="word-choices">
        ${game.options.map((w, i) =>
          `<div class="word-choice" onclick="checkWord(${idx}, '${game.word}', '${w}', this)">${w}</div>`
        ).join('')}
      </div>
    </div>
  `;
}

function checkWord(idx, target, chosen, el) {
  if (gameDone[idx]) return;
  if (chosen === target) {
    el.classList.add('correct');
    gameDone[idx] = true;
    launchConfetti();
    setTimeout(() => { renderPage(idx); }, 700);
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 500);
  }
}

function launchConfetti() {
  const div = document.createElement('div');
  div.className = 'celebration';
  const colors = ['#FF6B6B','#FECA57','#48DBFB','#FF9FF3','#54A0FF','#FFB347','#6BCB77','#E8751A'];
  const shapes = ['circle','rect'];
  for (let i = 0; i < 45; i++) {
    const piece = document.createElement('div');
    const color = colors[Math.floor(Math.random() * colors.length)];
    const shape = shapes[Math.floor(Math.random() * shapes.length)];
    const size = 6 + Math.random() * 10;
    const isRect = shape === 'rect';

    piece.className = 'confetti-piece';
    piece.style.left = (5 + Math.random() * 90) + '%';
    piece.style.top = (10 + Math.random() * 20) + '%';
    piece.style.background = color;
    piece.style.width = isRect ? (size * 0.5) + 'px' : size + 'px';
    piece.style.height = isRect ? (size * 1.6) + 'px' : size + 'px';
    piece.style.borderRadius = isRect ? '2px' : '50%';
    piece.style.setProperty('--delay', (Math.random() * 0.8) + 's');
    piece.style.setProperty('--fall-duration', (1.8 + Math.random() * 1.2) + 's');
    piece.style.opacity = '0.8';

    div.appendChild(piece);
  }
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3500);
}

function speakPage() {
  const p = pages[currentPage];
  const txt = p.sentence.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.1;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function nextPage() {
  if (!gameDone[currentPage] && pages[currentPage].game) return;
  if (currentPage < pages.length - 1) { currentPage++; renderPage(currentPage); }
}

function prevPage() {
  if (currentPage > 0) { currentPage--; renderPage(currentPage); }
}

function updateUI(idx) {
  document.getElementById('pageCounter').textContent = `第${idx+1}页 / 共${pages.length}页`;
  const dots = document.getElementById('progress');
  dots.innerHTML = pages.map((_, i) =>
    `<div class="dot ${i === idx ? 'active' : ''} ${gameDone[i] ? 'done' : ''}" onclick="currentPage=${i};renderPage(${i})"></div>`
  ).join('');
}

renderPage(0);
</script>
</body>
</html>
