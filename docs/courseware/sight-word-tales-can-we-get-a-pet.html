<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sight Word Tales - Can We Get a Pet?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .book {
    max-width: 800px;
    width: 100%;
    background: white;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
    padding: 0;
  }
  .header {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    padding: 20px 30px;
    text-align: center;
  }
  .header h1 { font-size: 22px; margin-bottom: 4px; }
  .header .sub { font-size: 13px; opacity: 0.9; }
  .header .words {
    margin-top: 10px; display: flex; gap: 10px; justify-content: center;
  }
  .word-tag {
    background: rgba(255,255,255,0.25);
    padding: 4px 16px; border-radius: 20px; font-size: 18px; font-weight: bold;
  }
  .page-area { padding: 30px; min-height: 350px; }
  .page {
    display: none; flex-direction: column; align-items: center;
    animation: fadeIn 0.4s ease;
  }
  .page.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .illustration {
    width: 180px; height: 180px; border-radius: 20px;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 80px; margin-bottom: 20px;
  }
  .sentence {
    font-size: 28px; line-height: 1.6; text-align: center;
    padding: 15px 20px; background: #f8f9ff; border-radius: 16px;
    width: 100%; margin-bottom: 15px;
  }
  .sentence .highlight { color: #f5576c; font-weight: bold; }
  .controls {
    display: flex; gap: 12px; justify-content: center; align-items: center;
    margin-top: 10px;
  }
  .btn {
    padding: 12px 28px; border: none; border-radius: 30px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  .btn:active { transform: scale(0.95); }
  .btn-primary { background: #667eea; color: white; }
  .btn-sound { background: #f093fb; color: white; width: 50px; height: 50px; border-radius: 50%; font-size: 22px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .btn-prev, .btn-next { background: #eee; color: #333; }
  .btn-prev:disabled, .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
  .page-counter { font-size: 14px; color: #999; text-align: center; margin-top: 10px; }
  .game-area {
    width: 100%; margin-top: 15px; padding: 15px;
    background: #fff3e0; border-radius: 16px; text-align: center;
  }
  .game-area h3 { font-size: 14px; color: #e65100; margin-bottom: 8px; }
  .word-choices { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .word-choice {
    padding: 8px 20px; border-radius: 12px; border: 2px solid #ddd;
    background: white; font-size: 20px; font-weight: bold; cursor: pointer;
    transition: all 0.15s;
  }
  .word-choice:hover { border-color: #667eea; background: #eef; }
  .word-choice.correct { border-color: #4caf50; background: #e8f5e9; }
  .word-choice.wrong { border-color: #f44336; background: #ffebee; animation: shake 0.3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .progress { display: flex; gap: 6px; justify-content: center; padding: 0 30px 20px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #ddd; cursor: pointer; transition: all 0.2s; }
  .dot.active { background: #667eea; transform: scale(1.3); }
  .dot.done { background: #4caf50; }
  .star { color: #ffc107; font-size: 24px; }
  .celebration {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
  }
  .confetti { position: absolute; width: 10px; height: 10px; border-radius: 50%; animation: confettiFall 2s ease-out forwards; }
  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(500px) rotate(720deg); }
  }
</style>
</head>
<body>
<div class="book">
  <div class="header">
    <h1>📖 Can <span style="color:#ffeb3b">We</span> Get a Pet?</h1>
    <div class="sub">Sight Word Tales · Book 1</div>
    <div class="words">
      <span class="word-tag">can</span>
      <span class="word-tag">we</span>
    </div>
  </div>

  <div class="page-area" id="pageArea"></div>

  <div class="controls">
    <button class="btn btn-prev" id="prevBtn" onclick="prevPage()">⬅</button>
    <button class="btn btn-sound" onclick="speakPage()">🔊</button>
    <button class="btn btn-primary" id="nextBtn" onclick="nextPage()">Next ➡</button>
  </div>
  <div class="page-counter" id="pageCounter">Page 1 / 8</div>
  <div class="progress" id="progress"></div>
</div>

<script>
const pages = [
  {
    emoji: "🏠", sentence: '"<span class="highlight">Can we</span> get a pet?"',
    game: { word: "we", options: ["we", "he", "she", "me"] }
  },
  {
    emoji: "🐶", sentence: '"<span class="highlight">Can we</span> get a dog?" said the kids.',
    game: { word: "can", options: ["can", "cat", "and", "man"] }
  },
  {
    emoji: "🐱", sentence: '"<span class="highlight">Can we</span> get a cat?" said the kids.',
    game: { word: "we", options: ["we", "me", "he", "see"] }
  },
  {
    emoji: "🐰", sentence: '"<span class="highlight">Can we</span> get a bunny?" said the kids.',
    game: { word: "can", options: ["can", "car", "cap", "cup"] }
  },
  {
    emoji: "🐹", sentence: '"<span class="highlight">Can we</span> get a hamster?" said the kids.',
    game: { word: "we", options: ["we", "be", "me", "he"] }
  },
  {
    emoji: "🐟", sentence: '"<span class="highlight">Can we</span> get a fish?" said the kids.',
    game: { word: "can", options: ["can", "cake", "came", "cane"] }
  },
  {
    emoji: "🐢", sentence: '"<span class="highlight">Can we</span> get a turtle?" said the kids.',
    game: { word: "we", options: ["we", "she", "he", "it"] }
  },
  {
    emoji: "😊", sentence: '"Yes! <span class="highlight">We can</span> get a pet!" said Mom and Dad.',
    game: null
  }
];

let currentPage = 0;
let gameDone = new Array(pages.length).fill(false);

function renderPage(idx) {
  const area = document.getElementById('pageArea');
  const p = pages[idx];
  area.innerHTML = `
    <div class="page active">
      <div class="illustration">${p.emoji}</div>
      <div class="sentence">${p.sentence}</div>
      ${p.game ? renderGame(idx, p.game) : '<div class="game-area" style="background:#e8f5e9"><h3>🎉 Story Complete!</h3><p style="color:#4caf50;font-size:40px">★ ★ ★</p></div>'}
    </div>
  `;
  updateUI(idx);
  document.getElementById('prevBtn').disabled = idx === 0;
  if (idx === 0) document.getElementById('prevBtn').style.opacity = '0.4';
  else document.getElementById('prevBtn').style.opacity = '1';
}

function renderGame(idx, game) {
  if (gameDone[idx]) {
    return `<div class="game-area" style="background:#e8f5e9"><h3>✅ Great job!</h3><p style="color:#4caf50;font-size:30px">★</p></div>`;
  }
  return `
    <div class="game-area" id="game-${idx}">
      <h3>🔍 Find the word: <strong>"${game.word}"</strong></h3>
      <div class="word-choices">
        ${game.options.map((w, i) => `<div class="word-choice" onclick="checkWord(${idx}, '${game.word}', '${w}', this)">${w}</div>`).join('')}
      </div>
    </div>
  `;
}

function checkWord(idx, target, chosen, el) {
  if (gameDone[idx]) return;
  if (chosen === target) {
    el.classList.add('correct');
    gameDone[idx] = true;
    setTimeout(() => { renderPage(idx); }, 600);
    if (idx === currentPage) celebrate();
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 500);
  }
}

function speakPage() {
  const p = pages[currentPage];
  const txt = p.sentence.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.1;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function nextPage() {
  if (!gameDone[currentPage] && pages[currentPage].game) return;
  if (currentPage < pages.length - 1) { currentPage++; renderPage(currentPage); }
}

function prevPage() {
  if (currentPage > 0) { currentPage--; renderPage(currentPage); }
}

function celebrate() {
  const div = document.createElement('div');
  div.className = 'celebration';
  const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff'];
  for (let i = 0; i < 30; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.top = '20%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    div.appendChild(c);
  }
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 2500);
}

function updateUI(idx) {
  document.getElementById('pageCounter').textContent = `Page ${idx+1} / ${pages.length}`;
  const dots = document.getElementById('progress');
  dots.innerHTML = pages.map((_, i) =>
    `<div class="dot ${i === idx ? 'active' : ''} ${gameDone[i] ? 'done' : ''}" onclick="currentPage=${i};renderPage(${i})"></div>`
  ).join('');
}

renderPage(0);
</script>
</body>
</html>
