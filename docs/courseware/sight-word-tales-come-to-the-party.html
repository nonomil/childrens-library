<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 Sight Word Tales - Come to the Party!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    background: linear-gradient(145deg,#FFF8E7 0%,#FFE8C8 100%);
    min-height: 100vh; display: flex; justify-content: center;
    align-items: center; padding: 20px;
  }
  .book {
    max-width: 800px; width: 100%; background: #FFFCF5;
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15),0 0 0 4px #FFF,0 0 0 8px #FFB347;
    padding: 24px 20px;
    position: relative;
  }
  .page-area { min-height: 360px; }
  .page {
    display: none; flex-direction: column; align-items: center;
    animation: fadeIn 0.4s ease;
  }
  .page.active { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .page-title {
    font-size: 34px;
    color: #E8751A;
    text-align: center;
    margin-bottom: 16px;
    font-weight: bold;
  }
  .page-subtitle {
    font-size: 16px;
    color: #B07D44;
    text-align: center;
    margin-bottom: 10px;
  }

  .illustration {
    width: 200px; height: 180px; border-radius: 24px;
    background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B2 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 80px; margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(255,179,71,0.2);
  }
  .sentence {
    font-size: 26px; line-height: 1.6; text-align: center;
    padding: 15px 20px; background: #FFF8F0; border-radius: 20px;
    width: 100%; margin-bottom: 10px;
    border: 2px solid #FFE0B2;
  }
  .sentence .highlight { color: #E8751A; font-weight: bold; text-decoration: underline; text-decoration-color: #FFB347; text-underline-offset: 4px; }

  /* Quiz/Game area - gears style */
  .game-area {
    width: 100%; padding: 16px; background: #F3E5F5;
    border-radius: 20px; text-align: center; margin-top: 8px;
  }
  .game-area h3 {
    font-size: 16px; color: #7B1FA2; margin-bottom: 10px;
  }
  .word-choices { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .word-choice {
    padding: 10px 24px; border-radius: 16px; border: 3px solid #ddd;
    background: white; font-size: 22px; font-weight: bold; cursor: pointer;
    transition: all 0.2s;
  }
  .word-choice:hover { border-color: #FFB347; transform: scale(1.08); }
  .word-choice.correct { border-color: #4caf50; background: #e8f5e9; transform: scale(1.05); }
  .word-choice.wrong { border-color: #f44336; background: #ffebee; animation: shake 0.4s; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  /* Controls - gears nav style */
  .controls {
    display: flex; gap: 12px; justify-content: center; align-items: center;
    padding: 16px 0 8px;
  }
  .btn {
    border: none; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    font-weight: 600;
  }
  .btn:hover { transform: scale(1.08); }
  .btn:active { transform: scale(0.92); }

  .btn-nav {
    width: 50px; height: 50px; border-radius: 50%;
    background: #FFB347; color: white; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(255,179,71,0.5);
  }
  .btn-nav:disabled {
    opacity: 0.35; cursor: not-allowed; box-shadow: none;
  }
  .btn-nav:disabled:hover { transform: none; }

  .btn-sound {
    padding: 10px 24px; border-radius: 30px;
    background: #6BCB77; color: white; font-size: 16px;
    box-shadow: 0 4px 15px rgba(107,203,119,0.5);
    display: flex; align-items: center; gap: 6px;
  }

  .page-counter {
    font-size: 14px; color: #B07D44;
    text-align: center; font-weight: bold;
  }

  .progress { display: flex; gap: 8px; justify-content: center; padding: 4px 0 0; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #E0D5C7; cursor: pointer;
    transition: all 0.25s;
  }
  .dot.active { background: #FFB347; transform: scale(1.3); box-shadow: 0 0 8px rgba(255,179,71,0.5); }
  .dot.done { background: #6BCB77; }

  /* Cover page */
  .cover-page { text-align: center; padding: 30px 10px; }
  .cover-page .big-icon {
    font-size: 120px; margin-bottom: 20px;
    display: inline-block;
    animation: float 3s ease-in-out infinite;
  }
  .cover-page h2 { font-size: 34px; color: #E8751A; }
  .cover-page p { font-size: 16px; color: #B07D44; margin-top: 8px; }

  /* Animations */
  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    40% { transform: translateY(-20px); }
    60% { transform: translateY(-8px); }
  }
  @keyframes confetti-fall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(600px) rotate(720deg) scale(0.3); }
  }

  .celebration {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
  }
  .confetti {
    position: absolute; width: 12px; height: 12px; border-radius: 2px;
    animation: confetti-fall 2.5s ease-out forwards;
  }

  .star { color: #FFB347; font-size: 28px; }

  .completed-badge {
    background: #E8F5E9; padding: 10px; border-radius: 16px;
    margin-top: 4px;
  }
  .completed-badge h3 { color: #2E7D32 !important; font-size: 18px !important; }
  .completed-badge p { font-size: 30px; }

  @media (max-width: 500px) {
    .illustration { width: 150px; height: 140px; font-size: 60px; }
    .sentence { font-size: 20px; }
    .page-title { font-size: 26px; }
    .cover-page .big-icon { font-size: 90px; }
  }
</style>
</head>
<body>
<div class="book">
  <div class="page-area" id="pageArea"></div>

  <div class="controls">
    <button class="btn btn-nav" id="prevBtn" onclick="prevPage()">◀</button>
    <button class="btn btn-sound" onclick="speakPage()">🔊读给我听</button>
    <button class="btn btn-nav" id="nextBtn" onclick="nextPage()">▶</button>
  </div>
  <div class="page-counter" id="pageCounter">第1页 / 共9页</div>
  <div class="progress" id="progress"></div>
</div>

<script>
const pages = [
  {
    cover: true, icon: '🎉', title: 'Come to the Party!',
    subtitle: 'Sight Words: "come" & "to"'
  },
  {
    id: 'page-0', emoji: '🎈',
    sentence: '"<span class="highlight">Come</span> <span class="highlight">to</span> my party!" said the girl.',
    game: { word: 'come', options: ['come', 'came', 'some', 'home'] }
  },
  {
    id: 'page-1', emoji: '🐶',
    sentence: '"I will <span class="highlight">come</span> <span class="highlight">to</span> the party!" said the dog.',
    game: { word: 'to', options: ['to', 'too', 'two', 'do'] }
  },
  {
    id: 'page-2', emoji: '🐱',
    sentence: '"I will <span class="highlight">come</span> <span class="highlight">to</span> the party!" said the cat.',
    game: { word: 'come', options: ['come', 'came', 'some', 'home'] }
  },
  {
    id: 'page-3', emoji: '🐰',
    sentence: '"We will all <span class="highlight">come</span> <span class="highlight">to</span> the party!" said the bunny.',
    game: { word: 'to', options: ['to', 'too', 'two', 'into'] }
  },
  {
    id: 'page-4', emoji: '🐻',
    sentence: '"I <span class="highlight">come</span> <span class="highlight">to</span> the party with a bear hug!" said the bear.',
    game: { word: 'come', options: ['come', 'came', 'some', 'home'] }
  },
  {
    id: 'page-5', emoji: '🎊',
    sentence: 'Everyone says: "We <span class="highlight">come</span> <span class="highlight">to</span> have fun! Hooray!"',
    game: { word: 'to', options: ['to', 'too', 'two', 'for'] }
  },
  {
    id: 'page-6', emoji: '🎉',
    sentence: '"Thank you for coming <span class="highlight">to</span> my party! <span class="highlight">Come</span> again!" said the girl.',
    game: null
  }
];

let currentPage = 0;
let gameDone = new Array(pages.length).fill(false);

function renderPage(idx) {
  const area = document.getElementById('pageArea');
  const p = pages[idx];

  if (p.cover) {
    area.innerHTML = `
      <div class="page active cover-page" id="page-cover">
        <div class="big-icon">${p.icon}</div>
        <h2>${p.title}</h2>
        <p>${p.subtitle}</p>
        <p style="margin-top:20px;font-size:14px;color:#B07D44">👆 点击 ▶ 开始阅读！</p>
      </div>
    `;
    updateUI(idx);
    document.getElementById('prevBtn').disabled = true;
    return;
  }

  const isDone = !p.game || gameDone[idx];
  let gameHTML = '';
  if (p.game && !gameDone[idx]) {
    gameHTML = `
      <div class="game-area" id="game-${idx}">
        <h3>🔍 找出单词: <strong>"${p.game.word}"</strong></h3>
        <div class="word-choices">
          ${p.game.options.map((w, i) => `<div class="word-choice" onclick="checkWord(${idx}, '${p.game.word}', '${w}', this)">${w}</div>`).join('')}
        </div>
      </div>
    `;
  } else if (isDone && p.game) {
    gameHTML = `<div class="game-area completed-badge"><h3>✅ 太棒了！</h3><p>⭐</p></div>`;
  } else {
    gameHTML = `<div class="game-area" style="background:#FFF3E0"><h3 style="color:#E8751A">🎉 派对完成！🎊</h3><p style="font-size:36px">⭐ ⭐ ⭐</p></div>`;
  }

  area.innerHTML = `
    <div class="page active" id="${p.id || 'page-' + idx}">
      <div class="illustration">${p.emoji}</div>
      <div class="sentence">${p.sentence}</div>
      ${gameHTML}
    </div>
  `;
  updateUI(idx);
  document.getElementById('prevBtn').disabled = idx === 0;
}

function checkWord(idx, target, chosen, el) {
  if (gameDone[idx]) return;
  if (chosen === target) {
    el.classList.add('correct');
    gameDone[idx] = true;
    launchConfetti();
    setTimeout(() => { renderPage(idx); }, 700);
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 500);
  }
}

function speakPage() {
  const p = pages[currentPage];
  if (p.cover) {
    speakText('Come to the Party! Sight words come and to.');
  } else {
    const txt = p.sentence.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');
    speakText(txt);
  }
}

function speakText(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.1;
  window.speechSynthesis.speak(u);
}

function nextPage() {
  if (!gameDone[currentPage] && pages[currentPage].game) return;
  if (currentPage < pages.length - 1) { currentPage++; renderPage(currentPage); }
}

function prevPage() {
  if (currentPage > 0) { currentPage--; renderPage(currentPage); }
}

function launchConfetti() {
  const div = document.createElement('div');
  div.className = 'celebration';
  const colors = ['#FFB347','#6BCB77','#7B1FA2','#E8751A','#F3E5F5','#FF6B6B','#48DBFB'];
  const shapes = ['circle','square','triangle'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.top = '-10%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (6 + Math.random() * 10) + 'px';
    c.style.height = (6 + Math.random() * 10) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.animationDelay = Math.random() * 1.2 + 's';
    c.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
    div.appendChild(c);
  }
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

function updateUI(idx) {
  document.getElementById('pageCounter').textContent = `第${idx+1}页 / 共${pages.length}页`;
  const dots = document.getElementById('progress');
  dots.innerHTML = pages.map((_, i) =>
    `<div class="dot ${i === idx ? 'active' : ''} ${gameDone[i] || i === 0 ? 'done' : ''}" onclick="currentPage=${i};renderPage(${i})"></div>`
  ).join('');
}

renderPage(0);
</script>
</body>
</html>
