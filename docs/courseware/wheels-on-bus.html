<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚌 The Wheels on the Bus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
body {
  font-family:'Fredoka One','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(145deg,#FFF8E7 0%,#FFE8C8 100%);
  min-height:100vh; display:flex; justify-content:center; align-items:center; padding:12px;
}
.book {
  width:100%; max-width:840px; min-height:92vh;
  background:#FFFCF5; border-radius:40px;
  box-shadow:0 20px 60px rgba(0,0,0,0.15),0 0 0 4px #FFF,0 0 0 8px #FFB347;
  padding:24px 20px; position:relative;
  font-family:'Fredoka One','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
.page-area { min-height:420px; }
.page { display:none; flex-direction:column; align-items:center; animation:fadeIn .4s ease; width:100%; }
.page.active { display:flex; }
@keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes noteFloat { 0%{opacity:0;transform:translateY(20px) scale(0.5)} 30%{opacity:1;transform:translateY(-10px) scale(1.2)} 100%{opacity:0;transform:translateY(-60px) scale(0.8)} }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
@keyframes popIn { 0%{opacity:0;transform:scale(0.3)} 100%{opacity:1;transform:scale(1)} }
@keyframes confetti-fall { 0%{opacity:1;transform:translateY(0)rotate(0deg)} 100%{opacity:0;transform:translateY(500px)rotate(720deg)} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes busBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
@keyframes wheelSpin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
@keyframes upDown { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
@keyframes swishAnim { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-20deg)} }
@keyframes beepPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
@keyframes doorShut { 0%{transform:scaleX(1)} 50%{transform:scaleX(0.1)} 100%{transform:scaleX(1)} }

.page-title { font-size:30px; color:#E8751A; text-align:center; margin-bottom:8px; font-weight:bold; }
.page-desc { font-size:18px; color:#6B4F3A; text-align:center; line-height:1.5; margin-bottom:10px; }
.scene-wrap { width:100%; max-width:460px; height:auto; margin:0 auto 10px; border-radius:20px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.08); }
.scene-wrap svg { display:block; width:100%; height:auto; }
.lyrics { font-size:26px; color:#E8751A; text-align:center; padding:12px 16px; background:#FFF8E7; border-radius:16px; width:100%; margin-bottom:8px; line-height:1.5; font-weight:bold; }
.lyrics .hl { color:#F44336; cursor:pointer; transition:all .2s; display:inline-block; }
.lyrics .hl:active { transform:scale(1.2); }
.lyrics .hl::after { content:'🔊'; font-size:14px; opacity:0.5; margin-left:4px; }
.word-game { width:100%; padding:14px; background:#FFF8E7; border-radius:18px; text-align:center; margin:6px 0; border:2px solid #FFE8C8; }
.word-game h3 { font-size:16px; color:#E8751A; margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:6px; }
.word-slots { display:flex; gap:6px; justify-content:center; margin-bottom:8px; }
.word-slot { width:48px; height:48px; border-bottom:4px solid #FFB347; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:bold; color:#E8751A; border-radius:8px 8px 0 0; background:rgba(255,248,231,0.5); transition:all .2s; }
.word-slot.filled { border-bottom-color:#4CAF50; background:rgba(232,245,233,0.5); animation:popIn .2s ease; }
.word-slot.drag-over { border-bottom-color:#66BB6A; border-bottom-width:6px; background:rgba(102,187,106,0.15); transform:scale(1.05); }
.letter-tiles { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.letter-tile { width:48px; height:48px; border-radius:12px; border:3px solid #E0D5C7; background:white; font-size:24px; font-weight:bold; cursor:grab; display:flex; align-items:center; justify-content:center; transition:all .15s; user-select:none; touch-action:none; }
.letter-tile:hover { border-color:#FFB347; background:#FFF8E7; }
.letter-tile:active { cursor:grabbing; }
.letter-tile.correct { border-color:#4CAF50; background:#E8F5E9; animation:popIn .3s ease; }
.letter-tile.wrong { border-color:#F44336; background:#FFEBEE; animation:shake .3s; }
.letter-tile.used { opacity:0.35; pointer-events:none; }
.letter-tile.dragging { opacity:0.5; }

/* Controls */
.controls { display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:8px; position:sticky; bottom:0; background:#FFFCF5; padding:8px 0; z-index:100; }
.nav-btn { background:#FFB347; border:none; color:#FFF; font-size:28px; width:60px; height:60px; border-radius:50%; cursor:pointer; box-shadow:0 4px 12px rgba(255,179,71,0.4); transition:all .15s; display:flex; align-items:center; justify-content:center; flex-shrink:0; touch-action:manipulation; }
.nav-btn:hover { transform:scale(1.1); background:#FF9F1C; }
.nav-btn:disabled { opacity:0.3; cursor:default; transform:none; }
.nav-btn.small { width:48px; height:48px; font-size:22px; }
.read-btn { background:#6BCB77; border:none; color:#FFF; font-size:16px; padding:10px 18px; border-radius:30px; cursor:pointer; box-shadow:0 4px 12px rgba(107,203,119,0.4); font-family:inherit; font-weight:bold; display:flex; align-items:center; gap:5px; transition:all .15s; touch-action:manipulation; }
.read-btn:hover { transform:scale(1.06); }
.read-btn.pink { background:#FF8A80; }
.page-dots { display:flex; gap:6px; }
.page-dots .dot { width:10px; height:10px; border-radius:50%; background:#E0D5C7; cursor:pointer; transition:all .2s; }
.page-dots .dot.active { background:#FFB347; transform:scale(1.3); }
.page-dots .dot.done { background:#4CAF50; }
.page-counter { font-size:13px; color:#999; text-align:center; margin-top:6px; }

/* Speech bubble */
.speech-bubble { position:fixed; bottom:120px; left:50%; transform:translateX(-50%) scale(0.5); border-radius:20px; background:rgba(255,255,255,0.96); border:3px solid #FFB347; padding:14px 22px; font-size:20px; font-weight:600; max-width:80%; text-align:center; z-index:10000; opacity:0; pointer-events:none; box-shadow:0 8px 30px rgba(255,179,71,0.3); transition:opacity .35s,transform .35s cubic-bezier(0.34,1.56,0.64,1); color:#5A3E2B; line-height:1.5; }
.speech-bubble.show { opacity:1; transform:translateX(-50%) scale(1); }
.speech-bubble::before { content:'🔊'; display:block; font-size:22px; margin-bottom:4px; }

/* Celebration */
.celebration { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; }
.cover-page { text-align:center; padding:20px 10px; }
.big-start-btn { width:120px; height:120px; border-radius:50%; background:linear-gradient(145deg,#FFB347,#FF9F1C); border:6px solid #FFF; color:#FFF; font-size:32px; cursor:pointer; box-shadow:0 8px 30px rgba(255,179,71,0.5); transition:all .15s; margin:10px auto; display:flex; align-items:center; justify-content:center; animation:bounce 2s ease-in-out infinite; }
.big-start-btn:active { transform:scale(0.95); }

/* Final page */
.final-grid { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
.final-bus-item { width:80px; text-align:center; padding:8px; border-radius:16px; background:#FFF8E7; border:2px solid #FFE8C8; }
.final-bus-item .label { font-size:14px; color:#6B4F3A; font-weight:bold; margin-top:4px; }
.home-link { color:#FFB347; text-decoration:none; font-size:18px; font-weight:bold; margin-top:10px; display:inline-block; }
.home-link:hover { text-decoration:underline; }
.cover-svg { width:100%; max-width:400px; margin:0 auto; }

@media (max-width:500px) {
  .book { padding:16px 12px; }
  .page-title { font-size:24px; }
  .lyrics { font-size:20px; padding:10px 12px; }
  .letter-tile { width:40px; height:40px; font-size:20px; }
  .word-slot { width:40px; height:40px; font-size:22px; }
  .nav-btn { width:50px; height:50px; font-size:24px; }
  .nav-btn.small { width:40px; height:40px; font-size:18px; }
  .read-btn { font-size:14px; padding:8px 14px; }
  .big-start-btn { width:90px; height:90px; font-size:26px; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div class="book">
  <div class="page-area" id="pageArea"></div>
  <div class="controls" id="controlsBar">
    <button class="nav-btn" id="prevBtn" onclick="prevPage()" disabled>◀</button>
    <button class="nav-btn small" onclick="playSong();showMusicNotes()" style="animation:float 2s ease-in-out infinite">🎵</button>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
      <button class="read-btn" onclick="speakPage()">🔊 读</button>
      <button class="read-btn pink" onclick="playSong();showMusicNotes()">🎵 唱</button>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="nextPage()">▶</button>
  </div>
  <div class="page-dots" id="progressDots"></div>
  <div class="page-counter" id="pageCounter">第1页 / 共7页</div>
</div>
<div class="speech-bubble" id="speechBubble"></div>

<script>
// ====== PAGE DATA ======
const pages = [
  { cover:true, title:'The Wheels on the Bus', subtitle:'🚌 一首好听的英文公车儿歌！' },
  { sentence:'The <span class="hl" data-word="wheels">wheels</span> on the bus go <span class="hl">round and round</span>!', game:'wheels', svg:'wheels' },
  { sentence:'The <span class="hl" data-word="people">people</span> on the bus go <span class="hl">up and down</span>!', game:'people', svg:'people' },
  { sentence:'The <span class="hl" data-word="wipers">wipers</span> on the bus go <span class="hl">swish swish swish</span>!', game:'wipers', svg:'wipers' },
  { sentence:'The <span class="hl" data-word="horn">horn</span> on the bus goes <span class="hl">beep beep beep</span>!', game:'horn', svg:'horn' },
  { sentence:'The <span class="hl" data-word="door">door</span> on the bus goes <span class="hl">open and shut</span>!', game:'door', svg:'door' },
  { final:true, title:'🚌 公车小明星！' }
];

let currentPage = 0;
let gameDone = new Array(pages.length).fill(false);
let buildingWord = [];
let dragData = null;

// ====== WEB AUDIO API ======
const NOTE = {
  C4:261.63, D4:293.66, E4:329.63, F4:349.23,
  G4:392.00, A4:440.00, B4:493.88, C5:523.25
};
function playMelody(notes) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let t = ctx.currentTime;
  notes.forEach(function(n) {
    const [freq, dur] = n;
    if(freq > 0) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'triangle';
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.start(t); osc.stop(t + dur);
      t += dur + 0.05;
    }
  });
}
// Wheels on the Bus melody (simplified)
const WHEELS_MELODY = [
  [NOTE.G4,0.2],[NOTE.A4,0.2],[NOTE.B4,0.3],[NOTE.G4,0.3],
  [NOTE.G4,0.2],[NOTE.A4,0.2],[NOTE.B4,0.6],
  [NOTE.B4,0.2],[NOTE.C5,0.2],[NOTE.D5,0.3],[NOTE.B4,0.2],[NOTE.G4,0.2],
  [NOTE.A4,0.3],[NOTE.A4,0.3],[NOTE.G4,0.6]
];
// ===== PLAY FULL SONG MP3 =====
var songAudio = null;
function playSong() {
  if(songAudio) { songAudio.pause(); songAudio.currentTime = 0; }
  songAudio = new Audio('audio/wheels.mp3');
  songAudio.volume = 0.8;
  songAudio.play().catch(function(){});
}
// Sound effects
function playSound(freq, dur) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.frequency.value = freq;
  osc.type = 'square';
  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.start(); osc.stop(ctx.currentTime + dur);
}
function playSoundEffect(freqStart,freqEnd,dur) {
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') ctx.resume();
  const t=ctx.currentTime;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(freqStart,t); o.frequency.exponentialRampToValueAtTime(freqEnd,t+dur);
  g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.01,t+dur-0.05);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur);
}
function showMusicNotes() {
  const scene=document.querySelector('.scene-wrap'); if(!scene) return;
  const notes=['♪','♫','♩','♬'];
  for(let i=0;i<8;i++){const n=document.createElement('div');n.textContent=notes[i%notes.length];n.style.cssText='position:absolute;font-size:'+(14+Math.random()*18)+'px;color:#FFB347;opacity:0;pointer-events:none;z-index:10;left:'+(Math.random()*80+10)+'%;top:'+(Math.random()*50+10)+'%;animation:noteFloat '+(1+Math.random())+'s ease-out forwards;animation-delay:'+(i*0.15)+'s;';scene.appendChild(n);setTimeout(function(e){e.remove()},3000,n);}
}

function speakText(text) {
  if('speechSynthesis' in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,''));u.lang='en-US';u.rate=0.75;u.pitch=1.0;window.speechSynthesis.speak(u);}
}

function showBubble(text) {
  const b=document.getElementById('speechBubble');b.textContent=text;b.classList.add('show');
  clearTimeout(b._t);b._t=setTimeout(()=>{b.classList.remove('show')},3000);
}

// ====== SVG SCENES ======
function svgBusScene(scene) {
  // Base bus SVG that all pages build on
  let extra = '';
  let animClass = '';

  if(scene === 'wheels') {
    extra = `
      <!-- Wheels spinning -->
      <g>
        <circle cx="130" cy="195" r="22" fill="#333" stroke="#555" stroke-width="3"/>
        <circle cx="130" cy="195" r="18" fill="#444"/>
        <circle cx="130" cy="195" r="6" fill="#888"/>
        <line x1="130" y1="177" x2="130" y2="213" stroke="#666" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 130 195" to="360 130 195" dur="2s" repeatCount="indefinite"/></line>
        <line x1="112" y1="195" x2="148" y2="195" stroke="#666" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 130 195" to="360 130 195" dur="2s" repeatCount="indefinite"/></line>

        <circle cx="310" cy="195" r="22" fill="#333" stroke="#555" stroke-width="3"/>
        <circle cx="310" cy="195" r="18" fill="#444"/>
        <circle cx="310" cy="195" r="6" fill="#888"/>
        <line x1="310" y1="177" x2="310" y2="213" stroke="#666" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 310 195" to="360 310 195" dur="2s" repeatCount="indefinite"/></line>
        <line x1="292" y1="195" x2="328" y2="195" stroke="#666" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 310 195" to="360 310 195" dur="2s" repeatCount="indefinite"/></line>

        <text x="220" y="60" text-anchor="middle" font-size="18" fill="#E8751A" font-weight="bold">Round and round!</text>
      </g>`;
  } else if(scene === 'people') {
    extra = `
      <!-- People bouncing up and down -->
      <g>
        <!-- Person 1 -->
        <circle cx="180" cy="80" r="10" fill="#FFCC80"/>
        <rect x="175" y="90" width="10" height="16" rx="3" fill="#42A5F5">
          <animate attributeName="y" values="90;80;90" dur="1s" repeatCount="indefinite"/>
        </rect>
        <circle cx="180" cy="80" r="10" fill="#FFCC80">
          <animate attributeName="cy" values="80;70;80" dur="1s" repeatCount="indefinite"/>
        </circle>
        <line x1="175" y1="106" x2="170" y2="118" stroke="#FFCC80" stroke-width="3" stroke-linecap="round">
          <animate attributeName="y2" values="118;108;118" dur="1s" repeatCount="indefinite"/>
        </line>
        <line x1="185" y1="106" x2="190" y2="118" stroke="#FFCC80" stroke-width="3" stroke-linecap="round">
          <animate attributeName="y2" values="118;108;118" dur="1s" repeatCount="indefinite"/>
        </line>

        <!-- Person 2 -->
        <circle cx="250" cy="85" r="10" fill="#FFCC80"/>
        <rect x="245" y="95" width="10" height="16" rx="3" fill="#EF5350">
          <animate attributeName="y" values="95;85;95" dur="0.9s" repeatCount="indefinite"/>
        </rect>
        <circle cx="250" cy="85" r="10" fill="#FFCC80">
          <animate attributeName="cy" values="85;75;85" dur="0.9s" repeatCount="indefinite"/>
        </circle>
        <line x1="245" y1="111" x2="240" y2="123" stroke="#FFCC80" stroke-width="3" stroke-linecap="round">
          <animate attributeName="y2" values="123;113;123" dur="0.9s" repeatCount="indefinite"/>
        </line>
        <line x1="255" y1="111" x2="260" y2="123" stroke="#FFCC80" stroke-width="3" stroke-linecap="round">
          <animate attributeName="y2" values="123;113;123" dur="0.9s" repeatCount="indefinite"/>
        </line>

        <text x="220" y="60" text-anchor="middle" font-size="18" fill="#E8751A" font-weight="bold">Up and down!</text>
      </g>`;
  } else if(scene === 'wipers') {
    extra = `
      <g>
        <!-- Windshield wipers -->
        <line x1="135" y1="75" x2="170" y2="70" stroke="#333" stroke-width="3" stroke-linecap="round">
          <animate attributeName="x2" values="170;155;170" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="70;55;70" dur="1.5s" repeatCount="indefinite"/>
        </line>
        <line x1="160" y1="75" x2="195" y2="70" stroke="#333" stroke-width="3" stroke-linecap="round">
          <animate attributeName="x2" values="195;180;195" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="70;55;70" dur="1.5s" repeatCount="indefinite"/>
        </line>
        <!-- Rain drops -->
        <line x1="100" y1="20" x2="100" y2="30" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" opacity="0.6">
          <animate attributeName="y1" values="20;80;20" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="30;90;30" dur="1.2s" repeatCount="indefinite"/>
        </line>
        <line x1="120" y1="10" x2="120" y2="20" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" opacity="0.6">
          <animate attributeName="y1" values="10;70;10" dur="1s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="20;80;20" dur="1s" repeatCount="indefinite"/>
        </line>
        <line x1="80" y1="35" x2="80" y2="45" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" opacity="0.6">
          <animate attributeName="y1" values="35;95;35" dur="1.4s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="45;105;45" dur="1.4s" repeatCount="indefinite"/>
        </line>
        <text x="220" y="60" text-anchor="middle" font-size="18" fill="#E8751A" font-weight="bold">Swish swish swish!</text>
      </g>`;
  } else if(scene === 'horn') {
    extra = `
      <g>
        <!-- Horn sound waves -->
        <text x="340" y="100" font-size="28" fill="#FF9800" font-weight="bold">
          BEEP!
          <animate attributeName="font-size" values="28;36;28" dur="0.5s" repeatCount="indefinite"/>
        </text>
        <text x="345" y="80" font-size="18" fill="#FFB74D" font-weight="bold">
          BEEP!
          <animate attributeName="font-size" values="18;26;18" dur="0.5s" repeatCount="indefinite"/>
        </text>
        <text x="350" y="60" font-size="12" fill="#FFCC80" font-weight="bold">
          BEEP!
          <animate attributeName="font-size" values="12;18;12" dur="0.5s" repeatCount="indefinite"/>
        </text>
        <!-- Horn shape -->
        <path d="M335,110 L355,100 L355,120 Z" fill="#FF9800"/>
        <circle cx="350" cy="110" r="20" fill="none" stroke="#FF9800" stroke-width="2" opacity="0.5">
          <animate attributeName="r" values="20;40;20" dur="0.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;0;0.5" dur="0.8s" repeatCount="indefinite"/>
        </circle>
      </g>`;
  } else if(scene === 'door') {
    extra = `
      <g>
        <!-- Door opening and shutting -->
        <rect x="295" y="110" width="35" height="60" rx="2" fill="#5D4037">
          <animate attributeName="width" values="35;2;35" dur="2s" repeatCount="indefinite"/>
        </rect>
        <circle cx="325" cy="142" r="3" fill="#FFD54F">
          <animate attributeName="cx" values="325;297;325" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="220" y="60" text-anchor="middle" font-size="18" fill="#E8751A" font-weight="bold">Open and shut!</text>
      </g>`;
  }

function getSVG(idx) {
  if(idx===0) return svgCoverScene();
  const p=pages[idx];
  if(p.final) return svgFinalScene();
  const s=p.svg||'wheels';
  return svgBusScene(s);
}

// ====== GAME LOGIC ======
function startWordGame(idx,word) {
  if(gameDone[idx]) return '<div class="word-game" style="background:#E8F5E9"><h3>✅ 完成！</h3></div>';
  const letters=[...word].sort(()=>Math.random()-0.5);
  buildingWord=[];
  gameDone[idx]=false;
  return `<div class="word-game">
    <h3>⚙️ 拼单词: <strong>"${word}"</strong> 🔊</h3>
    <div class="word-slots" id="ws-${idx}" ondragover="onDragOver(event,${idx})" ondrop="onDrop(event,${idx})" ondragleave="onDragLeave(event,${idx})">
      ${word.split('').map((_,i)=>'<div class="word-slot" id="slot-'+idx+'-'+i+'"></div>').join('')}
    </div>
    <div class="letter-tiles">
      ${letters.map(l=>'<div class="letter-tile" draggable="true" ondragstart="onDragStart(event,'+idx+',\\''+l+'\\')" ondragend="onDragEnd(event)" onclick="pickLetter('+idx+',\\''+l+'\\',this)">'+l+'</div>').join('')}
    </div>
  </div>`;
}

function pickLetter(idx,letter,el) {
  if(gameDone[idx]||el.classList.contains('used')) return;
  const p=pages[idx]; const word=p.game; const slot=buildingWord.length;
  if(slot>=word.length) return;
  const slots=document.querySelectorAll('#ws-'+idx+' .word-slot');
  if(letter===word[slot]){
    buildingWord.push(letter); slots[slot].textContent=letter; slots[slot].classList.add('filled');
    el.classList.add('correct','used');
    if(buildingWord.length===word.length){gameDone[idx]=true;setTimeout(()=>{showBubble('Great! 🎉');launchConfetti();renderPage(idx);},500);}
  } else { el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),400); }
}

function onDragStart(e,idx,letter){dragData={idx,letter,el:e.target};e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function onDragEnd(e){e.target.classList.remove('dragging');document.querySelectorAll('.word-slot.drag-over').forEach(s=>s.classList.remove('drag-over'));}
function onDragOver(e,idx){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('#ws-'+idx+' .word-slot:not(.filled)').forEach(s=>s.classList.add('drag-over'));}
function onDragLeave(e,idx){document.querySelectorAll('#ws-'+idx+' .word-slot').forEach(s=>s.classList.remove('drag-over'));}
function onDrop(e,idx){
  e.preventDefault();document.querySelectorAll('#ws-'+idx+' .word-slot').forEach(s=>s.classList.remove('drag-over'));
  if(!dragData||dragData.idx!==idx||gameDone[idx]) return;
  pickLetter(idx,dragData.letter,dragData.el);dragData=null;
}

// ====== RENDER ======
function renderPage(idx) {
  const area=document.getElementById('pageArea');
  const p=pages[idx];

  if(p.cover){
    area.innerHTML=`<div class="page active cover-page">
      <div class="cover-svg">${getSVG(0)}</div>
      <div class="page-title">${p.title}</div>
      <div class="page-desc">${p.subtitle}</div>
      <div style="display:flex;gap:16px;justify-content:center;align-items:center;margin-top:4px">
        <button class="big-start-btn" onclick="playSong();showMusicNotes()" style="width:90px;height:90px;font-size:28px;animation:float 2s ease-in-out infinite">🎵</button>
        <button class="big-start-btn" onclick="nextPage()">▶</button>
      </div>
    </div>`;
    updateUI(idx); return;
  }

  if(p.final){
    area.innerHTML=`<div class="page active">
      <div class="page-title">${p.title}</div>
      <div class="scene-wrap" style="position:relative">${getSVG(idx)}</div>
      <div class="final-grid">
        <div class="final-bus-item">🚌<div class="label">Wheels 🛞</div></div>
        <div class="final-bus-item">🧑<div class="label">People 🚶</div></div>
        <div class="final-bus-item">💨<div class="label">Wipers ✨</div></div>
        <div class="final-bus-item">📯<div class="label">Horn 🔊</div></div>
        <div class="final-bus-item">🚪<div class="label">Door 🚪</div></div>
      </div>
      <div style="font-size:24px;margin:10px 0">🎉 ⭐ ⭐ ⭐ 🎉</div>
      <a class="home-link" href="https://nonomil.github.io/childrens-library/courseware/">🏠 回课件列表</a>
    </div>`;
    launchConfetti(); updateUI(idx); return;
  }

  let gameHTML='';
  if(p.game){
    gameHTML=startWordGame(idx,p.game);
    buildingWord=[];
  }

  area.innerHTML=`<div class="page active">
    <div class="scene-wrap" style="position:relative">${getSVG(idx)}</div>
    <div class="lyrics">${p.sentence}</div>
    ${gameHTML}
  </div>`;

  // Make clickable words speak
  area.querySelectorAll('.hl[data-word]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      speakText(this.getAttribute('data-word'));
      showBubble('🔊 '+this.getAttribute('data-word'));
    });
  });

  updateUI(idx);
}

function updateUI(idx) {
  const dots=document.getElementById('progressDots');
  dots.innerHTML=pages.map((_,i)=>'<div class="dot '+(i===idx?'active':'')+(gameDone[i]?' done':'')+'" onclick="goToPage('+i+')"></div>').join('');
  document.getElementById('prevBtn').disabled=idx===0;
  document.getElementById('nextBtn').disabled=idx===pages.length-1;
  document.getElementById('pageCounter').textContent='第'+(idx+1)+'页 / 共'+pages.length+'页';
  document.getElementById('nextBtn').style.display=idx===pages.length-1?'none':'';
  currentPage=idx;
}

function prevPage(){if(currentPage>0)goToPage(currentPage-1);}
function nextPage(){if(currentPage<pages.length-1)goToPage(currentPage+1);}
function goToPage(idx){renderPage(idx);}

function speakPage() {
  const p=pages[currentPage];
  if(p.cover) { showBubble('The Wheels on the Bus! 🚌'); speakText('The Wheels on the Bus'); return; }
  if(p.final) { showBubble('You did it! Super English Star! 🌟'); speakText('You did it! Super English Star!'); return; }
  const txt=p.sentence.replace(/<[^>]+>/g,'');
  showBubble('🔊 '+txt);
  speakText(txt);
}

// ====== CONFETTI ======
function launchConfetti() {
  const d=document.createElement('div');d.className='celebration';
  const colors=['#FF6B6B','#FFB347','#4ECDC4','#FFE66D','#A78BFA','#FF9FF3'];
  for(let i=0;i<40;i++){const c=document.createElement('div');c.style.cssText='position:absolute;width:'+(6+Math.random()*8)+'px;height:'+(6+Math.random()*8)+'px;border-radius:50%;left:'+(Math.random()*100)+'%;top:10%;background:'+colors[i%colors.length]+';animation:confetti-fall '+(1.5+Math.random())+'s ease-out forwards;animation-delay:'+(Math.random()*0.5)+'s;';d.appendChild(c);}
  document.body.appendChild(d);setTimeout(()=>d.remove(),3000);
}

// ====== KEYBOARD ======
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') prevPage();
  if(e.key==='ArrowRight') nextPage();
});

// ====== INIT ======
renderPage(0);
</script>
