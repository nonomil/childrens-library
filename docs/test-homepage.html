<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎪 小朋友的互动学习乐园</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700;900&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
body { 
  font-family: 'Noto Sans SC', sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  background: #87CEEB;
  cursor: default;
  touch-action: none;
}

/* ===== 开始界面 ===== */
.start-screen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, #1a237e 0%, #283593 40%, #1565c0 100%);
  z-index: 999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s;
}
.start-screen.hide { opacity: 0; pointer-events: none; }
.start-title {
  font-size: min(42px, 8vw);
  font-weight: 900;
  color: #FFD54F;
  text-shadow: 3px 3px 0 #5D4037, 6px 6px 0 rgba(0,0,0,0.3);
  margin-bottom: 8px;
}
.start-sub { color: #B3E5FC; font-size: min(16px, 3vw); margin-bottom: 40px; }
.start-btn {
  background: linear-gradient(180deg, #66BB6A 0%, #43A047 100%);
  color: white;
  border: 4px solid #2E7D32;
  padding: 14px 48px;
  font-size: 20px;
  font-weight: 900;
  border-radius: 12px;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 6px 0 #1B5E20, 0 8px 20px rgba(0,0,0,0.3);
  transition: all 0.1s;
  text-shadow: 2px 2px 0 #1B5E20;
}
.start-btn:hover { transform: translateY(-2px); }
.start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1B5E20; }
.start-chars { margin-top: 30px; font-size: 40px; letter-spacing: 10px; }

/* ===== 游戏世界 ===== */
.game-world {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(180deg, #87CEEB 0%, #B0E0FF 50%, #87CEEB 50.1%, #4CAF50 70%, #388E3C 100%);
}

/* 天空层 - 视差慢速 */
.sky-layer {
  position: absolute;
  top: 0; left: 0;
  width: 200%;
  height: 55%;
  transition: transform 0.1s linear;
  image-rendering: pixelated;
}
.sky-layer img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  image-rendering: pixelated;
}

/* 太阳 */
.sun {
  position: absolute;
  top: 8%;
  right: 15%;
  width: 80px;
  height: 80px;
  background: radial-gradient(circle, #FFD54F 40%, #FFC107 70%, transparent 71%);
  border-radius: 50%;
  box-shadow: 0 0 40px #FFD54F, 0 0 80px rgba(255,213,79,0.4);
  animation: sunPulse 3s ease-in-out infinite;
  z-index: 5;
}
@keyframes sunPulse {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  50% { transform: scale(1.05); opacity: 1; }
}

/* 云朵 */
.cloud {
  position: absolute;
  z-index: 6;
  opacity: 0.9;
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: white;
  border-radius: 50%;
}
.cloud-1 { top: 12%; left: 10%; animation: cloudFloat 20s linear infinite; }
.cloud-1::before { width: 60px; height: 40px; top: 10px; left: 0; }
.cloud-1::after { width: 80px; height: 50px; top: 0; left: 30px; }
.cloud-2 { top: 18%; left: 50%; animation: cloudFloat 25s linear infinite; }
.cloud-2::before { width: 50px; height: 35px; top: 8px; left: 0; }
.cloud-2::after { width: 70px; height: 45px; top: 0; left: 25px; }
.cloud-3 { top: 8%; left: 75%; animation: cloudFloat 18s linear infinite; }
.cloud-3::before { width: 45px; height: 30px; top: 10px; left: 0; }
.cloud-3::after { width: 65px; height: 40px; top: 0; left: 20px; }
@keyframes cloudFloat {
  0% { transform: translateX(0); }
  100% { transform: translateX(-120vw); }
}

/* 地面层 - 视差快速 */
.ground-layer {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  height: 55%;
  background: 
    linear-gradient(180deg, #66BB6A 0%, #4CAF50 5%, #388E3C 15%, #5D4037 20%, #795548 40%, #8D6E63 100%);
  z-index: 10;
}

/* 蜿蜒小路 */
.path-overlay {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  height: 55%;
  z-index: 11;
  pointer-events: none;
}
.path-overlay svg {
  width: 100%;
  height: 100%;
}

/* ===== 建筑 ===== */
.building {
  position: absolute;
  z-index: 50;
  cursor: pointer;
  transition: transform 0.2s;
  text-align: center;
}
.building:hover { transform: scale(1.08); z-index: 60; }
.building:active { transform: scale(0.95); }

.building-img {
  width: 100%;
  height: auto;
  image-rendering: pixelated;
  filter: drop-shadow(3px 5px 4px rgba(0,0,0,0.35));
  transition: filter 0.2s;
}
.building:hover .building-img {
  filter: drop-shadow(3px 5px 8px rgba(255,213,79,0.6));
}

/* CSS建筑（无图片时的后备） */
.building-css {
  position: relative;
  image-rendering: pixelated;
}
.building-css .roof {
  width: 100%;
  height: 40%;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}
.building-css .wall {
  width: 100%;
  height: 60%;
  border: 3px solid rgba(0,0,0,0.2);
}

/* 建筑标签 */
.building-label {
  position: absolute;
  bottom: -28px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  color: #FFD54F;
  padding: 4px 12px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  border: 2px solid #FFD54F;
  z-index: 70;
}
.building:hover .building-label { opacity: 1; }

/* NEW标记 */
.badge-new {
  position: absolute;
  top: -8px;
  right: -8px;
  background: #EF5350;
  color: white;
  font-size: 9px;
  font-weight: 900;
  padding: 2px 6px;
  border-radius: 8px;
  border: 2px solid white;
  z-index: 71;
  animation: badgeBounce 1s ease-in-out infinite;
}
@keyframes badgeBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

/* 课程数量 */
.building-count {
  position: absolute;
  top: -12px;
  left: -8px;
  background: #4CAF50;
  color: white;
  font-size: 10px;
  font-weight: 900;
  padding: 2px 8px;
  border-radius: 10px;
  border: 2px solid white;
  z-index: 71;
}

/* ===== 角色 Steve ===== */
#steve {
  position: absolute;
  z-index: 100;
  transition: left 0.4s ease-out, bottom 0.3s ease-out;
  pointer-events: none;
}
#steve img {
  image-rendering: pixelated;
  width: 48px;
  height: 96px;
  filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.4));
}
#steve.walking img {
  animation: steveWalkBounce 0.3s steps(2) infinite;
}
@keyframes steveWalkBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
#steve.facing-left img { transform: scaleX(-1); }

/* Steve名字标签 */
.steve-name {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  white-space: nowrap;
}

/* ===== HUD ===== */
.hud {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  gap: 12px;
  background: rgba(0,0,0,0.65);
  padding: 8px 20px;
  border-radius: 20px;
  backdrop-filter: blur(8px);
  border: 2px solid rgba(255,255,255,0.15);
}
.hud-item {
  color: white;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* 标题 */
.game-title {
  position: fixed;
  top: 55px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  color: #FFD54F;
  font-size: min(20px, 4vw);
  font-weight: 900;
  text-shadow: 2px 2px 0 #5D4037, 3px 3px 0 rgba(0,0,0,0.3);
  white-space: nowrap;
  pointer-events: none;
}

/* 操作提示 */
.controls-hint {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  background: rgba(0,0,0,0.7);
  color: #B0BEC5;
  padding: 8px 20px;
  border-radius: 12px;
  font-size: 12px;
  text-align: center;
  pointer-events: none;
}
.controls-hint kbd {
  background: #37474F;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid #546E7A;
  font-size: 11px;
  color: #FFD54F;
}

/* 蝴蝶 */
.butterfly {
  position: absolute;
  z-index: 80;
  font-size: 18px;
  animation: butterflyFly 12s ease-in-out infinite;
  pointer-events: none;
}
@keyframes butterflyFly {
  0% { transform: translate(0, 0) rotate(0deg); }
  25% { transform: translate(80px, -40px) rotate(10deg); }
  50% { transform: translate(40px, -80px) rotate(-5deg); }
  75% { transform: translate(-40px, -30px) rotate(8deg); }
  100% { transform: translate(0, 0) rotate(0deg); }
}

/* 粒子效果 */
.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 75;
  animation: particleFloat 4s ease-in-out infinite;
}
@keyframes particleFloat {
  0% { opacity: 0; transform: translateY(0); }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-60px); }
}

/* 树木 */
.tree {
  position: absolute;
  z-index: 45;
  pointer-events: none;
}
.tree img {
  image-rendering: pixelated;
  filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.3));
}
</style>
</head>
<body>

<!-- 开始界面 -->
<div class="start-screen" id="startScreen">
  <div class="start-title">🎪 学习乐园</div>
  <div class="start-sub">和 Steve 一起探索学习世界！</div>
  <button class="start-btn" onclick="startGame()">▶ 开始冒险</button>
  <div class="start-chars">⚒️⛏️🪓</div>
</div>

<!-- 游戏世界 -->
<div class="game-world" id="gameWorld">
  
  <!-- 太阳 -->
  <div class="sun"></div>
  
  <!-- 云朵 -->
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  
  <!-- 蝴蝶 -->
  <div class="butterfly" style="top:25%;left:30%">🦋</div>
  <div class="butterfly" style="top:30%;left:65%;animation-delay:-4s">🦋</div>
  
  <!-- 树木装饰 -->
  <div class="tree" style="bottom:52%;left:5%;z-index:45">
    <img src="assets/sprites/Leaves.PNG" width="48" height="48" style="filter:hue-rotate(0deg)">
  </div>
  <div class="tree" style="bottom:54%;left:22%;z-index:44">
    <img src="assets/sprites/Leaves.PNG" width="40" height="40">
  </div>
  <div class="tree" style="bottom:50%;left:42%;z-index:46">
    <img src="assets/sprites/Leaves.PNG" width="52" height="52" style="filter:hue-rotate(-10deg)">
  </div>
  <div class="tree" style="bottom:53%;left:60%;z-index:44">
    <img src="assets/sprites/Leaves.PNG" width="36" height="36">
  </div>
  <div class="tree" style="bottom:51%;left:80%;z-index:45">
    <img src="assets/sprites/Leaves.PNG" width="44" height="44" style="filter:hue-rotate(10deg)">
  </div>
  <div class="tree" style="bottom:55%;left:92%;z-index:43">
    <img src="assets/sprites/Leaves.PNG" width="38" height="38">
  </div>
  
  <!-- 粒子效果 -->
  <div class="particle" style="bottom:48%;left:15%;background:#FFD54F;animation-delay:0s"></div>
  <div class="particle" style="bottom:50%;left:35%;background:#FF7043;animation-delay:-1.5s"></div>
  <div class="particle" style="bottom:47%;left:55%;background:#AB47BC;animation-delay:-3s"></div>
  <div class="particle" style="bottom:49%;left:75%;background:#26C6DA;animation-delay:-2s"></div>
  
  <!-- 建筑群 -->
  <div id="buildings-container"></div>
  
  <!-- Steve 角色 -->
  <div id="steve">
    <div class="steve-name">Steve</div>
    <img id="steveImg" src="assets/sprites/steve-front.png" alt="Steve">
  </div>
</div>

<!-- HUD -->
<div class="hud">
  <div class="hud-item">⭐ <span id="starCount">0</span></div>
  <div class="hud-item">📚 <span id="courseCount">123</span> 课</div>
  <div class="hud-item">🏆 <span id="badgeCount">0</span></div>
</div>

<div class="game-title">🎪 小朋友的互动学习乐园</div>

<!-- 操作提示 -->
<div class="controls-hint">
  <span class="mobile-hint" style="display:none">👆 点击地图移动 | 点击建筑探索</span>
  <span class="desktop-hint">⌨️ <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> 移动 | 🖱️ 点击移动 | 点击建筑探索</span>
</div>

<script>
// ===== 建筑数据 =====
const BUILDINGS = [
  { id:'music', name:'🎵 音乐喷泉', desc:'唱童谣、听节奏', count:27, color:'#AB47BC', x:0.12, y:0.52, link:'courseware/twinkle-twinkle.html', size:90, img:'building-music.png' },
  { id:'math', name:'🔨 数学铁匠铺', desc:'算数、逻辑、思维', count:24, color:'#FF7043', x:0.28, y:0.40, link:'courseware/village.html', size:100, img:'building-math.png', isNew:true },
  { id:'english', name:'📚 英语图书馆', desc:'字母、单词、阅读', count:24, color:'#42A5F5', x:0.44, y:0.48, link:'courseware/', size:95, img:'building-english.png' },
  { id:'story', name:'🍞 故事面包房', desc:'中文+英文故事', count:20, color:'#66BB6A', x:0.60, y:0.42, link:'courseware/story_extra_01_小蜗牛慢慢游历记.html', size:85, img:'building-story.png', isNew:true },
  { id:'poetry', name:'⛩️ 古诗神社', desc:'唐诗宋词讲解', count:20, color:'#EF5350', x:0.18, y:0.30, link:'courseware/poem_explain_01_咏鹅.html', size:80, isNew:true },
  { id:'chinese', name:'🏮 语文灯笼铺', desc:'课文、拼音、识字', count:24, color:'#FFA726', x:0.38, y:0.28, link:'courseware/chinese_01_小壁虎借尾巴.html', size:85 },
  { id:'picture', name:'🎨 绘本画廊', desc:'经典英文绘本', count:8, color:'#26C6DA', x:0.72, y:0.34, link:'courseware/pigeon_bus.html', size:75 },
  { id:'lesson', name:'🎓 教案工坊', desc:'亲子互动教案', count:10, color:'#78909C', x:0.86, y:0.50, link:'courseware/lesson_extra_01_数学启蒙：比大小.html', size:70, isNew:true },
];

// ===== 游戏状态 =====
let gameState = {
  started: false,
  steveX: 0.5,
  steveY: 0.48,
  targetX: null,
  targetY: null,
  moving: false,
  keys: {},
  worldWidth: 0,
};

// ===== 初始化建筑 =====
function initBuildings() {
  const container = document.getElementById('buildings-container');
  container.innerHTML = '';
  
  BUILDINGS.forEach(b => {
    const el = document.createElement('div');
    el.className = 'building';
    el.style.left = (b.x * 100) + '%';
    el.style.bottom = (b.y * 100) + '%';
    el.style.width = b.size + 'px';
    el.style.transform = 'translate(-50%, 50%)';
    
    // 检查是否有图片
    const imgSrc = 'assets/sprites/' + b.img;
    let imgEl = `<img class="building-img" src="${imgSrc}" alt="${b.name}" 
      onerror="this.parentElement.querySelector('.building-css-fallback').style.display='block';this.style.display='none'">`;
    
    // CSS后备建筑
    let cssFallback = `<div class="building-css-fallback" style="display:none;width:100%;padding-top:100%;background:linear-gradient(180deg,${b.color} 0%,${b.color}dd 100%);border-radius:8px;border:3px solid rgba(0,0,0,0.2);box-shadow:inset 0 -10px 20px rgba(0,0,0,0.15)">
      <div style="position:absolute;top:15%;left:50%;transform:translateX(-50%);font-size:${b.size*0.4}px;text-shadow:2px 2px 4px rgba(0,0,0,0.3)">${b.name.split(' ')[0]}</div>
    </div>`;
    
    el.innerHTML = `
      ${imgEl}
      ${cssFallback}
      <div class="building-label">${b.name}<br><small style="color:#aaa">${b.desc} (${b.count}课)</small></div>
      ${b.isNew ? '<div class="badge-new">NEW</div>' : ''}
      <div class="building-count">${b.count}课</div>
    `;
    
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      moveToBuilding(b);
    });
    
    container.appendChild(el);
  });
}

// ===== Steve 角色 =====
function updateSteve() {
  const steve = document.getElementById('steve');
  const world = document.getElementById('gameWorld');
  const w = world.offsetWidth;
  const h = world.offsetHeight;
  
  steve.style.left = (gameState.steveX * w) + 'px';
  steve.style.bottom = (gameState.steveY * h - 20) + 'px';
}

function setSteveFacing(direction) {
  const steve = document.getElementById('steve');
  if (direction === 'left') {
    steve.classList.add('facing-left');
  } else {
    steve.classList.remove('facing-left');
  }
}

function setSteveMoving(moving) {
  const steve = document.getElementById('steve');
  if (moving) {
    steve.classList.add('walking');
    // 切换到行走图
    const img = document.getElementById('steveImg');
    if (!img.src.includes('walk')) {
      img.src = 'assets/sprites/steve-walk-right.png';
    }
  } else {
    steve.classList.remove('walking');
    const img = document.getElementById('steveImg');
    img.src = 'assets/sprites/steve-front.png';
  }
}

// ===== 移动逻辑 =====
function moveToBuilding(building) {
  // Steve走向建筑
  gameState.targetX = building.x;
  gameState.targetY = building.y - 0.05;
  gameState.moving = true;
  
  setSteveFacing(building.x > gameState.steveX ? 'right' : 'left');
  setSteveMoving(true);
  
  // 到达后导航
  const checkArrival = setInterval(() => {
    const dx = Math.abs(gameState.steveX - gameState.targetX);
    const dy = Math.abs(gameState.steveY - gameState.targetY);
    if (dx < 0.02 && dy < 0.02) {
      clearInterval(checkArrival);
      setSteveMoving(false);
      // 显示确认对话
      if (confirm(`要去 ${building.name} 吗？\n${building.desc} (${building.count}课)`)) {
        window.location.href = building.link;
      }
    }
  }, 100);
}

function moveSteve(dx, dy) {
  gameState.steveX = Math.max(0.05, Math.min(0.95, gameState.steveX + dx));
  gameState.steveY = Math.max(0.15, Math.min(0.55, gameState.steveY + dy));
  updateSteve();
}

// ===== 键盘控制 =====
document.addEventListener('keydown', (e) => {
  if (!gameState.started) return;
  gameState.keys[e.key] = true;
  
  const speed = 0.02;
  if (e.key === 'ArrowLeft' || e.key === 'a') { moveSteve(-speed, 0); setSteveFacing('left'); setSteveMoving(true); }
  if (e.key === 'ArrowRight' || e.key === 'd') { moveSteve(speed, 0); setSteveFacing('right'); setSteveMoving(true); }
  if (e.key === 'ArrowUp' || e.key === 'w') { moveSteve(0, speed); setSteveMoving(true); }
  if (e.key === 'ArrowDown' || e.key === 's') { moveSteve(0, -speed); setSteveMoving(true); }
  
  e.preventDefault();
});

document.addEventListener('keyup', (e) => {
  gameState.keys[e.key] = false;
  if (!Object.values(gameState.keys).some(v => v)) {
    setSteveMoving(false);
  }
});

// ===== 触摸/点击控制 =====
document.getElementById('gameWorld').addEventListener('click', (e) => {
  if (!gameState.started) return;
  
  // 检查是否点击了建筑
  if (e.target.closest('.building')) return;
  
  const world = document.getElementById('gameWorld');
  const rect = world.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) / rect.width;
  const clickY = 1 - (e.clientY - rect.top) / rect.height; // 翻转Y
  
  gameState.targetX = Math.max(0.05, Math.min(0.95, clickX));
  gameState.targetY = Math.max(0.15, Math.min(0.55, clickY));
  gameState.moving = true;
  
  setSteveFacing(gameState.targetX > gameState.steveX ? 'right' : 'left');
  setSteveMoving(true);
  
  // 动画移动
  const moveInterval = setInterval(() => {
    const dx = gameState.targetX - gameState.steveX;
    const dy = gameState.targetY - gameState.steveY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < 0.015) {
      clearInterval(moveInterval);
      gameState.moving = false;
      setSteveMoving(false);
      return;
    }
    
    const speed = 0.015;
    moveSteve(dx * speed * 5, dy * speed * 5);
  }, 30);
});

// ===== 移动端检测 =====
if ('ontouchstart' in window) {
  document.querySelector('.desktop-hint').style.display = 'none';
  document.querySelector('.mobile-hint').style.display = 'inline';
}

// ===== 开始游戏 =====
function startGame() {
  document.getElementById('startScreen').classList.add('hide');
  gameState.started = true;
  gameState.steveX = 0.5;
  gameState.steveY = 0.35;
  updateSteve();
}

// ===== 初始化 =====
window.addEventListener('load', () => {
  initBuildings();
  updateSteve();
});

window.addEventListener('resize', () => {
  updateSteve();
});
</script>
