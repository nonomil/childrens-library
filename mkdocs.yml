site_name: 🎪 小朋友的互动学习乐园
site_description: 互动课件 · 幼儿启蒙 · 在玩中学
theme:
  name: material
  language: zh
  palette:
    primary: teal
    accent: deep orange
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.indexes

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/solid/book
      link: https://github.com/nonomil/my-notes

