site_name: 🎪 小朋友的互动学习乐园
site_description: 互动课件 · 幼儿启蒙 · 在玩中学
theme:
  name: material
  language: zh
  palette:
    primary: teal
    accent: deep orange
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.indexes

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/solid/book
      link: https://github.com/nonomil/my-notes

nav:
  - 首页: index.md
  - 绘本列表:
    - The Gruffalo: books/gruffalo.md
    - Don't Let the Pigeon Drive the Bus!:
      - 介绍: books/pigeon_bus.md
      - 🎯 逐页阅读: books/pigeon_bus_reader.md
    - Knuffle Bunny: books/knuffle_bunny.md
    - Pete the Cat: books/pete_cat.md
    - Little Critter: books/little_critter.md
    - Where the Wild Things Are: books/wild_things.md
    - Winnie the Witch: books/winnie_witch.md
    - The Day the Crayons Quit: books/crayons_quit.md
  - 🎯 互动课件:
    - courseware/index.md
    - 🎵 童谣:
      - 🌟 Twinkle Twinkle: courseware/twinkle-twinkle.html
      - 🚜 Old MacDonald: courseware/old-macdonald.html
      - 🐵 Five Little Monkeys: courseware/five-little-monkeys.html
    - 🔤 英语:
      - 🐱 Fat Cat - Phonics: courseware/phonics-fat-cat.html
      - 🎉 Come to the Party!: courseware/sight-word-tales-come-to-the-party.html
      - 🐱 Can We Get a Pet?: courseware/sight-word-tales-can-we-get-a-pet.html
      - 🐘 Elephant & Piggie: courseware/elephant-piggie-surprise.html
    - 🌱 科学:
      - 🍎 I Am an Apple: courseware/i-am-an-apple.html
      - ⚙️ 齿轮传动: courseware/gears-transmission.html
      - 🌴 雨林大冒险: courseware/rainforest-adventure.html
    - 🀄 语文:
      - 🌿 大自然识字: courseware/nature-lesson-4.html
  - 全部PDF打包下载: download.md
